# Probe pods: one per `app.kubernetes.io/component` value the NetworkPolicies
# select on, plus one with no component at all and one in the ingress
# controller's namespace, plus two named APIs (MAIR-610: Keycloak admits
# APIs by their app.kubernetes.io/name). They carry the component (and name)
# labels but never `app`, so no chart Service selects them.
apiVersion: v1
kind: Pod
metadata:
  name: probe-ingress
  # The ingress controller's namespace, created by run.sh (Traefik install):
  # global.ingressController is "traefik" in tests/e2e/values.yaml.
  namespace: traefik
  labels: { mairie360.fr/e2e-probe: "true" }
spec:
  terminationGracePeriodSeconds: 0
  containers: [{ name: probe, image: "busybox:1.36", command: ["sleep", "3600"] }]
---
apiVersion: v1
kind: Pod
metadata:
  name: probe-none
  labels: { mairie360.fr/e2e-probe: "true" }
spec:
  terminationGracePeriodSeconds: 0
  containers: [{ name: probe, image: "busybox:1.36", command: ["sleep", "3600"] }]
---
apiVersion: v1
kind: Pod
metadata:
  name: probe-frontend
  labels: { mairie360.fr/e2e-probe: "true", app.kubernetes.io/component: frontend }
spec:
  terminationGracePeriodSeconds: 0
  containers: [{ name: probe, image: "busybox:1.36", command: ["sleep", "3600"] }]
---
apiVersion: v1
kind: Pod
metadata:
  name: probe-bff
  labels: { mairie360.fr/e2e-probe: "true", app.kubernetes.io/component: bff }
spec:
  terminationGracePeriodSeconds: 0
  containers: [{ name: probe, image: "busybox:1.36", command: ["sleep", "3600"] }]
---
apiVersion: v1
kind: Pod
metadata:
  name: probe-api
  labels: { mairie360.fr/e2e-probe: "true", app.kubernetes.io/component: api }
spec:
  terminationGracePeriodSeconds: 0
  containers: [{ name: probe, image: "busybox:1.36", command: ["sleep", "3600"] }]
---
apiVersion: v1
kind: Pod
metadata:
  name: probe-migration
  labels: { mairie360.fr/e2e-probe: "true", app.kubernetes.io/component: migration }
spec:
  terminationGracePeriodSeconds: 0
  containers: [{ name: probe, image: "busybox:1.36", command: ["sleep", "3600"] }]
---
apiVersion: v1
kind: Pod
metadata:
  name: probe-backup
  labels: { mairie360.fr/e2e-probe: "true", app.kubernetes.io/component: backup }
spec:
  terminationGracePeriodSeconds: 0
  containers: [{ name: probe, image: "busybox:1.36", command: ["sleep", "3600"] }]
---
apiVersion: v1
kind: Pod
metadata:
  name: probe-keycloak
  labels: { mairie360.fr/e2e-probe: "true", app.kubernetes.io/component: keycloak }
spec:
  terminationGracePeriodSeconds: 0
  containers: [{ name: probe, image: "busybox:1.36", command: ["sleep", "3600"] }]
---
apiVersion: v1
kind: Pod
metadata:
  name: probe-retention
  labels: { mairie360.fr/e2e-probe: "true", app.kubernetes.io/component: retention }
spec:
  terminationGracePeriodSeconds: 0
  containers: [{ name: probe, image: "busybox:1.36", command: ["sleep", "3600"] }]
---
# MAIR-610: core-api is a Keycloak client (APIs.keycloakClientInstances).
apiVersion: v1
kind: Pod
metadata:
  name: probe-core-api
  labels: { mairie360.fr/e2e-probe: "true", app.kubernetes.io/component: api, app.kubernetes.io/name: core-api }
spec:
  terminationGracePeriodSeconds: 0
  containers: [{ name: probe, image: "busybox:1.36", command: ["sleep", "3600"] }]
---
# MAIR-610: an API that is not a Keycloak client.
apiVersion: v1
kind: Pod
metadata:
  name: probe-project-api
  labels: { mairie360.fr/e2e-probe: "true", app.kubernetes.io/component: api, app.kubernetes.io/name: project-api }
spec:
  terminationGracePeriodSeconds: 0
  containers: [{ name: probe, image: "busybox:1.36", command: ["sleep", "3600"] }]
