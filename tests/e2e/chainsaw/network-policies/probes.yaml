# Probe pods: one per `app.kubernetes.io/component` value the NetworkPolicies
# select on, plus one with no component at all and one in the ingress
# controller's namespace. They carry the component label but never `app`, so
# no chart Service selects them.
apiVersion: v1
kind: Namespace
metadata:
  name: ingress-nginx
---
apiVersion: v1
kind: Pod
metadata:
  name: probe-ingress
  namespace: ingress-nginx
  labels: { mairie360.fr/e2e-probe: "true" }
spec:
  terminationGracePeriodSeconds: 0
  containers: [{ name: probe, image: "busybox:1.36", command: ["sleep", "3600"] }]
---
apiVersion: v1
kind: Pod
metadata:
  name: probe-none
  labels: { mairie360.fr/e2e-probe: "true" }
spec:
  terminationGracePeriodSeconds: 0
  containers: [{ name: probe, image: "busybox:1.36", command: ["sleep", "3600"] }]
---
apiVersion: v1
kind: Pod
metadata:
  name: probe-frontend
  labels: { mairie360.fr/e2e-probe: "true", app.kubernetes.io/component: frontend }
spec:
  terminationGracePeriodSeconds: 0
  containers: [{ name: probe, image: "busybox:1.36", command: ["sleep", "3600"] }]
---
apiVersion: v1
kind: Pod
metadata:
  name: probe-bff
  labels: { mairie360.fr/e2e-probe: "true", app.kubernetes.io/component: bff }
spec:
  terminationGracePeriodSeconds: 0
  containers: [{ name: probe, image: "busybox:1.36", command: ["sleep", "3600"] }]
---
apiVersion: v1
kind: Pod
metadata:
  name: probe-api
  labels: { mairie360.fr/e2e-probe: "true", app.kubernetes.io/component: api }
spec:
  terminationGracePeriodSeconds: 0
  containers: [{ name: probe, image: "busybox:1.36", command: ["sleep", "3600"] }]
---
apiVersion: v1
kind: Pod
metadata:
  name: probe-migration
  labels: { mairie360.fr/e2e-probe: "true", app.kubernetes.io/component: migration }
spec:
  terminationGracePeriodSeconds: 0
  containers: [{ name: probe, image: "busybox:1.36", command: ["sleep", "3600"] }]
---
apiVersion: v1
kind: Pod
metadata:
  name: probe-backup
  labels: { mairie360.fr/e2e-probe: "true", app.kubernetes.io/component: backup }
spec:
  terminationGracePeriodSeconds: 0
  containers: [{ name: probe, image: "busybox:1.36", command: ["sleep", "3600"] }]
---
apiVersion: v1
kind: Pod
metadata:
  name: probe-keycloak
  labels: { mairie360.fr/e2e-probe: "true", app.kubernetes.io/component: keycloak }
spec:
  terminationGracePeriodSeconds: 0
  containers: [{ name: probe, image: "busybox:1.36", command: ["sleep", "3600"] }]
