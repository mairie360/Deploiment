# Checks the per-service accounts end to end:
#  - Redis (MAIR-113): the ACL file generated at container start gives each
#    API/BFF an account restricted to its own key prefix and commands, and
#    the `default` account is off.
#  - Postgres (MAIR-114): the role password the chart passes to Liquibase
#    is the one the API receives, so the API role can log in.
#  - Keycloak (MAIR-139): the realm was imported at first start with its
#    roles and clients, and the `${BFF_USER_CLIENT_SECRET}` placeholder was
#    resolved from the Secret: bff-user can get a token with that secret.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: data-access
spec:
  bindings:
    - name: release
      value: e2e
  steps:
    - name: start the clients
      try:
        - apply:
            file: clients.yaml
        - wait:
            apiVersion: v1
            kind: Pod
            name: client-redis
            timeout: 2m
            for:
              condition:
                name: Ready
        - wait:
            apiVersion: v1
            kind: Pod
            name: client-postgres
            timeout: 2m
            for:
              condition:
                name: Ready
        - wait:
            apiVersion: v1
            kind: Pod
            name: client-keycloak
            timeout: 2m
            for:
              condition:
                name: Ready

    - name: redis ACL
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -u
              kubectl -n "$NAMESPACE" exec client-redis -- sh -c '
                FAILED=0
                role() { redis-cli -h "$REDIS_HOST" --user core-api --pass "$ROLE_PASSWORD" --no-auth-warning "$@" 2>&1; }
                expect() { # <label> <expected substring> <actual output>
                  case "$3" in
                    *"$2"*) echo "ok    $1" ;;
                    *) echo "FAIL  $1: expected \"$2\", got \"$3\""; FAILED=1 ;;
                  esac
                }
                expect "anonymous access is refused" NOAUTH \
                  "$(redis-cli -h "$REDIS_HOST" get x 2>&1)"
                expect "wrong password is refused" WRONGPASS \
                  "$(redis-cli -h "$REDIS_HOST" --user core-api --pass wrong --no-auth-warning ping 2>&1)"
                expect "role writes its own prefix" OK "$(role set core-api:e2e 1)"
                expect "role reads its own prefix" 1 "$(role get core-api:e2e)"
                expect "role cannot touch another prefix" NOPERM "$(role set user-bff:e2e 1)"
                expect "role cannot run other commands" NOPERM "$(role flushall)"
                expect "admin account works" PONG \
                  "$(redis-cli -h "$REDIS_HOST" --user admin --pass "$ADMIN_PASSWORD" --no-auth-warning ping 2>&1)"
                exit $FAILED
              '
            check:
              ($error): ~

    - name: postgres role
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -u
              kubectl -n "$NAMESPACE" exec client-postgres -- sh -c '
                FAILED=0
                if psql -U core_api -tAc "select current_user" | grep -qx core_api; then
                  echo "ok    core_api logs in with the password from the Secret"
                else
                  echo "FAIL  core_api cannot log in"; FAILED=1
                fi
                if PGPASSWORD=wrong psql -U core_api -c "select 1" >/dev/null 2>&1; then
                  echo "FAIL  core_api logs in with a wrong password"; FAILED=1
                else
                  echo "ok    wrong password is refused"
                fi
                if psql -U core_api -tAc "select rolsuper from pg_roles where rolname = current_user" | grep -qx f; then
                  echo "ok    core_api is not a superuser"
                else
                  echo "FAIL  core_api is a superuser"; FAILED=1
                fi
                exit $FAILED
              '
            check:
              ($error): ~

    - name: keycloak realm
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -u
              kubectl -n "$NAMESPACE" exec client-keycloak -- sh -c '
                FAILED=0
                REALM="$KEYCLOAK_URL/realms/mairie360"
                disco=$(curl -sf -m 10 "$REALM/.well-known/openid-configuration" 2>&1)
                case "$disco" in
                  *"\"issuer\":\"https://auth."*"/realms/mairie360\""*) echo "ok    realm imported, issuer is the public hostname" ;;
                  *) echo "FAIL  realm discovery: $disco"; FAILED=1 ;;
                esac
                token=$(curl -s -m 10 -X POST "$REALM/protocol/openid-connect/token" \
                  -d grant_type=client_credentials -d client_id=bff-user \
                  -d client_secret="$CLIENT_SECRET" 2>&1)
                case "$token" in
                  *access_token*) echo "ok    bff-user authenticates with the secret from the Secret" ;;
                  *) echo "FAIL  bff-user client_credentials: $token"; FAILED=1 ;;
                esac
                wrong=$(curl -s -m 10 -X POST "$REALM/protocol/openid-connect/token" \
                  -d grant_type=client_credentials -d client_id=bff-user \
                  -d client_secret=wrong 2>&1)
                case "$wrong" in
                  *access_token*) echo "FAIL  bff-user authenticates with a wrong secret"; FAILED=1 ;;
                  *) echo "ok    wrong client secret is refused" ;;
                esac
                pub=$(curl -s -m 10 -X POST "$REALM/protocol/openid-connect/token" \
                  -d grant_type=client_credentials -d client_id=login-front 2>&1)
                case "$pub" in
                  *access_token*) echo "FAIL  login-front (public client) got a service-account token"; FAILED=1 ;;
                  *) echo "ok    login-front is a public client without service account" ;;
                esac
                exit $FAILED
              '
            check:
              ($error): ~
