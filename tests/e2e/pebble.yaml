# Pebble, Let's Encrypt's test ACME server, standing in for Let's Encrypt in
# the e2e cluster (MAIR-260): cert-manager really solves HTTP-01 challenges
# through Traefik, and Pebble really fetches
# http://<host>/.well-known/acme-challenge/<token> on port 80, like Let's
# Encrypt does on a machine. Hostnames resolve through CoreDNS, which run.sh
# rewrites so that *.e2e.invalid points at Traefik's Service.
apiVersion: v1
kind: Namespace
metadata:
  name: pebble
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pebble
  namespace: pebble
data:
  pebble-config.json: |
    {
      "pebble": {
        "listenAddress": "0.0.0.0:14000",
        "managementListenAddress": "0.0.0.0:15000",
        "certificate": "test/certs/localhost/cert.pem",
        "privateKey": "test/certs/localhost/key.pem",
        "httpPort": 80,
        "tlsPort": 443,
        "ocspResponderURL": "",
        "externalAccountBindingRequired": false
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pebble
  namespace: pebble
spec:
  replicas: 1
  selector:
    matchLabels: { app: pebble }
  template:
    metadata:
      labels: { app: pebble }
    spec:
      containers:
        - name: pebble
          image: ghcr.io/letsencrypt/pebble:2.10.1
          args: ["-config", "/config/pebble-config.json", "-dnsserver", "10.43.0.10:53"]
          env:
            # No artificial delay before validating, and no random nonce
            # rejection: a slow or flaky CI run should not come from Pebble.
            - { name: PEBBLE_VA_NOSLEEP, value: "1" }
            - { name: PEBBLE_WFE_NONCEREJECT, value: "0" }
            # Every order solves fresh HTTP-01 challenges, even a renewal.
            - { name: PEBBLE_AUTHZREUSE, value: "0" }
          ports:
            - { name: acme, containerPort: 14000 }
          readinessProbe:
            tcpSocket: { port: acme }
          volumeMounts:
            - { name: config, mountPath: /config }
      volumes:
        - name: config
          configMap: { name: pebble }
---
apiVersion: v1
kind: Service
metadata:
  name: pebble
  namespace: pebble
spec:
  selector: { app: pebble }
  ports:
    - { name: acme, port: 14000, targetPort: acme }
---
# Same solver as bootstrap/cluster-addons/cluster-issuers.yaml, class "nginx"
# included: the chart's Ingress overrides it with
# acme.cert-manager.io/http01-ingress-ingressclassname, and this is where
# that override is proven.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: e2e-pebble
spec:
  acme:
    server: https://pebble.pebble.svc.cluster.local:14000/dir
    # Pebble serves its directory with a throwaway test certificate.
    skipTLSVerify: true
    privateKeySecretRef:
      name: e2e-pebble-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
