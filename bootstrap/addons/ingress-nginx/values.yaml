# Values of the ingress-nginx subchart (everything sits under `ingress-nginx:`).
ingress-nginx:
  controller:
    ingressClassResource:
      default: true
    service:
      type: LoadBalancer
      # Keeps the client's real source IP: without it every access log shows
      # the node's internal IP and any per-IP rate limit is useless.
      externalTrafficPolicy: Local
    config:
      # Nothing sits in front of the controller (ServiceLB only DNATs), so it
      # must NOT trust the X-Forwarded-* headers sent by clients: with "true"
      # and the default proxy-real-ip-cidr (0.0.0.0/0), a client-chosen
      # X-Forwarded-For became $remote_addr and was forwarded upstream,
      # letting anyone pick the IP the BFFs rate-limit on (MAIR-226). With
      # "false" the realip module is off and the controller sends
      # X-Forwarded-For = the TCP peer (compute-full-forwarded-for stays off:
      # it would append to, not replace, the client's header) and
      # X-Forwarded-Proto = its own scheme, since TLS terminates here. Set it
      # back to "true" only together with proxy-real-ip-cidr = the CIDR of a
      # trusted load balancer/CDN placed in front.
      use-forwarded-headers: "false"
      ssl-protocols: "TLSv1.2 TLSv1.3"
      hsts: "true"
    metrics:
      enabled: true
    resources:
      requests: { memory: 128Mi, cpu: 100m }
    tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: Exists
        effect: NoSchedule
