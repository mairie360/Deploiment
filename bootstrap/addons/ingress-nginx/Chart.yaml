# Wrapper chart: pins ingress-nginx on the INSTANCE machines not yet switched
# to Traefik. Applied by bootstrap/appsets/ingress-nginx-appset.yaml at the
# machine's own revision (Argo CD cluster annotation mairie360.fr/revision).
#
# ingress-nginx was retired upstream in March 2026: 4.15.1 (controller
# v1.15.1) is its last release and no further security fix will ship. It is
# being replaced by Traefik (../traefik, MAIR-260) one machine at a time; this
# chart and its AppSet are deleted once prod has switched
# (docs/adr/0001-replace-ingress-nginx.md). Do not treat this pin as
# maintained.
apiVersion: v2
name: bootstrap-ingress-nginx
description: ingress-nginx as installed on Mairie360 instance machines not yet on Traefik
type: application
version: 0.1.0
dependencies:
  - name: ingress-nginx
    # PINNED version: with '*', a major release would break the cluster
    # without any commit changing. Upgrades go through Renovate.
    # >= 4.11.5 / 4.12.1 is required for CVE-2025-1974 ("IngressNightmare",
    # unauthenticated RCE through the admission webhook) and
    # CVE-2025-1097/1098/24514/24513 (MAIR-228). Controller >= v1.13.2 is
    # also required by cert-manager >= 1.18, whose HTTP-01 solver Ingress
    # uses `pathType: Exact` (rejected by older controllers with
    # strict-validate-path-type, the default since v1.12).
    version: 4.15.1
    repository: https://kubernetes.github.io/ingress-nginx
