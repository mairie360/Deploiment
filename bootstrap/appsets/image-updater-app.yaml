apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-image-updater
  namespace: argocd
spec:
  project: mairie360-platform
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argocd-image-updater
    targetRevision: 1.3.1
    helm:
      releaseName: argocd-image-updater
      values: |
        # v1 drives the Applications through the Kubernetes API only (the
        # gRPC mode and its --applications-api flag are gone).
        config:
          log.level: info
          # Git write-back (MAIR-444): dev bumps arrive as PRs on main, staging
          # bumps as commits on the staging branch. The first line is the PR
          # title and the squash commit: a Conventional `chore` releases
          # nothing. .github/workflows/image-updater-automerge.yaml merges the
          # dev PRs once CI passes.
          git.user: argocd-image-updater
          git.email: noreply@argoproj.io
          git.commit-message-template: |
            chore(deps): update {{ .AppName }} images

            {{ range .AppChanges -}}
            - {{ .Image }}: {{ .OldTag }} -> {{ .NewTag }}
            {{ end -}}
          # Read access to GHCR, to list tags and their build dates
          # (newest-build strategy). argocd/ghcr-secret is written by ansible
          # (role k8s_argocd, from GHCR_USER / GHCR_TOKEN), never committed.
          # What to update is not configured here either: v1 reads
          # ImageUpdater resources, one per instance, rendered by the same
          # role (templates/image-updaters.yaml.j2).
          registries:
            - name: GitHub Container Registry
              api_url: https://ghcr.io
              prefix: ghcr.io
              ping: false
              credentials: pullsecret:argocd/ghcr-secret
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
