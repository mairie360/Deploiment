apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-image-updater
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argocd-image-updater
    targetRevision: 1.3.1
    helm:
      releaseName: argocd-image-updater
      values: |
        # On pilote les Applications directement via l'API Kubernetes
        # (patch de spec.source.helm.parameters), pas via l'API gRPC d'Argo CD :
        # évite tout souci de token / TLS avec un serveur en mode --insecure.
        extraArgs:
          - --applications-api=kubernetes

        config:
          log.level: info
          # Read access to GHCR, to list tags and their build dates
          # (newest-build strategy). argocd/ghcr-secret is written by ansible
          # (role k8s_argocd, from GHCR_USER / GHCR_TOKEN), never committed.
          # What to update is not configured here either: v1 reads
          # ImageUpdater resources, one per instance, rendered by the same
          # role (templates/image-updaters.yaml.j2).
          registries:
            - name: GitHub Container Registry
              api_url: https://ghcr.io
              prefix: ghcr.io
              ping: false
              credentials: pullsecret:argocd/ghcr-secret
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
