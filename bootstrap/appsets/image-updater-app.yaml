apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-image-updater
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argocd-image-updater
    targetRevision: 1.3.1
    helm:
      releaseName: argocd-image-updater
      values: |
        # On pilote les Applications directement via l'API Kubernetes
        # (patch de spec.source.helm.parameters), pas via l'API gRPC d'Argo CD :
        # évite tout souci de token / TLS avec un serveur en mode --insecure.
        extraArgs:
          - --applications-api=kubernetes

        config:
          log.level: info
          # Accès en lecture à GHCR pour lire les tags et leurs dates de build
          # (stratégie newest-build). Le secret est créé par
          # configs/ghcr-registry-secret.yaml.
          registries:
            - name: GitHub Container Registry
              api_url: https://ghcr.io
              prefix: ghcr.io
              ping: false
              credentials: pullsecret:argocd/ghcr-secret
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
