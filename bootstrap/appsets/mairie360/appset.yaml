apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: mairie360-generator
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: 'https://github.com/mairie360/Deploiment.git'
        revision: mair-33-clean-helm-config
        directories:
          - path: clusters/mairie360/instances/*
  template:
    metadata:
      name: 'mairie360-{{path.basename}}'
    spec:
      project: default
      source:
        repoURL: 'https://github.com/mairie360/Deploiment.git'
        targetRevision: mair-33-clean-helm-config
        path: charts/mairie360-stack
        helm:
          valueFiles:
            - ../../{{path}}/values.yaml
      destination:
        name: mairie-staging
        server: https://212.47.242.79:6443
        namespace: 'mairie360-{{path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
