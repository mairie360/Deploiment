apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: hubs-generator
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: 'https://github.com/mairie360/Deploiment.git'
        revision: mair-33-clean-helm-config
        directories:
          - path: clusters/*/argocd
  template:
    metadata:
      # 1 Argo CD "hub" par client (clusters/<client>/argocd/)
      name: 'hub-{{path.path.segments[1]}}'
    spec:
      project: default
      # Multi-source : le chart argo/argo-cd (distant) + ce repo comme source de
      # valeurs ($values). Évite de vendorer le chart / committer un Chart.lock.
      sources:
        - repoURL: https://argoproj.github.io/argo-helm
          chart: argo-cd
          targetRevision: 10.8.4
          helm:
            # release préfixée => les ClusterRole/Binding sont uniques par client,
            # pas de collision avec l'Argo CD de management (ns argocd).
            releaseName: 'argocd-{{path.path.segments[1]}}'
            valueFiles:
              - $values/{{path}}/values.yaml
        - repoURL: 'https://github.com/mairie360/Deploiment.git'
          targetRevision: mair-33-clean-helm-config
          ref: values
      destination:
        server: https://kubernetes.default.svc
        # namespace dédié par client -> isolation des ConfigMap Argo CD (argocd-cm…)
        namespace: 'argocd-{{path.path.segments[1]}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
