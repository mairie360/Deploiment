apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: instances-generator
  namespace: argocd
spec:
  goTemplate: true

  # argocd-image-updater écrit le nouveau tag de chaque image dans
  # spec.source.helm.parameters de l'Application. Sans cette exception, le
  # contrôleur ApplicationSet remettrait la liste à zéro au sync suivant.
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/source/helm/parameters

  generators:
    - git:
        repoURL: https://github.com/mairie360/Deploiment.git
        revision: mair-33-clean-helm-config
        directories:
          - path: clusters/*/instances/*

  template:
    metadata:
      name: '{{ index .path.segments 1 }}-{{ .path.basename }}'
    spec:
      project: default
      source:
        repoURL: https://github.com/mairie360/Deploiment.git
        targetRevision: mair-33-clean-helm-config
        path: charts/mairie360-stack
        helm:
          # release = nom de l'env => ressources préfixées `dev-`/`staging-`/`prod-`
          # (les *_URL inter-services dans les values doivent suivre ce préfixe).
          releaseName: '{{ .path.basename }}'
          valueFiles:
            # relatif à `path` (charts/mairie360-stack) -> racine du repo
            - ../../{{ .path.path }}/values.yaml
      destination:
        # Clusters distants enregistrés dans Argo CD sous les noms dev / staging / prod
        name: '{{ .path.basename }}'
        namespace: mairie360-{{ .path.basename }}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true

  # ---------------------------------------------------------------------------
  # Annotations argocd-image-updater, générées pour chaque service.
  #
  # Stratégie par environnement (déduite du nom du dossier) :
  #   dev      -> newest-build, tags  ^dev-.*
  #   staging  -> newest-build, tags  ^staging-.*
  #   prod     -> semver,       tags  ^vX.Y.Z
  #
  # write-back-method: argocd  => le tag est poussé dans les paramètres Helm de
  # l'Application (pas de commit git).
  # ---------------------------------------------------------------------------
  templatePatch: |
    {{- $strategy := "newest-build" -}}
    {{- $allowTags := "regexp:^dev-.*" -}}
    {{- if eq .path.basename "staging" -}}
    {{-   $allowTags = "regexp:^staging-.*" -}}
    {{- end -}}
    {{- if eq .path.basename "prod" -}}
    {{-   $strategy = "semver" -}}
    {{-   $allowTags = `regexp:^v?[0-9]+\.[0-9]+\.[0-9]+$` -}}
    {{- end -}}
    {{- $services := list
          (dict "alias" "core-api"        "path" "APIs.instances.core-api")
          (dict "alias" "project-api"     "path" "APIs.instances.project-api")
          (dict "alias" "calendar-api"    "path" "APIs.instances.calendar-api")
          (dict "alias" "message-api"     "path" "APIs.instances.message-api")
          (dict "alias" "email-api"       "path" "APIs.instances.email-api")
          (dict "alias" "files-api"       "path" "APIs.instances.files-api")
          (dict "alias" "elearning-api"   "path" "APIs.instances.elearning-api")
          (dict "alias" "user-bff"        "path" "BFFs.instances.user-bff")
          (dict "alias" "project-bff"     "path" "BFFs.instances.project-bff")
          (dict "alias" "calendar-bff"    "path" "BFFs.instances.calendar-bff")
          (dict "alias" "message-bff"     "path" "BFFs.instances.message-bff")
          (dict "alias" "email-bff"       "path" "BFFs.instances.email-bff")
          (dict "alias" "files-bff"       "path" "BFFs.instances.files-bff")
          (dict "alias" "elearning-bff"   "path" "BFFs.instances.elearning-bff")
          (dict "alias" "login-front"     "path" "Fronts.instances.login-front")
          (dict "alias" "project-front"   "path" "Fronts.instances.project-front")
          (dict "alias" "calendar-front"  "path" "Fronts.instances.calendar-front")
          (dict "alias" "message-front"   "path" "Fronts.instances.message-front")
          (dict "alias" "email-front"     "path" "Fronts.instances.email-front")
          (dict "alias" "files-front"     "path" "Fronts.instances.files-front")
          (dict "alias" "elearning-front" "path" "Fronts.instances.elearning-front")
          (dict "alias" "admin-front"     "path" "Fronts.instances.admin-front")
    -}}
    metadata:
      annotations:
        argocd-image-updater.argoproj.io/write-back-method: argocd
        argocd-image-updater.argoproj.io/image-list: |-
          core-api=ghcr.io/mairie360/core-api,
          project-api=ghcr.io/mairie360/project-api,
          calendar-api=ghcr.io/mairie360/calendar-api,
          message-api=ghcr.io/mairie360/message-api,
          email-api=ghcr.io/mairie360/email-api,
          files-api=ghcr.io/mairie360/files-api,
          elearning-api=ghcr.io/mairie360/elearning-api,
          user-bff=ghcr.io/mairie360/bff-user,
          project-bff=ghcr.io/mairie360/bff-project,
          calendar-bff=ghcr.io/mairie360/bff-calendar,
          message-bff=ghcr.io/mairie360/bff-message,
          email-bff=ghcr.io/mairie360/bff-email,
          files-bff=ghcr.io/mairie360/bff-files,
          elearning-bff=ghcr.io/mairie360/bff-elearning,
          login-front=ghcr.io/mairie360/login-front,
          project-front=ghcr.io/mairie360/projects-front,
          calendar-front=ghcr.io/mairie360/calendar-front,
          message-front=ghcr.io/mairie360/message-front,
          email-front=ghcr.io/mairie360/email-front,
          files-front=ghcr.io/mairie360/files-front,
          elearning-front=ghcr.io/mairie360/elearning-front,
          admin-front=ghcr.io/mairie360/administrator-front
        {{- range $services }}
        argocd-image-updater.argoproj.io/{{ .alias }}.update-strategy: {{ $strategy }}
        argocd-image-updater.argoproj.io/{{ .alias }}.allow-tags: {{ $allowTags }}
        argocd-image-updater.argoproj.io/{{ .alias }}.helm.image-name: {{ .path }}.image.repository
        argocd-image-updater.argoproj.io/{{ .alias }}.helm.image-tag: {{ .path }}.image.tag
        argocd-image-updater.argoproj.io/{{ .alias }}.pull-secret: pullsecret:argocd/ghcr-secret
        {{- end }}
