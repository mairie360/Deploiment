# Sealed Secrets: the decryption controller, on every INSTANCE machine.
#
# Version and values live in the wrapper chart bootstrap/addons/sealed-secrets,
# read at the machine's own revision (MAIR-346). The sealing key is specific
# to each cluster: see that chart's values.yaml.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: sealed-secrets
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - clusters:
        # Only the group's INSTANCE machines. Ansible registers them with
        # this label (role k8s_instance_link); the Argo CD machine itself
        # (in-cluster) does not carry it and is therefore excluded: it needs
        # neither a public ingress nor a database.
        selector:
          matchLabels:
            mairie360.fr/role: instance
        values:
          # See cert-manager-appset.yaml: the machine's revision, `main` when
          # the mairie360.fr/revision annotation is absent.
          revision: '{{ if .metadata.annotations }}{{ index .metadata.annotations "mairie360.fr/revision" | default "main" }}{{ else }}main{{ end }}'
  template:
    metadata:
      name: 'sealed-secrets-{{ .name }}'
    spec:
      project: default
      source:
        repoURL: https://github.com/mairie360/Deploiment.git
        targetRevision: '{{ .values.revision }}'
        path: bootstrap/addons/sealed-secrets
        helm:
          releaseName: sealed-secrets
      destination:
        server: '{{ .server }}'
        namespace: kube-system
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [ServerSideApply=true]
