# Sealed Secrets — contrôleur de déchiffrement, sur chaque machine d'instance.
#
# La clé de scellement est PROPRE À CHAQUE CLUSTER : un secret scellé pour
# l'instance d'un client est cryptographiquement indéchiffrable sur celle d'un
# autre. C'est l'isolation qu'on veut ; la contrepartie est qu'il faut sceller
# une fois par machine (scripts/seal-secrets.sh) et SAUVEGARDER chaque clé —
# sans elle, une réinstallation rend les secrets commités irrécupérables.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: sealed-secrets
  namespace: argocd
spec:
  generators:
    - clusters:
        # Sélecteur : uniquement les machines dINSTANCE du groupe.
        # Ansible les enregistre avec ce label (rôle k8s_instance_link) ; la
        # machine Argo CD elle-même (in-cluster) ne le porte pas et est donc
        # exclue — elle na pas besoin dingress public ni de base de données.
        selector:
          matchLabels:
            mairie360.fr/role: instance
  template:
    metadata:
      name: 'sealed-secrets-{{name}}'
    spec:
      project: default
      source:
        repoURL: https://bitnami-labs.github.io/sealed-secrets
        chart: sealed-secrets
        targetRevision: 2.17.3
        helm:
          releaseName: sealed-secrets
          values: |
            fullnameOverride: sealed-secrets-controller
            resources:
              requests: { memory: 64Mi, cpu: 50m }
              limits:   { memory: 256Mi }
      destination:
        server: '{{server}}'
        namespace: kube-system
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [ServerSideApply=true]
