# =============================================================================
# Argo CD projects of a group (MAIR-414), instead of `project: default`, which
# lets an Application deploy anything from any repository anywhere.
#
#   mairie360-platform   the bootstrap/appsets/ add-ons (cert-manager,
#                        sealed-secrets, ingress-nginx, Traefik, ClusterIssuers,
#                        argocd-image-updater): their chart repositories and
#                        their own namespaces only; cluster-scoped resources
#                        allowed, since they install CRDs, webhooks and RBAC.
#   mairie360-instances  the Mairie360 instances, generated by the instances
#                        ApplicationSet that ansible renders
#                        (roles/k8s_argocd/templates/instances-appset.yaml.j2):
#                        this repository only, `mairie360-*` namespaces only,
#                        and no cluster-scoped kind but the Namespace and the
#                        collector's ClusterRole/ClusterRoleBinding
#                        (charts/observability, kubelet stats).
#
# Synced by the root `platform` Application (which stays in `default`: it
# creates these projects) at wave -1, before the AppSets that use them. The
# instances ApplicationSet only switches to mairie360-instances once ansible
# re-renders it, after this file reached `main`.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: mairie360-platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Cluster add-ons of the instance machines (bootstrap/appsets)
  sourceRepos:
    - https://github.com/mairie360/Deploiment.git
    - https://charts.jetstack.io
    - https://kubernetes.github.io/ingress-nginx
    - https://bitnami.github.io/sealed-secrets
    - https://traefik.github.io/charts
    - https://argoproj.github.io/argo-helm
  destinations:
    - { server: "*", namespace: cert-manager }
    - { server: "*", namespace: ingress-nginx }
    - { server: "*", namespace: traefik }
    - { server: "*", namespace: kube-system }
    - { server: https://kubernetes.default.svc, namespace: argocd }
  clusterResourceWhitelist:
    - { group: "*", kind: "*" }
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: mairie360-instances
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Mairie360 instances (charts/mairie360-stack)
  sourceRepos:
    - https://github.com/mairie360/Deploiment.git
  destinations:
    - { server: "*", namespace: "mairie360-*" }
  clusterResourceWhitelist:
    - { group: "", kind: Namespace }
    - { group: rbac.authorization.k8s.io, kind: ClusterRole }
    - { group: rbac.authorization.k8s.io, kind: ClusterRoleBinding }
