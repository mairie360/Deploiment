# ingress-nginx: the public entry point of each instance not yet switched to Traefik.
#
# k3s is installed with its bundled Traefik disabled (ansible role k8s_node);
# each machine runs either this controller or the pinned Traefik of
# traefik-appset.yaml, and `global.ingressController` in its values says
# which. k3s ServiceLB binds the LoadBalancer Service to
# ports 80/443 of the machine.
#
# Version and values live in the wrapper chart bootstrap/addons/ingress-nginx,
# read at the machine's own revision (MAIR-346). ingress-nginx was retired
# upstream in March 2026 and is being replaced by Traefik (traefik-appset.yaml,
# MAIR-260) one machine at a time; this file and that chart are deleted once
# prod has switched (docs/adr/0001-replace-ingress-nginx.md).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: ingress-nginx
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - clusters:
        # Selector: only the group's INSTANCE machines. Ansible registers
        # them with this label (role k8s_instance_link); the Argo CD machine
        # itself (in-cluster) does not carry it and is therefore excluded: it
        # needs neither a public ingress nor a database.
        #
        # MAIR-260: machines switched to Traefik (cluster label
        # mairie360.fr/ingress=traefik) are excluded; a machine with no such
        # label keeps ingress-nginx, so nothing changes until ansible labels
        # it. Only one controller can own ports 80/443 (traefik-appset.yaml).
        selector:
          matchLabels:
            mairie360.fr/role: instance
          matchExpressions:
            - key: mairie360.fr/ingress
              operator: NotIn
              values: ["traefik"]
        values:
          # See cert-manager-appset.yaml: the machine's revision, `main` when
          # the mairie360.fr/revision annotation is absent.
          revision: '{{ if .metadata.annotations }}{{ index .metadata.annotations "mairie360.fr/revision" | default "main" }}{{ else }}main{{ end }}'
  template:
    metadata:
      name: 'ingress-nginx-{{ .name }}'
      # When a machine switches to Traefik, its Application is deleted; the
      # finalizer deletes ingress-nginx's resources with it, which frees
      # ports 80/443 for Traefik. Also what removes it everywhere once this
      # file is deleted after the last switch (see the ADR).
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/mairie360/Deploiment.git
        targetRevision: '{{ .values.revision }}'
        path: bootstrap/addons/ingress-nginx
        helm:
          releaseName: ingress-nginx
      destination:
        server: '{{ .server }}'
        namespace: ingress-nginx
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
