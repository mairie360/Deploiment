apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cert-manager
  namespace: argocd
spec:
  # Un générateur "clusters" vide cible TOUS les clusters enregistrés dans
  # Argo CD, y compris le cluster local (in-cluster) : argocd + dev + staging + prod.
  generators:
    - clusters:
      selector:
        matchLabels:
          mairie360.fr/role: instance
  template:
    metadata:
      name: 'cert-manager-{{name}}'
    spec:
      project: default
      source:
        repoURL: https://charts.jetstack.io
        chart: cert-manager
        targetRevision: v1.16.5
        helm:
          releaseName: cert-manager
          values: |
            crds:
              enabled: true
              keep: true
            # Résolution forcée des sous-domaines vers l'IP publique
            # (checks HTTP-01 / self-check depuis les pods cert-manager).
            hostAliases:
              - ip: "51.158.96.108"
                hostnames:
                  - dev.mairie360-eip.fr
                  - staging.mairie360-eip.fr
                  - prod.mairie360-eip.fr
      destination:
        server: '{{server}}'
        namespace: cert-manager
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
