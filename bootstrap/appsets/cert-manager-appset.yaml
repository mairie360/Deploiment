apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cert-manager
  namespace: argocd
spec:
  # Instance clusters only (label set by ansible, role k8s_instance_link): the
  # Argo CD machine itself (in-cluster, unlabelled) serves no public host.
  generators:
    - clusters:
        selector:
          matchLabels:
            mairie360.fr/role: instance
  template:
    metadata:
      name: 'cert-manager-{{name}}'
    spec:
      project: default
      source:
        repoURL: https://charts.jetstack.io
        chart: cert-manager
        # PINNED to a supported minor (MAIR-228): 1.16 is out of support.
        # Supported releases and their Kubernetes range:
        # https://cert-manager.io/docs/releases/ (1.21: Kubernetes 1.33-1.36).
        # Read the upgrade notes of every minor you skip before bumping.
        targetRevision: v1.21.2
        helm:
          releaseName: cert-manager
          values: |
            crds:
              enabled: true
              keep: true
            # Shared by every group and every instance: nothing here may name
            # a domain or an IP (MAIR-157). The HTTP-01 self-check resolves
            # the front hosts through public DNS. On the instance machines the
            # public IP sits on the interface, so ServiceLB publishes it as
            # the ingress-nginx LoadBalancer IP and kube-proxy routes the
            # pod's request to that IP straight to ingress-nginx: no hairpin
            # through the provider, no hostAliases needed.
      destination:
        server: '{{server}}'
        namespace: cert-manager
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
