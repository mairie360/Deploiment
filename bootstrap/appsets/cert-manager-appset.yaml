# cert-manager, on every INSTANCE machine.
#
# Version and values live in the wrapper chart bootstrap/addons/cert-manager,
# read at the machine's own revision (MAIR-346): this file only says where and
# at which revision, it must stay free of versions, values, domains and IPs
# (MAIR-157, shared by every group and every instance).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cert-manager
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - clusters:
        # Instance clusters only (label set by ansible, role
        # k8s_instance_link): the Argo CD machine itself (in-cluster,
        # unlabelled) serves no public host.
        selector:
          matchLabels:
            mairie360.fr/role: instance
        values:
          # Revision of this repo the machine follows: the annotation ansible
          # writes on the Argo CD cluster Secret from deploiment_env_revisions
          # (dev -> main, staging -> staging, prod -> prod), `main` when it
          # is absent. Same expression in every bootstrap AppSet; see
          # docs/adr/0002-environment-promotion.md.
          revision: '{{ if .metadata.annotations }}{{ index .metadata.annotations "mairie360.fr/revision" | default "main" }}{{ else }}main{{ end }}'
  template:
    metadata:
      name: 'cert-manager-{{ .name }}'
    spec:
      project: default
      source:
        repoURL: https://github.com/mairie360/Deploiment.git
        targetRevision: '{{ .values.revision }}'
        path: bootstrap/addons/cert-manager
        helm:
          releaseName: cert-manager
      destination:
        server: '{{ .server }}'
        namespace: cert-manager
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
