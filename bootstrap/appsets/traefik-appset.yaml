# Traefik: the ingress controller replacing ingress-nginx (MAIR-260,
# docs/adr/0001-replace-ingress-nginx.md), one per INSTANCE machine that has
# been switched to it.
#
# Only one controller per machine: both publish a LoadBalancer Service on
# 80/443, and k3s ServiceLB cannot bind the same host port twice. The
# machine's controller is chosen by the Argo CD cluster label
# `mairie360.fr/ingress` (ansible var `ingress_controller`, role
# k8s_instance_link): this AppSet takes `traefik`, ingress-nginx-appset.yaml
# takes everything else. The instance values must say the same
# (`global.ingressController`).
#
# Version and values live in the wrapper chart bootstrap/addons/traefik, read
# at the machine's own revision (MAIR-346).
#
# k3s's bundled Traefik stays disabled (ansible role k8s_node): its version
# would follow the k3s release instead of being pinned here.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: traefik
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - clusters:
        selector:
          matchLabels:
            mairie360.fr/role: instance
          matchExpressions:
            - key: mairie360.fr/ingress
              operator: In
              values: ["traefik"]
        values:
          # See cert-manager-appset.yaml: the machine's revision, `main` when
          # the mairie360.fr/revision annotation is absent.
          revision: '{{ if .metadata.annotations }}{{ index .metadata.annotations "mairie360.fr/revision" | default "main" }}{{ else }}main{{ end }}'
  template:
    metadata:
      name: 'traefik-{{ .name }}'
      # Removing the machine from this AppSet (label flipped back to nginx)
      # deletes Traefik's resources too, which frees ports 80/443 for
      # ingress-nginx. Without it Argo CD would only delete the Application.
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/mairie360/Deploiment.git
        targetRevision: '{{ .values.revision }}'
        path: bootstrap/addons/traefik
        helm:
          releaseName: traefik
      destination:
        server: '{{ .server }}'
        namespace: traefik
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        # ServerSideApply: Traefik's CRDs are too large for a client-side
        # apply's last-applied annotation.
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
