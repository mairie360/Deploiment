# cert-manager ClusterIssuers (bootstrap/cluster-addons/), on every INSTANCE
# machine, read at the machine's own revision (MAIR-346).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-issuers
  namespace: argocd
spec:
  goTemplate: true
  # MAIR-710: deleting this ApplicationSet, or a cluster leaving its
  # generator, removes the Application only, never the add-on on the instance
  # (CRDs included: deleting the SealedSecret CRD would delete every Secret).
  syncPolicy:
    preserveResourcesOnDeletion: true
  # Instance clusters only (mairie360.fr/role=instance). Depends on
  # cert-manager (ClusterIssuer CRD): the retry policy absorbs the initial
  # "CRD not found".
  generators:
    - clusters:
        selector:
          matchLabels:
            mairie360.fr/role: instance
        values:
          # See cert-manager-appset.yaml: the machine's revision, `main` when
          # the mairie360.fr/revision annotation is absent.
          revision: '{{ if .metadata.annotations }}{{ index .metadata.annotations "mairie360.fr/revision" | default "main" }}{{ else }}main{{ end }}'
  template:
    metadata:
      name: 'cluster-issuers-{{ .name }}'
    spec:
      project: mairie360-platform
      source:
        repoURL: https://github.com/mairie360/Deploiment.git
        targetRevision: '{{ .values.revision }}'
        path: bootstrap/cluster-addons
        directory:
          recurse: false
      destination:
        server: '{{ .server }}'
        namespace: cert-manager
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 20
          backoff:
            duration: 15s
            maxDuration: 3m
            factor: 2
        syncOptions:
          - ServerSideApply=true
