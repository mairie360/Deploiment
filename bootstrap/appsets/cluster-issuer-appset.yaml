apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-issuers
  namespace: argocd
spec:
  # Instance clusters only (mairie360.fr/role=instance). Depends on
  # cert-manager (ClusterIssuer CRD): the retry policy absorbs the initial
  # "CRD not found".
  generators:
    - clusters:
        selector:
          matchLabels:
            mairie360.fr/role: instance
  template:
    metadata:
      name: 'cluster-issuers-{{name}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/mairie360/Deploiment.git
        targetRevision: main
        path: bootstrap/cluster-addons
        directory:
          recurse: false
      destination:
        server: '{{server}}'
        namespace: cert-manager
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 20
          backoff:
            duration: 15s
            maxDuration: 3m
            factor: 2
        syncOptions:
          - ServerSideApply=true
