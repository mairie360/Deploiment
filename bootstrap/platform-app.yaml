# =============================================================================
# Root Application (app-of-apps), applied ONCE by Ansible on each group's Argo
# CD machine (role k8s_argocd).
#
# It syncs bootstrap/appsets/, which installs the base layer (cert-manager,
# sealed-secrets, ingress controller, ClusterIssuers) on the group's INSTANCE
# machines, not on the Argo CD machine itself.
#
# It follows `main` (Ansible repoints it to deploiment_repo_branch), so every
# AppSet manifest reaches every machine at once. That is why the AppSets hold
# no version and no values: those live in bootstrap/addons/, read at each
# machine's own revision (mairie360.fr/revision, MAIR-346).
#
# The ApplicationSet deploying Mairie360 itself is NOT here: it depends on the
# org_id and is rendered by Ansible (roles/k8s_argocd/templates/instances-appset.yaml.j2).
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/mairie360/Deploiment.git
    targetRevision: main
    path: bootstrap/appsets
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      # No prune (MAIR-710): this app follows main on every group, prod
      # included. Deleting or renaming a file of bootstrap/appsets/ must not
      # delete an ApplicationSet (and with it the add-ons of every instance):
      # remove an ApplicationSet by hand once its file is gone.
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
