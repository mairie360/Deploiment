# cert-manager ClusterIssuers, applied to every INSTANCE cluster by
# bootstrap/appsets/cluster-issuer-appset.yaml.
#
# The HTTP-01 solver defaults to the "traefik" class (MAIR-795): every
# instance runs Traefik since MAIR-612 and ingress-nginx is retired upstream.
# It was "nginx" until then, so a Certificate created without an override
# annotation answered its challenges on a class no controller served and its
# renewal stalled silently. The chart's Ingresses still set
# acme.cert-manager.io/http01-ingress-ingressclassname: <their own class>,
# so an instance left on nginx keeps working; this default only matters for a
# Certificate without that annotation. scripts/lib/cert-solvers.sh
# (CLUSTER_ISSUER_DEFAULT_SOLVER) must stay equal to it. Each host must
# resolve publicly to that instance's IP before issuance.
#
# ORDRE DE MISE EN ROUTE : utiliser letsencrypt-staging tant que la chaîne
# n'est pas validée (quota quasi illimité, certificats non reconnus par les
# navigateurs), puis basculer sur letsencrypt-prod. Le quota prod est de 50
# certificats par domaine et par semaine : il s'épuise vite en débogage.
#
# LIMITE DU HTTP-01 : un challenge par hôte, soit 8 validations par
# environnement ici. Le passage au DNS-01 permettrait un seul certificat
# wildcard *.{env}.mairie360-eip.fr — voir docs/ARCHITECTURE §5.
#
# L'alias "letsencrypt-local" a été supprimé : plus aucun values ne le
# référence.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    email: quentin.tennerel@epitech.eu
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
---
# Let's Encrypt staging : quota large, certificats non fiables par le navigateur.
# À utiliser pour valider une nouvelle stack sans épuiser le quota prod.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    email: quentin.tennerel@epitech.eu
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
