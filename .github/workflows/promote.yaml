name: Promote

# Moves an environment's branch forward: main -> staging -> prod.
#
# Each Argo CD Application follows one branch of this repo (chart, values and
# secrets are read at the same revision, see docs/adr/0002-environment-promotion.md):
# dev follows `main`, staging follows `staging`, prod follows `prod`. Promoting
# is therefore just a fast-forward of that branch to a commit that already went
# through the previous environment.
#
#   target=staging  ref must be on `main`     (default: main's head)
#   target=prod     ref must be on `staging`  (default: staging's head)
#
# One exception to the fast-forward (MAIR-444): argocd-image-updater commits
# staging's image tags straight onto the `staging` branch, into
# clusters/*/instances/staging/images.yaml. When `staging` carries such
# commits and nothing else, promoting to staging MERGES ref into it instead
# (main never edits images.yaml, so the merge cannot conflict). Any other
# staging-only change is refused, as before. Prod still only fast-forwards to
# a commit of `staging`.
#
# The decision (fast-forward, merge, rollback, nothing) is
# scripts/promote-mode.sh, tested by tests/scripts/mair_444_promote_mode_test.sh.
# Prod's image tags (clusters/_base/prod.yaml) only move through this
# workflow: prod has no argocd-image-updater (MAIR-186).

on:
  workflow_dispatch:
    inputs:
      target:
        description: Environment to promote to
        type: choice
        options: [staging, prod]
        required: true
      ref:
        description: Commit to promote (default is the head of the previous environment's branch)
        type: string
        required: false
      staging_verified:
        description: "prod only: scripts/verify.sh passed on staging for this commit"
        type: boolean
        default: false
      rollback:
        description: Move the branch BACK to ref (force push, skips the CI checks)
        type: boolean
        default: false

# One promotion at a time, and never cancel a push half way.
concurrency:
  group: promote
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve and check the promotion
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      current: ${{ steps.resolve.outputs.current }}
      changed: ${{ steps.resolve.outputs.changed }}
      mode: ${{ steps.resolve.outputs.mode }}
      # The commit the target moves to: sha, or in merge mode the merge of
      # sha into the target (what validate and secrets check).
      promoted: ${{ steps.resolve.outputs.promoted }}
    # Merge mode pushes the prospective merge commit to a temporary branch.
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve the commit and check the promotion path
        id: resolve
        env:
          TARGET: ${{ inputs.target }}
          REF: ${{ inputs.ref }}
          STAGING_VERIFIED: ${{ inputs.staging_verified }}
          ROLLBACK: ${{ inputs.rollback }}
        run: |
          set -euo pipefail

          case "$TARGET" in
            staging) SOURCE=main ;;
            prod)    SOURCE=staging ;;
            *) echo "::error::Unknown target '$TARGET'"; exit 1 ;;
          esac

          if ! git rev-parse --verify --quiet "origin/$SOURCE" >/dev/null; then
            echo "::error::Branch '$SOURCE' does not exist: promote it first."
            exit 1
          fi
          SHA=$(git rev-parse --verify "${REF:-origin/$SOURCE}^{commit}")

          # Never skip an environment: the commit must already be in the
          # source branch (main for staging, staging for prod).
          if ! git merge-base --is-ancestor "$SHA" "origin/$SOURCE"; then
            echo "::error::$SHA is not on '$SOURCE': it has not been through the previous environment."
            exit 1
          fi

          CURRENT=""
          if git rev-parse --verify --quiet "origin/$TARGET" >/dev/null; then
            CURRENT=$(git rev-parse "origin/$TARGET")
          fi

          if [ "$ROLLBACK" != "true" ] && [ "$TARGET" = "prod" ] && [ "$STAGING_VERIFIED" != "true" ]; then
            echo "::error::Run scripts/verify.sh against staging, then tick 'staging_verified'."
            exit 1
          fi
          # fast-forward, merge (staging ahead by image-updater commits only,
          # MAIR-444), rollback or none; fails on any other path.
          PROMOTE_MODE=$(./scripts/promote-mode.sh "$TARGET" "$SHA" "$CURRENT" \
            "$([ "$ROLLBACK" = "true" ] && echo rollback || true)")
          read -r MODE CHANGED <<<"$PROMOTE_MODE"

          # Merge mode: build the merge now, so validate and secrets check the
          # tree staging will really run (main's chart with staging's image
          # tags), not main's commit alone. It waits on promote-tmp/<target>,
          # which no workflow watches; the promote job fast-forwards the
          # target to it. A later run overwrites it.
          PROMOTED=$SHA
          if [ "$MODE" = "merge" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -q --detach "$CURRENT"
            git merge --no-ff --no-edit -m "chore: promote ${SHA::7} to $TARGET" "$SHA"
            PROMOTED=$(git rev-parse HEAD)
            git push --force origin "$PROMOTED:refs/heads/promote-tmp/$TARGET"
          fi

          {
            echo "sha=$SHA"
            echo "current=$CURRENT"
            echo "changed=$CHANGED"
            echo "mode=$MODE"
            echo "promoted=$PROMOTED"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Promote \`$TARGET\`"
            echo
            echo "- From: \`${CURRENT:-<new branch>}\`"
            echo "- To: \`$SHA\` (rollback: $ROLLBACK, $MODE)"
            if [ "$CHANGED" = "false" ]; then
              echo "- Nothing to do, \`$TARGET\` is already at this commit."
            elif [ -n "$CURRENT" ] && [ "$ROLLBACK" != "true" ]; then
              echo
              echo "Commits:"
              echo '```'
              git log --oneline "$CURRENT..$SHA"
              echo '```'
              echo "Changed under \`clusters/\` and \`charts/\`:"
              echo '```'
              git diff --stat "$CURRENT" "$SHA" -- clusters charts | tail -n 40
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  secrets:
    name: Check the target's sealed secrets
    needs: resolve
    # A rollback goes back to a commit that already ran on this environment.
    if: needs.resolve.outputs.changed == 'true' && !inputs.rollback
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.promoted }}

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.1

      # MAIR-414: staging and prod were promoted with backup and Keycloak
      # enabled but neither Secret sealed, and without ADMIN_*: refuse to
      # move the branch until secrets.yaml provides everything the pods need.
      - name: Every referenced Secret is sealed
        env:
          TARGET: ${{ inputs.target }}
        run: |
          helm dependency build ./charts/mairie360-stack
          ./scripts/check-instance-secrets.sh clusters/*/instances/"$TARGET"

  validate:
    name: Validate the commit
    needs: resolve
    # A rollback goes back to a commit that was already validated.
    if: needs.resolve.outputs.changed == 'true' && !inputs.rollback
    uses: ./.github/workflows/cicd.yaml
    with:
      ref: ${{ needs.resolve.outputs.promoted }}

  promote:
    name: Advance the branch
    needs: [resolve, secrets, validate]
    if: ${{ !cancelled() && needs.resolve.outputs.changed == 'true' && needs.validate.result != 'failure' && needs.secrets.result != 'failure' }}
    runs-on: ubuntu-latest
    # Create `promote-prod` in the repo settings with required reviewers: that
    # is the human approval before prod moves.
    environment: promote-${{ inputs.target }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Push the branch
        env:
          TARGET: ${{ inputs.target }}
          ROLLBACK: ${{ inputs.rollback }}
          SHA: ${{ needs.resolve.outputs.sha }}
          CURRENT: ${{ needs.resolve.outputs.current }}
          MODE: ${{ needs.resolve.outputs.mode }}
          PROMOTED: ${{ needs.resolve.outputs.promoted }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "merge" ]; then
            # MAIR-444: the merge commit built and validated by resolve. Still
            # no force: it descends from CURRENT, and an image-updater commit
            # landing on the target meanwhile makes git reject the push.
            git push origin "$PROMOTED:refs/heads/$TARGET"
            git push origin --delete "promote-tmp/$TARGET"
            echo "\`$TARGET\` merged \`$SHA\` as \`$PROMOTED\` (kept its image-updater commits)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$ROLLBACK" = "true" ]; then
            # Refuse if the branch moved since it was resolved.
            git push --force-with-lease="refs/heads/$TARGET:$CURRENT" origin "$SHA:refs/heads/$TARGET"
          else
            # No force: git rejects anything that is not a fast-forward, which
            # also covers a push landing on the branch during the approval.
            git push origin "$SHA:refs/heads/$TARGET"
          fi
          echo "\`$TARGET\` is now at \`$SHA\`. Argo CD picks it up on its next refresh." >> "$GITHUB_STEP_SUMMARY"
