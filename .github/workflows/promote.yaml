name: Promote

# Moves an environment's branch forward: main -> staging -> prod.
#
# Each Argo CD Application follows one branch of this repo (chart, values and
# secrets are read at the same revision, see docs/adr/0002-environment-promotion.md):
# dev follows `main`, staging follows `staging`, prod follows `prod`. Promoting
# is therefore just a fast-forward of that branch to a commit that already went
# through the previous environment.
#
#   target=staging  ref must be on `main`     (default: main's head)
#   target=prod     ref must be `staging`'s head, and scripts/verify.sh must
#                   pass against the staging instance (job verify-staging)
#
# That covers both the instances (chart, values, secrets) and bootstrap/
# (cert-manager, sealed-secrets, ingress controller, ClusterIssuers): the
# bootstrap AppSets read their wrapper charts at the revision annotated on
# each Argo CD cluster (mairie360.fr/revision), so a bootstrap version bump
# follows the same main -> staging -> prod path (MAIR-346).
#
# verify-staging runs on the self-hosted runner of the mairie360 group's Argo
# CD machine (labels self-hosted, linux, mairie360-argocd-mairie360): the
# instance API servers are only reachable over WireGuard from that machine.
# It only ever runs from this workflow_dispatch workflow, never for pull
# requests (see the job's comment).
#
# Image tags are a separate lane (argocd-image-updater for dev/staging, a
# semver in prod's values.yaml) and are not affected by this workflow.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Environment to promote to
        type: choice
        options: [staging, prod]
        required: true
      ref:
        description: Commit to promote (default is the head of the previous environment's branch)
        type: string
        required: false
      rollback:
        description: Move the branch BACK to ref (force push, skips the CI checks)
        type: boolean
        default: false

# One promotion at a time, and never cancel a push half way.
concurrency:
  group: promote
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve and check the promotion
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      current: ${{ steps.resolve.outputs.current }}
      changed: ${{ steps.resolve.outputs.changed }}
      staging_domain: ${{ steps.resolve.outputs.staging_domain }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve the commit and check the promotion path
        id: resolve
        env:
          TARGET: ${{ inputs.target }}
          REF: ${{ inputs.ref }}
          ROLLBACK: ${{ inputs.rollback }}
          STAGING_VALUES: clusters/mairie360/instances/staging/values.yaml
        run: |
          set -euo pipefail

          case "$TARGET" in
            staging) SOURCE=main ;;
            prod)    SOURCE=staging ;;
            *) echo "::error::Unknown target '$TARGET'"; exit 1 ;;
          esac

          if ! git rev-parse --verify --quiet "origin/$SOURCE" >/dev/null; then
            echo "::error::Branch '$SOURCE' does not exist: promote it first."
            exit 1
          fi
          SHA=$(git rev-parse --verify "${REF:-origin/$SOURCE}^{commit}")

          # Never skip an environment: the commit must already be in the
          # source branch (main for staging, staging for prod).
          if ! git merge-base --is-ancestor "$SHA" "origin/$SOURCE"; then
            echo "::error::$SHA is not on '$SOURCE': it has not been through the previous environment."
            exit 1
          fi

          CURRENT=""
          if git rev-parse --verify --quiet "origin/$TARGET" >/dev/null; then
            CURRENT=$(git rev-parse "origin/$TARGET")
          fi

          CHANGED=true
          if [ "$ROLLBACK" = "true" ]; then
            [ -n "$CURRENT" ] || { echo "::error::'$TARGET' does not exist, nothing to roll back."; exit 1; }
            if ! git merge-base --is-ancestor "$SHA" "$CURRENT"; then
              echo "::error::Rollback needs a commit that is already in '$TARGET' history."
              exit 1
            fi
          else
            # verify-staging checks what the staging instance runs, which
            # can only vouch for staging's head: an older staging commit
            # would reach prod unverified.
            if [ "$TARGET" = "prod" ] && [ "$SHA" != "$(git rev-parse origin/staging)" ]; then
              echo "::error::Only staging's head can be promoted to prod: that is the commit verify-staging checks."
              exit 1
            fi
            if [ -n "$CURRENT" ] && ! git merge-base --is-ancestor "$CURRENT" "$SHA"; then
              echo "::error::'$TARGET' ($CURRENT) is not an ancestor of $SHA: not a fast-forward."
              exit 1
            fi
          fi
          if [ "$CURRENT" = "$SHA" ]; then
            CHANGED=false
          fi

          # Domain verify-staging checks (TLS, redirect, closed ports), read
          # from the promoted commit's staging values (yq is preinstalled on
          # ubuntu-latest).
          STAGING_DOMAIN=""
          if [ "$TARGET" = "prod" ] && [ "$ROLLBACK" != "true" ]; then
            STAGING_DOMAIN=$(git show "$SHA:$STAGING_VALUES" | yq -r '.global.domain')
            case "$STAGING_DOMAIN" in
              ""|null) echo "::error::No global.domain in $STAGING_VALUES"; exit 1 ;;
            esac
          fi

          {
            echo "sha=$SHA"
            echo "current=$CURRENT"
            echo "changed=$CHANGED"
            echo "staging_domain=$STAGING_DOMAIN"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Promote \`$TARGET\`"
            echo
            echo "- From: \`${CURRENT:-<new branch>}\`"
            echo "- To: \`$SHA\` (rollback: $ROLLBACK)"
            if [ "$CHANGED" = "false" ]; then
              echo "- Nothing to do, \`$TARGET\` is already at this commit."
            elif [ -n "$CURRENT" ] && [ "$ROLLBACK" != "true" ]; then
              echo
              echo "Commits:"
              echo '```'
              git log --oneline "$CURRENT..$SHA"
              echo '```'
              echo "Changed under \`clusters/\`, \`charts/\` and \`bootstrap/\`:"
              echo '```'
              git diff --stat "$CURRENT" "$SHA" -- clusters charts bootstrap | tail -n 40
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  validate:
    name: Validate the commit
    needs: resolve
    # A rollback goes back to a commit that was already validated.
    if: needs.resolve.outputs.changed == 'true' && !inputs.rollback
    uses: ./.github/workflows/cicd.yaml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  # Acceptance test of the staging instance before prod moves, replacing the
  # former `staging_verified` checkbox (MAIR-346).
  #
  # Runs on the self-hosted runner of the mairie360 group's Argo CD machine,
  # the only place that reaches the staging API server (WireGuard). The
  # runner is ephemeral, runs as the unprivileged user gh-runner, and its
  # kubeconfig for staging is bound to a ServiceAccount limited to what
  # scripts/verify.sh needs (listed at the top of that script): no Secret
  # read, no exec, nothing outside mairie360-staging but two kube-system
  # objects. It gives the runner no network path the machine did not have.
  #
  # This repository is public: this job is only ever triggered by
  # workflow_dispatch (the only trigger of this workflow, repeated below),
  # which needs write access to the repo, and it checks out the promoted
  # commit, which is already on `staging`. Fork pull requests never run on
  # this runner as long as the repository keeps "Require approval for all
  # external contributors" (Settings > Actions) and no pull_request workflow
  # names its label.
  verify-staging:
    name: Verify the staging instance
    needs: [resolve, validate]
    if: >-
      github.event_name == 'workflow_dispatch'
      && inputs.target == 'prod' && !inputs.rollback
      && needs.resolve.outputs.changed == 'true'
      && needs.validate.result == 'success'
    runs-on: [self-hosted, linux, mairie360-argocd-mairie360]
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Written by ansible (MAIR-346) for staging only.
      KUBECONFIG: /home/gh-runner/.kube/instance-staging.yaml
    steps:
      - name: Checkout the promoted commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Run scripts/verify.sh against staging
        env:
          DOMAIN: ${{ needs.resolve.outputs.staging_domain }}
        run: |
          set -euo pipefail
          # The kubeconfig holds a single context (ansible names it after
          # the environment); use it whatever its name.
          CONTEXT=$(kubectl config current-context)
          ./scripts/verify.sh "$CONTEXT" staging "$DOMAIN"
          echo "scripts/verify.sh passed on staging (\`$DOMAIN\`, commit \`${{ needs.resolve.outputs.sha }}\`)." >> "$GITHUB_STEP_SUMMARY"

  promote:
    name: Advance the branch
    needs: [resolve, validate, verify-staging]
    # prod (unless rolling back) needs verify-staging to have passed; a
    # skipped verification only counts for staging and rollbacks.
    if: >-
      !cancelled() && needs.resolve.outputs.changed == 'true'
      && needs.validate.result != 'failure'
      && (needs.verify-staging.result == 'success'
          || (needs.verify-staging.result == 'skipped' && (inputs.target != 'prod' || inputs.rollback)))
    runs-on: ubuntu-latest
    # Create `promote-prod` in the repo settings with required reviewers: that
    # is the human approval before prod moves.
    environment: promote-${{ inputs.target }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Push the branch
        env:
          TARGET: ${{ inputs.target }}
          ROLLBACK: ${{ inputs.rollback }}
          SHA: ${{ needs.resolve.outputs.sha }}
          CURRENT: ${{ needs.resolve.outputs.current }}
        run: |
          set -euo pipefail
          if [ "$ROLLBACK" = "true" ]; then
            # Refuse if the branch moved since it was resolved.
            git push --force-with-lease="refs/heads/$TARGET:$CURRENT" origin "$SHA:refs/heads/$TARGET"
          else
            # No force: git rejects anything that is not a fast-forward, which
            # also covers a push landing on the branch during the approval.
            git push origin "$SHA:refs/heads/$TARGET"
          fi
          echo "\`$TARGET\` is now at \`$SHA\`. Argo CD picks it up on its next refresh." >> "$GITHUB_STEP_SUMMARY"
