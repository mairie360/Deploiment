name: Helm CI/CD

on:
  push:
    # staging: argocd-image-updater commits its image tags there (MAIR-444).
    branches: [ main, develop, staging ]
  pull_request:
  # Called by promote.yaml to re-run every check on the exact commit that is
  # about to reach staging or prod.
  workflow_call:
    inputs:
      ref:
        description: Commit to validate (default is the triggering ref)
        type: string
        default: ""

jobs:
  # Blocks any new commit that adds a secret (MAIR-677: a GHCR PAT stayed
  # readable in this public repo's history). Rules: .gitleaks.toml, which only
  # lets SealedSecret ciphertext through.
  # Skipped when promote.yaml calls this workflow: a promotion only
  # fast-forwards to a commit already on main, which this job scanned on push,
  # and the shared action scans the caller's GITHUB_SHA, not `inputs.ref`.
  secret-scan:
    name: Secret scan (Gitleaks)
    if: ${{ inputs.ref == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks on the new commits
        uses: mairie360/CICD/actions/security/gitleaks@v5.5.0

  # ================================
  # 🧱 JOB 1 : Validation & Qualité
  # ================================
  helm-validation:
    name: Lint & Template Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.1

      - name: Helm dependency build
        run: helm dependency build ./charts/mairie360-stack

      - name: Helm lint
        # Les subcharts (APIs/BFFs/Fronts) ne sont pas autonomes : ils dépendent
        # des valeurs `global.*` fournies par l'umbrella. On lint donc l'umbrella,
        # le rendu par env ci-dessous valide les subcharts avec de vraies valeurs.
        run: helm lint ./charts/mairie360-stack

      # Render every instance and validate it against the Kubernetes schemas.
      # CiliumNetworkPolicy has no schema in kubeconform's default store.
      # Every instance is rendered with both ingress controllers (MAIR-260),
      # so a switch to Traefik is validated before it happens; the Traefik
      # Middleware and the Argo CD AppSets are checked against the
      # datreeio CRDs-catalog schemas.
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin kubeconform

      - name: Render and validate every instance
        run: |
          CRDS='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          for v in clusters/*/instances/*; do
            # clusters/_base/<env>.yaml first, like the instances AppSet (MAIR-414).
            mapfile -t files < <(./scripts/instance-values.sh "$v")
            args=(); for f in "${files[@]}"; do args+=(-f "$f"); done
            for controller in nginx traefik; do
              echo "Rendering $v (ingress controller: $controller)"
              helm template r ./charts/mairie360-stack "${args[@]}" \
                --set global.ingressController="$controller" \
                | kubeconform -strict -summary -schema-location default \
                    -schema-location "$CRDS" -skip CiliumNetworkPolicy
            done
          done
          echo "Validating bootstrap/"
          kubeconform -strict -summary -schema-location default \
            -schema-location "$CRDS" bootstrap/appsets bootstrap/cluster-addons bootstrap/platform-app.yaml

      # MAIR-346: the platform app applies bootstrap/appsets/ from `main` to
      # every machine at once, so versions and values must stay in the
      # wrapper charts of bootstrap/addons/, read at each machine's own
      # revision. Render each one, and refuse an instance AppSet that pins a
      # revision or points at a Helm repository again.
      - name: Render the bootstrap wrapper charts
        # bash -eo pipefail: a failed `helm template` must fail the step, not
        # leave kubeconform validating zero resources.
        shell: bash
        run: |
          CRDS='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          for chart in bootstrap/addons/*/; do
            name=$(basename "$chart")
            echo "Rendering $chart"
            ./scripts/addon-deps.sh "$chart"
            helm lint "$chart"
            helm template "$name" "$chart" --include-crds \
              | kubeconform -strict -summary -schema-location default \
                  -schema-location "$CRDS" -skip CustomResourceDefinition
          done

      - name: Bootstrap AppSets follow each machine's revision
        run: ./scripts/check-bootstrap-revisions.sh

      # GDPR decisions of each mairie (compliance/<org>/, MAIR-294) against the
      # rendered configuration: retention periods, backup retention, external
      # hosts and egress rules of subprocessors, complete register. A mismatch
      # fails; decisions not validated by the mairie yet are warnings.
      - name: Check the GDPR decisions against the configuration
        run: |
          python3 -m unittest discover -s tests/compliance -v
          ./scripts/check-compliance.py

      # Every instance must start before argocd-image-updater's first pass
      # (MAIR-172): tags follow the image-updater's family for the env and
      # exist on their registry. skopeo is preinstalled on ubuntu-latest.
      - name: Check image tags exist
        run: ./scripts/check-image-tags.sh

      # Every Secret (and key) the pods reference is sealed in the instance's
      # secrets.yaml (MAIR-414). Warnings only here: a secrets.yaml is sealed
      # on the machine, after the values change that needs it. The Promote
      # workflow runs the same check as a blocker for staging and prod.
      - name: Check instance secrets (warning)
        run: ./scripts/check-instance-secrets.sh --warn

      # Helm 4 verifies plugin signatures and refuses a git source, which
      # cannot be verified: the version pin is what trusts the plugin here.
      - name: Helm unit tests
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest --version v0.8.2 --verify=false
          helm unittest ./charts/mairie360-stack

      - name: Script tests
        run: for t in tests/scripts/*_test.sh; do echo "== $t"; "$t" || exit 1; done

