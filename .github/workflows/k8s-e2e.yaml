name: Kubernetes e2e

# Deploys the umbrella chart on a throwaway Kind + Cilium cluster and checks
# the Kubernetes layer: install order, Services, NetworkPolicies, Redis ACL,
# Postgres roles. Application images are replaced by a placeholder, see
# tests/e2e/values.yaml. Same script as locally: tests/e2e/run.sh.
#
# "Chart on Kind + Cilium" is a required status check on main, so it must
# report on every PR. The path filter therefore lives in the `changes` job,
# not under `on.pull_request.paths` (a filtered-out workflow never reports and
# blocks the PR): when nothing relevant changed, the e2e job is skipped, which
# satisfies the required check.

on:
  push:
    branches: [ main, develop ]
  pull_request:

concurrency:
  group: k8s-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  KIND_VERSION: v0.33.0
  CILIUM_CLI_VERSION: v0.20.0
  CHAINSAW_VERSION: v0.2.15

jobs:
  changes:
    name: Detect e2e-relevant changes
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - name: Checkout repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # bootstrap/: Traefik and cert-manager versions and values used by
          # the ingress test
          if git diff --name-only "$BASE_SHA" HEAD \
              | grep -qE '^(charts|tests/e2e|bootstrap)/|^\.github/workflows/k8s-e2e\.yaml$'; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: Chart on Kind + Cilium
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.22.0

      - name: Install kind, cilium CLI and chainsaw
        run: |
          mkdir -p "$HOME/.local/bin"
          cd "$HOME/.local/bin"
          curl -sSfLo kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          chmod +x kind
          curl -sSfL "https://github.com/cilium/cilium-cli/releases/download/${CILIUM_CLI_VERSION}/cilium-linux-amd64.tar.gz" \
            | tar xz cilium
          curl -sSfL "https://github.com/kyverno/chainsaw/releases/download/${CHAINSAW_VERSION}/chainsaw_linux_amd64.tar.gz" \
            | tar xz chainsaw
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run the e2e suite
        run: tests/e2e/run.sh
