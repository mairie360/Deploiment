# ============================================================================
# client-example / prod
#
# Une machine = un cluster k3s = un namespace mairie360-<env>.
# Déployé par l'ApplicationSet 'instances' de l'Argo CD du groupe client-example,
# vers le cluster enregistré sous le nom 'prod'.
#
# Only what differs from clusters/_base/prod.yaml (MAIR-414), which holds the
# versions and settings shared by every prod instance.
# ============================================================================

global:
  domain: "mairie360.ville-exemple.fr"
  # Sender of core-api's and Keycloak's e-mails; its domain must be verified
  # in the Resend dashboard.
  emailFrom: "noreply@mairie360.ville-exemple.fr"
  # Scaleway Object Storage bucket of elearning-api's course attachments.
  elearningBucket: "ville-exemple-elearning"

backup:
  s3:
    bucket: "ville-exemple-backup-prod"

keycloak:
  realm:
    smtp:
      from: "noreply@mairie360.ville-exemple.fr"
