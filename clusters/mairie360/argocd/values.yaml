# Valeurs du hub Argo CD de Mairie360 (client "mairie360").
# Chart : argo/argo-cd (voir bootstrap/appsets/hubs-appset.yaml).
global:
  domain: argocd-hub.mairie360-eip.fr

# Les CRD argoproj.io sont installées une seule fois par l'Argo CD de management.
crds:
  install: false

configs:
  params:
    # La terminaison TLS est gérée par l'Ingress Traefik ; Argo CD sert en HTTP.
    server.insecure: true

server:
  ingress:
    enabled: true
    ingressClassName: traefik
    hostname: argocd-hub.mairie360-eip.fr
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
    tls:
      - secretName: argocd-server-tls
        hosts:
          - argocd-hub.mairie360-eip.fr

# Cluster mono-nœud : une seule réplique par composant.
controller:
  replicas: 1
repoServer:
  replicas: 1

# Composants inutiles pour le hub -> désactivés pour alléger l'empreinte mémoire.
dex:
  enabled: false
notifications:
  enabled: false
