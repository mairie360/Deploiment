# ============================================================================
# mairie360 / staging
#
# Une machine = un cluster k3s = un namespace mairie360-<env>.
# Déployé par l'ApplicationSet 'instances' de l'Argo CD du groupe mairie360,
# vers le cluster enregistré sous le nom 'staging'.
#
# Ce fichier ne contient QUE ce qui change d'un déploiement à l'autre.
# Les défauts sont dans charts/mairie360-stack/values.yaml.
# APIs/BFFs/Fronts image tags are moved forward by argocd-image-updater
# (newest staging-<sha>); database and liquibase are not, bump them by hand.
# The pinned staging-<sha> tags below are only a starting point, but they must
# exist so a fresh instance starts without it (MAIR-172): never *-latest (no
# longer pushed) nor the mobile `staging` tag (not pushed by every repo yet).
# scripts/check-image-tags.sh enforces both in CI.
# ============================================================================

global:
  domain: "staging.mairie360-eip.fr"
  imagePullSecret: "ghcr-secret"
  # Ingress controller of this machine: "nginx" or "traefik" (MAIR-260).
  # Must match the Argo CD cluster label mairie360.fr/ingress set by ansible
  # (`ingress_controller`); switch procedure in
  # docs/adr/0001-replace-ingress-nginx.md. The IngressClass, annotations
  # and NetworkPolicy namespace follow from it.
  ingressController: "traefik"
  networkPolicy:
    enabled: true
    # Passer à true une fois les destinations externes connues et déclarées
    # dans egressAllowCIDRs.
    egressDefaultDeny: false

# Secrets fournis par SealedSecret (secrets.yaml, généré par
# scripts/seal-secrets.sh mairie360 staging). Jamais de valeur en clair ici.
secrets:
  create: false

ingress:
  enabled: true
  clusterIssuer: "letsencrypt-prod"
  # 50 MiB body limit and HTTPS redirect: chart defaults (ingress.maxBodySizeMiB).

database:
  image:
    tag: "staging-5fe90c1"
  secret:
    create: false
  persistence:
    size: "5Gi"
    storageClass: "local-path"

redis:
  secret:
    create: false

liquibase:
  image:
    tag: "staging-5fe90c1"
  db:
    name: "mairie_db_staging"

# Off-machine encrypted Postgres backups (MAIR-119/MAIR-231,
# charts/backup/README.md). Needs the bucket below to exist and
# <release>-backup-secret sealed (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
# exported when running scripts/seal-secrets.sh) before the first sync after
# this change — until then the CronJob's pod sits in
# CreateContainerConfigError, same as any new Secret (see the root
# CLAUDE.md Gotchas). Schedule and retention are applied by Argo CD on the
# next sync. keycloak.enabled also dumps <release>-keycloak-db into the same
# repository (KEYCLOAK_DB_PASSWORD, no extra secret to seal).
backup:
  enabled: true
  schedule: "0 3 * * *"
  retention:
    keepDaily: 7
    keepWeekly: 4
    keepMonthly: 6
  s3:
    endpoint: "https://s3.fr-par.scw.cloud"
    bucket: "mairie360-backup-staging"
    region: "fr-par"
  keycloak:
    enabled: true

# Keycloak (MAIR-139): the instance's identity provider, on
# https://auth.<global.domain> (DNS record required, like the fronts). Realm
# and clients: charts/mairie360-stack/charts/keycloak/values.yaml. Its own
# Postgres is covered by the backup CronJob above (backup.keycloak.enabled,
# MAIR-231). Requires <release>-keycloak-secret in secrets.yaml
# (scripts/seal-secrets.sh).
keycloak:
  enabled: true
  # 4 GB machine (3 vCPU, same as dev): cap the heap explicitly, otherwise the
  # JVM sizes it from the 1Gi limit and the node runs out of memory while
  # Keycloak builds its server image at start-up (2026-10-07: staging thrashed
  # its page cache, every probe timed out). The build alone takes several
  # minutes there, hence the longer start-up window (120 x 5s = 10 min).
  extraEnv:
    - name: JAVA_OPTS_KC_HEAP
      value: "-Xms64m -Xmx512m"
  startupProbe:
    periodSeconds: 5
    failureThreshold: 120
  realm:
    # Same Resend relay and verified domain as core-api's EMAIL_FROM above.
    smtp:
      from: "noreply@mairie360-eip.fr"
      fromDisplayName: "Mairie360 (staging)"
  db:
    persistence:
      size: "2Gi"
      storageClass: "local-path"

APIs:
  # MAIR-565: mirrors prod's warm pool at a lower maximum.
  dbPool:
    minConnections: 2
    maxConnections: 10
    idleTimeoutSecs: 600
  instances:
    core-api:
      enabled: true
      image: { repository: ghcr.io/mairie360/core-api, tag: "staging-b900797" }
      env:
        - name: PUBLIC_URL
          value: "https://login.staging.mairie360-eip.fr"
        # Transactional e-mails (password reset) are Resend templates sent
        # through the Resend API since MAIR-522 (API_lib `ResendMailer`), from
        # no-reply@<EMAIL_DOMAIN>: core-api refuses to start without
        # RESEND_API_KEY, EMAIL_DOMAIN and PUBLIC_URL. The API key is the one
        # sealed as SMTP_PASSWORD in <release>-app-secrets
        # (scripts/seal-secrets.sh, RESEND_API_KEY). EMAIL_DOMAIN must be
        # verified in the Resend dashboard.
        - name: RESEND_API_KEY
          valueFrom:
            secretKeyRef:
              name: "{{ .Release.Name }}-app-secrets"
              key: SMTP_PASSWORD
        - name: EMAIL_DOMAIN
          value: "mairie360-eip.fr"
        - name: EMAIL_SENDER_NAME
          value: "Mairie360 (staging)"
    project-api:
      enabled: true
      image: { repository: ghcr.io/mairie360/project-api, tag: "staging-be2b410" }
    calendar-api:
      enabled: true
      image: { repository: ghcr.io/mairie360/calendar-api, tag: "staging-3b4668b" }
    message-api:
      enabled: true
      image: { repository: ghcr.io/mairie360/message-api, tag: "staging-75d7650" }
    elearning-api:
      enabled: true
      image: { repository: ghcr.io/mairie360/elearning-api, tag: "staging-e3ffc1c" }
      env:
        # Course attachments are stored in Scaleway Object Storage (S3 API)
        # and served through presigned URLs. The access key pair lives in
        # <release>-app-secrets (scripts/seal-secrets.sh, S3_ACCESS_KEY /
        # S3_SECRET_KEY). Not optional: elearning-api panics without it, so a
        # missing key shows up as CreateContainerConfigError instead of a
        # CrashLoop.
        - name: S3_BUCKET
          value: "mairie360-elearning-staging"
        - name: S3_REGION
          value: "fr-par"
        - name: S3_ENDPOINT
          value: "https://s3.fr-par.scw.cloud"
        - name: S3_PRESIGN_TTL_SECS
          value: "900"
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: "{{ .Release.Name }}-app-secrets"
              key: S3_ACCESS_KEY
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: "{{ .Release.Name }}-app-secrets"
              key: S3_SECRET_KEY

BFFs:
  instances:
    user-bff:
      enabled: true
      port: 4000
      image: { repository: ghcr.io/mairie360/bff-user, tag: "staging-b6b04cf" }
      env:
        - name: COOKIE_DOMAIN
          value: ".staging.mairie360-eip.fr"
    project-bff:
      enabled: true
      port: 4001
      image: { repository: ghcr.io/mairie360/bff-project, tag: "staging-b643e72" }
    calendar-bff:
      enabled: true
      port: 4002
      image: { repository: ghcr.io/mairie360/bff-calendar, tag: "staging-f6bf247" }
      env:
        - name: CALENDAR_API_BASE_PATH
          value: "http://{{ .Release.Name }}-calendar-api:3002"
    message-bff:
      enabled: true
      port: 4003
      image: { repository: ghcr.io/mairie360/bff-message, tag: "staging-815c732" }
      env:
        - name: MESSAGE_API_BASE_PATH
          value: "http://{{ .Release.Name }}-message-api:3003"
    dashboard-bff:
      enabled: true
      port: 4004
      image: { repository: ghcr.io/mairie360/bff-dashboard, tag: "staging-3d74a6a" }
    settings-bff:
      enabled: true
      port: 4005
      image: { repository: ghcr.io/mairie360/bff-settings, tag: "staging-bdc4a88" }
    elearning-bff:
      enabled: true
      port: 4006
      image: { repository: ghcr.io/mairie360/bff-elearning, tag: "staging-55dfd4b" }

Fronts:
