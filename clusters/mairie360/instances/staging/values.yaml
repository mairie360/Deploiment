      image: { repository: ghcr.io/mairie360/login-front, tag: "staging-4acf656" }
      env:
        - name: COOKIE_DOMAIN
          value: ".staging.mairie360-eip.fr"
    project-front:
      enabled: true
      port: 5001
      image: { repository: ghcr.io/mairie360/projects-front, tag: "staging-8bfd374" }
      env:
        - name: COOKIE_DOMAIN
          value: ".staging.mairie360-eip.fr"
    calendar-front:
      enabled: true
      port: 5002
      image: { repository: ghcr.io/mairie360/calendar-front, tag: "staging-e4129bd" }
      env:
        - name: COOKIE_DOMAIN
          value: ".staging.mairie360-eip.fr"
    message-front:
      enabled: true
      port: 5003
      image: { repository: ghcr.io/mairie360/message-front, tag: "staging-500ac41" }
      env:
        - name: COOKIE_DOMAIN
          value: ".staging.mairie360-eip.fr"
    dashboard-front:
      enabled: true
      port: 5004
      image: { repository: ghcr.io/mairie360/dashboard-front, tag: "staging-f671932" }
    settings-front:
      enabled: true
      port: 5005
      image: { repository: ghcr.io/mairie360/settings-front, tag: "staging-891e2fa" }
    elearning-front:
      enabled: true
