# ============================================================================
# mairie360 / staging
#
# Une machine = un cluster k3s = un namespace mairie360-<env>.
# Déployé par l'ApplicationSet 'instances' de l'Argo CD du groupe mairie360,
# vers le cluster enregistré sous le nom 'staging'.
#
# Ce fichier ne contient QUE ce qui change d'un déploiement à l'autre.
# Les défauts sont dans charts/mairie360-stack/values.yaml.
# Every image tag (APIs, BFFs, fronts, database, liquibase) is moved forward
# by argocd-image-updater (newest staging-<sha>), committed on the `staging`
# branch into images.yaml, which overrides this file (MAIR-444).
# The pinned staging-<sha> tags below are only a starting point, but they must
# exist so a fresh instance starts without it (MAIR-172): never *-latest (no
# longer pushed) nor the mobile `staging` tag (not pushed by every repo yet).
# scripts/check-image-tags.sh enforces both in CI.
# ============================================================================

global:
  # MAIR-620: OpenTelemetry Collector -> the instance's Cockpit data sources
  # (created by mairie360/Infra, orgs/mairie360). COCKPIT_TOKEN is sealed by
  # ansible from the vault (/mairie360/staging/cockpit-token, issued by Infra's
  # scripts/issue-cockpit-tokens.sh).
  # Needs the endpoints below: the chart refuses an enabled collector without them.
  observability:
    enabled: true
    apis: ["core-api"]
  # Legal pages (MAIR-292): identity of the mairie to complete; retention and
  # subprocessors repeat compliance/mairie360/ (scripts/check-compliance.py).
  legal:
    mairie: { name: "", address: "", email: "" }
    publicationDirector: ""
    dpo: { name: "", email: "" }
    host: { name: "", address: "" }
    retention:
      technical_logs: "1 year"
      archived_accounts_anonymization: "1 year"
      sessions: "6 months"
      connection_logs: "1 year"
      access_logs: "3 years"
      users_audit_log: "10 years"
    serviceLevels: { rpo: "6 hours", rto: "2 hours" }
    subprocessors:
      - { name: Scaleway, location: "France (fr-par)", purpose: "hébergement des sauvegardes chiffrées de la base et des pièces jointes des formations (stockage objet)" }
      - { name: Scaleway Cockpit, location: "France (fr-par)", purpose: "traces techniques des APIs lorsque l'observabilité est activée (sans contenu des requêtes)" }
      - { name: Resend, location: "European Union (eu-west-1)", purpose: "envoi des e-mails de la plateforme (réinitialisation du mot de passe, invitation)" }
  domain: "staging.mairie360-eip.fr"
  # Session tokens signed by core-api alone (MAIR-680, audit A1). TODO
  # (after scripts/seal-secrets.sh, or ansible playbooks/secrets.yml, sealed
  # <release>-jwt-signing-secret on this machine): paste the PUBLIC KEY block
  # it printed as publicKey, then turn signing on once every API and BFF image
  # of staging verifies EdDSA. Required since JWT_SECRET was removed: the chart
  # refuses to render without it.
  jwt:
    publicKey: |
      -----BEGIN PUBLIC KEY-----
      MCowBQYDK2VwAyEA/HVvxLHuMT/0AfZwWW7e8LnSti6TGI9OzuW9+6p2E5I=
      -----END PUBLIC KEY-----
    signing:
      enabled: true
  imagePullSecret: "ghcr-secret"
  # Ingress controller of this machine: "nginx" or "traefik" (MAIR-260).
  # Must match the Argo CD cluster label mairie360.fr/ingress set by ansible
  # (`ingress_controller`); switch procedure in
  # docs/adr/0001-replace-ingress-nginx.md. The IngressClass, annotations
  # and NetworkPolicy namespace follow from it.
  ingressController: "traefik"
  networkPolicy:
    enabled: true
    # Passer à true une fois les destinations externes connues et déclarées
    # dans egressAllowCIDRs.
    egressDefaultDeny: false

# Secrets fournis par SealedSecret (secrets.yaml, généré par
# scripts/seal-secrets.sh mairie360 staging). Jamais de valeur en clair ici.
secrets:
  create: false

ingress:
  enabled: true
  clusterIssuer: "letsencrypt-prod"
  # 50 MiB body limit and HTTPS redirect: chart defaults (ingress.maxBodySizeMiB).

database:
  image:
    tag: "staging-99cb14d"
  secret:
    create: false
  persistence:
    size: "5Gi"
    storageClass: "local-path"

redis:
  secret:
    create: false
  # The JWT revocation list (`revoked:<sid>`) lives in this Redis: on an emptyDir the AOF is lost
  # when the pod is rescheduled and every revoked JWT is accepted again until it expires. A PVC
  # keeps it (the instance is one k3s node, local-path is bound to it; Recreate frees the volume).
  persistence:
    enabled: true
    size: "1Gi"
    storageClass: "local-path"

liquibase:
  image:
    tag: "staging-99cb14d"
  db:
    name: "mairie_db_staging"

# Off-machine encrypted Postgres backups (MAIR-119/MAIR-231,
# charts/backup/README.md). Needs the bucket below to exist and
# <release>-backup-secret sealed (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
# exported when running scripts/seal-secrets.sh) before the first sync after
# this change — until then the CronJob's pod sits in
# CreateContainerConfigError, same as any new Secret (see the root
# CLAUDE.md Gotchas). Schedule and retention are applied by Argo CD on the
# next sync.
# MAIR-620: push URLs of this instance's Cockpit data sources, from
#   scripts/tf.sh orgs/mairie360 output -json instances | jq '.staging.cockpit_endpoints'
# in mairie360/Infra. Not secret.
# tests/scripts/mair_620_cockpit_endpoints_test.sh refuses anything but a
# Cockpit data source URL.
observability:
  cockpit:
    metricsEndpoint: "https://c6d10e3a-ad3a-4619-be1d-148fc710c7fc.metrics.cockpit.fr-par.scw.cloud/otlp/v1/metrics"
    tracesEndpoint: "https://9f5d405f-306a-419c-8880-abd536f7526a.traces.cockpit.fr-par.scw.cloud/otlp/v1/traces"

backup:
  enabled: true
  schedule: "0 */6 * * *"
  retention:
    keepHourly: 8
    keepDaily: 7
    keepWeekly: 4
    keepMonthly: 6
  s3:
    endpoint: "https://s3.fr-par.scw.cloud"
    # Versioned, COMPLIANCE-locked 30 days, created by mairie360/Infra (MAIR-618).
    bucket: "mairie360-backups-staging"
    region: "fr-par"

APIs:
  # MAIR-565: mirrors prod's warm pool at a lower maximum.
  dbPool:
    minConnections: 2
    maxConnections: 10
    idleTimeoutSecs: 600
  instances:
    core-api:
      enabled: true
      image: { repository: ghcr.io/mairie360/core-api, tag: "staging-6cd2b3b" }
      env:
        - name: PUBLIC_URL
          value: "https://login.staging.mairie360-eip.fr"
        # Link of the stolen-session alert e-mail to the administrators: the
        # agent's sign-in journal in the administration front.
        - name: ADMIN_PUBLIC_URL
          value: "https://admin.staging.mairie360-eip.fr"
        # Transactional e-mails (password reset) are Resend templates sent
        # through the Resend API since MAIR-522 (API_lib `ResendMailer`), from
        # no-reply@<EMAIL_DOMAIN>: core-api refuses to start without
        # RESEND_API_KEY, EMAIL_DOMAIN and PUBLIC_URL. The API key is the one
        # sealed as SMTP_PASSWORD in <release>-app-secrets
        # (scripts/seal-secrets.sh, RESEND_API_KEY). EMAIL_DOMAIN must be
        # verified in the Resend dashboard.
        - name: RESEND_API_KEY
          valueFrom:
            secretKeyRef:
              name: "{{ .Release.Name }}-app-secrets"
              key: SMTP_PASSWORD
        - name: EMAIL_DOMAIN
          value: "mairie360-eip.fr"
        - name: EMAIL_SENDER_NAME
          value: "Mairie360 (staging)"
    project-api:
      enabled: true
      image: { repository: ghcr.io/mairie360/project-api, tag: "staging-c46ada2" }
    calendar-api:
      enabled: true
      image: { repository: ghcr.io/mairie360/calendar-api, tag: "staging-f3a4e09" }
    message-api:
      enabled: true
      image: { repository: ghcr.io/mairie360/message-api, tag: "staging-0350e1d" }
    elearning-api:
      enabled: true
      image: { repository: ghcr.io/mairie360/elearning-api, tag: "staging-28cd45f" }
      env:
        # Course attachments are stored in Scaleway Object Storage (S3 API)
        # and served through presigned URLs. The access key pair lives in
        # <release>-app-secrets (scripts/seal-secrets.sh, S3_ACCESS_KEY /
        # S3_SECRET_KEY). Not optional: elearning-api panics without it, so a
        # missing key shows up as CreateContainerConfigError instead of a
        # CrashLoop.
        - name: S3_BUCKET
          value: "mairie360-elearning-staging"
        - name: S3_REGION
          value: "fr-par"
        - name: S3_ENDPOINT
          value: "https://s3.fr-par.scw.cloud"
        - name: S3_PRESIGN_TTL_SECS
          value: "900"
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: "{{ .Release.Name }}-app-secrets"
              key: S3_ACCESS_KEY
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: "{{ .Release.Name }}-app-secrets"
              key: S3_SECRET_KEY

BFFs:
  instances:
    user-bff:
      enabled: true
      port: 4000
      image: { repository: ghcr.io/mairie360/bff-user, tag: "staging-f75885a" }
      env:
        - name: COOKIE_DOMAIN
          value: ".staging.mairie360-eip.fr"
    project-bff:
      enabled: true
      port: 4001
      image: { repository: ghcr.io/mairie360/bff-project, tag: "staging-0a7f84a" }
    calendar-bff:
      enabled: true
      port: 4002
      image: { repository: ghcr.io/mairie360/bff-calendar, tag: "staging-3b241a6" }
      env:
        - name: CALENDAR_API_BASE_PATH
          value: "http://{{ .Release.Name }}-calendar-api:3002"
    message-bff:
      enabled: true
      port: 4003
      image: { repository: ghcr.io/mairie360/bff-message, tag: "staging-0fbdc45" }
      env:
        - name: MESSAGE_API_BASE_PATH
          value: "http://{{ .Release.Name }}-message-api:3003"
    dashboard-bff:
      enabled: true
      port: 4004
      image: { repository: ghcr.io/mairie360/bff-dashboard, tag: "staging-e08ec9a" }
    settings-bff:
      enabled: true
      port: 4005
      image: { repository: ghcr.io/mairie360/bff-settings, tag: "staging-eb15b44" }
    elearning-bff:
      enabled: true
      port: 4006
      image: { repository: ghcr.io/mairie360/bff-elearning, tag: "staging-28a2299" }

Fronts:
  instances:
    login-front:
      enabled: true
      port: 5000
      image: { repository: ghcr.io/mairie360/login-front, tag: "staging-06cc6fe" }
    project-front:
      enabled: true
      port: 5001
      image: { repository: ghcr.io/mairie360/projects-front, tag: "staging-6f0f231" }
    calendar-front:
      enabled: true
      port: 5002
      image: { repository: ghcr.io/mairie360/calendar-front, tag: "staging-f9ca8bc" }
    message-front:
      enabled: true
      port: 5003
      image: { repository: ghcr.io/mairie360/message-front, tag: "staging-f5c222d" }
    dashboard-front:
      enabled: true
      port: 5004
      image: { repository: ghcr.io/mairie360/dashboard-front, tag: "staging-ce56831" }
    settings-front:
      enabled: true
      port: 5005
      image: { repository: ghcr.io/mairie360/settings-front, tag: "staging-8fe2710" }
    elearning-front:
