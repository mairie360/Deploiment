# ===========================================================================
# SealedSecret de mairie360 / staging.
#
# GÉNÉRÉ PAR scripts/seal-secrets.sh — ne pas éditer à la main.
# Chiffré avec la clé du contrôleur sealed-secrets de CETTE machine :
# commitable tel quel, indéchiffrable ailleurs.
#
# Régénérer (conserve les valeurs existantes) :
#   ./scripts/seal-secrets.sh staging mairie360 staging
# Faire tourner tous les secrets :
#   ./scripts/seal-secrets.sh staging mairie360 staging --rotate
# Rotate only the API Postgres role passwords (applied by the next Liquibase sync):
#   ./scripts/seal-secrets.sh staging mairie360 staging --rotate-roles
# Change the Resend API key (SMTP_PASSWORD of core-api):
#   RESEND_API_KEY=re_xxx ./scripts/seal-secrets.sh staging mairie360 staging
# Change the Object Storage key pair (S3_ACCESS_KEY / S3_SECRET_KEY of elearning-api):
#   S3_ACCESS_KEY=SCW... S3_SECRET_KEY=... ./scripts/seal-secrets.sh staging mairie360 staging
# Set the admin account's e-mail (MAIR-170, ADMIN_PASSWORD is generated once unless set,
# sealed as its argon2id hash, MAIR-414):
#   ADMIN_EMAIL=admin@example.org ./scripts/seal-secrets.sh staging mairie360 staging
# Re-seal a bff-user client secret regenerated in the Keycloak admin console (MAIR-139):
#   BFF_USER_CLIENT_SECRET=... ./scripts/seal-secrets.sh staging mairie360 staging
# Change the Cockpit token (OpenTelemetry Collector, MAIR-131):
#   COCKPIT_TOKEN=... ./scripts/seal-secrets.sh staging mairie360 staging
# ===========================================================================
