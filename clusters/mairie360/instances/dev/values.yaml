# ============================================================================
# mairie360 / dev
#
# Une machine = un cluster k3s = un namespace mairie360-<env>.
# Déployé par l'ApplicationSet 'instances' de l'Argo CD du groupe mairie360,
# vers le cluster enregistré sous le nom 'dev'.
#
# Ce fichier ne contient QUE ce qui change d'un déploiement à l'autre.
# Les défauts sont dans charts/mairie360-stack/values.yaml.
# APIs/BFFs/Fronts image tags are moved forward by argocd-image-updater
# (newest dev-<sha>); database and liquibase are not, bump them by hand.
# The pinned dev-<sha> tags below are only a starting point, but they must
# exist so a fresh instance starts without it (MAIR-172): never *-latest (no
# longer pushed) nor the mobile `dev` tag (not pushed by every repo yet).
# scripts/check-image-tags.sh enforces both in CI.
# ============================================================================

global:
  domain: "dev.mairie360-eip.fr"
  imagePullSecret: "ghcr-secret"
  # Ingress controller of this machine: "nginx" or "traefik" (MAIR-260).
  # Must match the Argo CD cluster label mairie360.fr/ingress set by ansible
  # (`ingress_controller`); switch procedure in
  # docs/adr/0001-replace-ingress-nginx.md. The IngressClass, annotations
  # and NetworkPolicy namespace follow from it.
  ingressController: "traefik"
  networkPolicy:
    enabled: true
    # Passer à true une fois les destinations externes connues et déclarées
    # dans egressAllowCIDRs.
    egressDefaultDeny: false
    # HTTP details (method, path, status) in Hubble on fronts -> bffs -> apis.
    # Requires the Cilium CNI installed by the Ansible role k8s_node.
    ciliumL7Visibility: true
  # MAIR-131 (POC): OpenTelemetry Collector -> Scaleway Cockpit, core-api only.
  # Turn on once the two Cockpit data sources below exist and
  # <release>-cockpit-secret is sealed (COCKPIT_TOKEN exported when running
  # scripts/seal-secrets.sh): with empty endpoints the chart refuses to render.
  # Commented out: the chart default is already `enabled: false`.
  # observability:
  #   enabled: false
  #   apis: ["core-api"]

# Secrets fournis par SealedSecret (secrets.yaml, généré par
# scripts/seal-secrets.sh mairie360 dev). Jamais de valeur en clair ici.
secrets:
  create: false

ingress:
  enabled: true
  clusterIssuer: "letsencrypt-prod"
  # 50 MiB body limit and HTTPS redirect: chart defaults (ingress.maxBodySizeMiB).

# Memory sizing (dev, 4 GB machine, no headroom). Every value below is set from
# the working set measured on the running instance (crictl stats, 2026-09-28):
# fronts 40-55 MiB, BFFs 26-50 MiB, APIs ~5 MiB, Postgres 40 MiB, Redis 6 MiB.
# Requests are about the idle usage, limits leave 3-4x for startup and peaks.
# The chart defaults (256-512 MiB limits) stay as is for staging and prod.
database:
  image:
    tag: "dev-ec4f539"
  secret:
    create: false
  persistence:
    size: "5Gi"
    storageClass: "local-path"
  resources:
    requests: { memory: "96Mi", cpu: "100m" }
    limits:   { memory: "384Mi", cpu: "1000m" }

redis:
  secret:
    create: false
  resources:
    requests: { memory: "32Mi", cpu: "50m" }
    limits:   { memory: "192Mi", cpu: "500m" }

liquibase:
  image:
    tag: "dev-ec4f539"
  db:
    name: "mairie_db_dev"

# Off-machine encrypted Postgres backups (MAIR-119/MAIR-231,
# charts/backup/README.md). Needs the bucket below to exist and
# <release>-backup-secret sealed (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
# exported when running scripts/seal-secrets.sh) before the first sync after
# this change — until then the CronJob's pod sits in
# CreateContainerConfigError, same as any new Secret (see the root
# CLAUDE.md Gotchas). Schedule and retention are applied by Argo CD on the
# next sync. keycloak.enabled also dumps <release>-keycloak-db into the same
# repository (KEYCLOAK_DB_PASSWORD, no extra secret to seal).
backup:
  enabled: true
  schedule: "0 3 * * *"
  retention:
    keepDaily: 7
    keepWeekly: 4
    keepMonthly: 6
  s3:
    endpoint: "https://s3.fr-par.scw.cloud"
    bucket: "mairie360-backup-dev"
    region: "fr-par"
  keycloak:
    enabled: true

# Keycloak (MAIR-139): the instance's identity provider, on
# https://auth.<global.domain> (DNS record required, like the fronts). Realm
# and clients: charts/mairie360-stack/charts/keycloak/values.yaml. Its own
# Postgres is covered by the backup CronJob above (backup.keycloak.enabled,
# MAIR-231). Requires <release>-keycloak-secret in secrets.yaml
# (scripts/seal-secrets.sh).
keycloak:
  enabled: true
  # Keycloak idles around 400 MiB. Cap the heap explicitly: without it the JVM
  # sizes it as a percentage of the limit and the rest (metaspace, threads,
  # code cache) can push the container over the limit during the realm import.
  extraEnv:
    - name: JAVA_OPTS_KC_HEAP
      value: "-Xms64m -Xmx512m"
  resources:
    requests: { memory: "400Mi", cpu: "100m" }
    limits:   { memory: "1Gi", cpu: "1000m" }
  realm:
    # Same Resend relay and verified domain as core-api's EMAIL_FROM above.
    smtp:
      from: "noreply@mairie360-eip.fr"
      fromDisplayName: "Mairie360 (dev)"
  db:
    persistence:
      size: "1Gi"
      storageClass: "local-path"

# Cockpit push URLs of the dev data sources (Cockpit console > Data sources).
# Not secret: the token lives in <release>-cockpit-secret.
# Commented out until Cockpit is enabled (chart default: empty endpoints).
# observability:
#   cockpit:
#     # https://<metrics-datasource-id>.metrics.cockpit.fr-par.scw.cloud/otlp/v1/metrics
#     metricsEndpoint: ""
#     # https://<traces-datasource-id>.traces.cockpit.fr-par.scw.cloud/otlp/v1/traces
#     tracesEndpoint: ""

APIs:
  resources:
    requests: { memory: "24Mi", cpu: "50m" }
    limits:   { memory: "192Mi", cpu: "500m" }
  # MAIR-565: light traffic; one connection stays open so the first request
  # after a pause does not reconnect.
  dbPool:
    minConnections: 1
    maxConnections: 5
    idleTimeoutSecs: 300
  instances:
    core-api:
      enabled: true
      image: { repository: ghcr.io/mairie360/core-api, tag: "dev-71c0ee1" }
      env:
        - name: PUBLIC_URL
          value: "https://login.dev.mairie360-eip.fr"
        # Transactional e-mails (password reset) are Resend templates sent
        # through the Resend API since MAIR-522 (API_lib `ResendMailer`), from
        # no-reply@<EMAIL_DOMAIN>: core-api refuses to start without
        # RESEND_API_KEY, EMAIL_DOMAIN and PUBLIC_URL. The API key is the one
        # sealed as SMTP_PASSWORD in <release>-app-secrets
        # (scripts/seal-secrets.sh, RESEND_API_KEY). EMAIL_DOMAIN must be
        # verified in the Resend dashboard.
        - name: RESEND_API_KEY
          valueFrom:
            secretKeyRef:
              name: "{{ .Release.Name }}-app-secrets"
              key: SMTP_PASSWORD
        - name: EMAIL_DOMAIN
          value: "mairie360-eip.fr"
        - name: EMAIL_SENDER_NAME
          value: "Mairie360 (dev)"
    project-api:
      enabled: true
      image: { repository: ghcr.io/mairie360/project-api, tag: "dev-4e11bac" }
    calendar-api:
      enabled: true
      image: { repository: ghcr.io/mairie360/calendar-api, tag: "dev-a40acfd" }
    message-api:
      enabled: true
      image: { repository: ghcr.io/mairie360/message-api, tag: "dev-d35e7df" }
    elearning-api:
      enabled: true
      image: { repository: ghcr.io/mairie360/elearning-api, tag: "dev-87d9e8f" }
      env:
        # Course attachments are stored in Scaleway Object Storage (S3 API)
        # and served through presigned URLs. The access key pair lives in
        # <release>-app-secrets (scripts/seal-secrets.sh, S3_ACCESS_KEY /
        # S3_SECRET_KEY). Not optional: elearning-api panics without it, so a
        # missing key shows up as CreateContainerConfigError instead of a
        # CrashLoop.
        - name: S3_BUCKET
          value: "mairie360-elearning-dev"
        - name: S3_REGION
          value: "fr-par"
        - name: S3_ENDPOINT
          value: "https://s3.fr-par.scw.cloud"
        - name: S3_PRESIGN_TTL_SECS
          value: "900"
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: "{{ .Release.Name }}-app-secrets"
              key: S3_ACCESS_KEY
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: "{{ .Release.Name }}-app-secrets"
              key: S3_SECRET_KEY

