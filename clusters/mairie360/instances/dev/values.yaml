# ============================================================================
# mairie360 / dev
#
# Une machine = un cluster k3s = un namespace mairie360-<env>.
# Déployé par l'ApplicationSet 'instances' de l'Argo CD du groupe mairie360,
# vers le cluster enregistré sous le nom 'dev'.
#
# Ce fichier ne contient QUE ce qui change d'un déploiement à l'autre.
# Les défauts sont dans charts/mairie360-stack/values.yaml.
# Les tags d'images sont mis à jour par argocd-image-updater.
# ============================================================================

global:
  domain: "dev.mairie360-eip.fr"
  imagePullSecret: "ghcr-secret"
  # ingress-nginx est le seul contrôleur : k3s est installé avec Traefik
  # désactivé (rôle Ansible k8s_node).
  ingressNamespace: "ingress-nginx"
  networkPolicy:
    enabled: true
    # Passer à true une fois les destinations externes de elearning-api
    # (Object Storage S3), email-api (SMTP) et files-api (S3) déclarées dans
    # egressAllowCIDRs.
    egressDefaultDeny: false

# Secrets fournis par SealedSecret (secrets.yaml, généré par
# scripts/seal-secrets.sh mairie360 dev). Jamais de valeur en clair ici.
secrets:
  create: false

ingress:
  enabled: true
  className: "nginx"
  clusterIssuer: "letsencrypt-staging"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

database:
  secret:
    create: false
  persistence:
    size: "5Gi"
    storageClass: "local-path"

redis:
  secret:
    create: false

liquibase:
  image:
    tag: "dev-latest"
  db:
    name: "mairie_db_dev"

APIs:
  instances:
    core-api:
      enabled: true
      image: { repository: ghcr.io/mairie360/core-api, tag: "dev-4048375" }
      env:
        - name: PUBLIC_URL
          value: "https://login.dev.mairie360-eip.fr"
    project-api:
      enabled: true
      image: { repository: ghcr.io/mairie360/project-api, tag: "dev-89c9730" }
    calendar-api:
      enabled: true
      image: { repository: ghcr.io/mairie360/calendar-api, tag: "dev-d6d05a0" }
    message-api:
      enabled: true
      image: { repository: ghcr.io/mairie360/message-api, tag: "dev-37b72aa" }
    email-api:
      enabled: true
      image: { repository: ghcr.io/mairie360/email-api, tag: "dev-latest" }
    files-api:
      enabled: true
      image: { repository: ghcr.io/mairie360/files-api, tag: "dev-latest" }
    elearning-api:
      enabled: true
      image: { repository: ghcr.io/mairie360/elearning-api, tag: "dev-1054189" }
      env:
        # Course attachments are stored in Scaleway Object Storage (S3 API)
        # and served through presigned URLs. The access key pair lives in
        # <release>-app-secrets (scripts/seal-secrets.sh, S3_ACCESS_KEY /
        # S3_SECRET_KEY). Not optional: elearning-api panics without it, so a
        # missing key shows up as CreateContainerConfigError instead of a
        # CrashLoop.
        - name: S3_BUCKET
          value: "mairie360-elearning-dev"
        - name: S3_REGION
          value: "fr-par"
        - name: S3_ENDPOINT
          value: "https://s3.fr-par.scw.cloud"
        - name: S3_PRESIGN_TTL_SECS
          value: "900"
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: "{{ .Release.Name }}-app-secrets"
              key: S3_ACCESS_KEY
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: "{{ .Release.Name }}-app-secrets"
              key: S3_SECRET_KEY

BFFs:
  instances:
    user-bff:
      enabled: true
      port: 4000
      image: { repository: ghcr.io/mairie360/bff-user, tag: "dev-4b75c8e" }
      env:
        - name: COOKIE_DOMAIN
          value: ".dev.mairie360-eip.fr"
    project-bff:
      enabled: true
      port: 4001
      image: { repository: ghcr.io/mairie360/bff-project, tag: "dev-a63e9b2" }
    calendar-bff:
      enabled: true
      port: 4002
      image: { repository: ghcr.io/mairie360/bff-calendar, tag: "dev-300106e" }
      env:
        - name: CALENDAR_API_BASE_PATH
          value: "http://{{ .Release.Name }}-calendar-api:3002/api"
    message-bff:
      enabled: true
      port: 4003
      image: { repository: ghcr.io/mairie360/bff-message, tag: "dev-bebfa8d" }
      env:
        - name: MESSAGE_API_BASE_PATH
          value: "http://{{ .Release.Name }}-message-api:3003/api"
    email-bff:
      enabled: true
      port: 4004
      image: { repository: ghcr.io/mairie360/bff-email, tag: "dev-latest" }
    files-bff:
      enabled: true
      port: 4005
      image: { repository: ghcr.io/mairie360/bff-files, tag: "dev-latest" }
    elearning-bff:
      enabled: true
      port: 4006
      image: { repository: ghcr.io/mairie360/bff-elearning, tag: "dev-7ba7c93" }

Fronts:
  instances:
    login-front:
      enabled: true
      port: 5000
      image: { repository: ghcr.io/mairie360/login-front, tag: "dev-9b2ea4a" }
      env:
        - name: COOKIE_DOMAIN
          value: ".dev.mairie360-eip.fr"
    project-front:
      enabled: true
      port: 5001
      image: { repository: ghcr.io/mairie360/projects-front, tag: "dev-0a88185" }
      env:
        - name: COOKIE_DOMAIN
          value: ".dev.mairie360-eip.fr"
    calendar-front:
      enabled: true
      port: 5002
      image: { repository: ghcr.io/mairie360/calendar-front, tag: "dev-b3bc020" }
      env:
        - name: COOKIE_DOMAIN
          value: ".dev.mairie360-eip.fr"
    message-front:
      enabled: true
      port: 5003
      image: { repository: ghcr.io/mairie360/message-front, tag: "dev-39a9e87" }
      env:
        - name: COOKIE_DOMAIN
          value: ".dev.mairie360-eip.fr"
    email-front:
      enabled: true
      port: 5004
      image: { repository: ghcr.io/mairie360/email-front, tag: "dev-latest" }
      env:
        - name: COOKIE_DOMAIN
          value: ".dev.mairie360-eip.fr"
    files-front:
      enabled: true
      port: 5005
      image: { repository: ghcr.io/mairie360/files-front, tag: "dev-latest" }
      env:
        - name: COOKIE_DOMAIN
          value: ".dev.mairie360-eip.fr"
    elearning-front:
      enabled: true
      port: 5006
      image: { repository: ghcr.io/mairie360/elearning-front, tag: "dev-7b2585e" }
      env:
        - name: COOKIE_DOMAIN
          value: ".dev.mairie360-eip.fr"
    admin-front:
      enabled: true
      port: 5007
      image: { repository: ghcr.io/mairie360/administrator-front, tag: "dev-1e0bcf0" }
      env:
        - name: COOKIE_DOMAIN
          value: ".dev.mairie360-eip.fr"
