# ============================================================================
# mairie360 / prod
#
# Une machine = un cluster k3s = un namespace mairie360-<env>.
# Déployé par l'ApplicationSet 'instances' de l'Argo CD du groupe mairie360,
# vers le cluster enregistré sous le nom 'prod'.
#
# Only what differs from clusters/_base/prod.yaml (MAIR-414), which holds the
# versions and settings shared by every prod instance.
# ============================================================================

global:
  # Legal pages (MAIR-292): identity of the mairie to complete; retention and
  # subprocessors repeat compliance/mairie360/ (scripts/check-compliance.py).
  legal:
    mairie: { name: "", address: "", email: "" }
    publicationDirector: ""
    dpo: { name: "", email: "" }
    host: { name: "", address: "" }
    retention:
      technical_logs: "1 year"
      archived_accounts_anonymization: "1 year"
      sessions: "6 months"
      connection_logs: "1 year"
      access_logs: "3 years"
      users_audit_log: "10 years"
    subprocessors:
      - { name: Scaleway, location: "France (fr-par)", purpose: "hébergement des sauvegardes chiffrées de la base et des pièces jointes des formations (stockage objet)" }
      - { name: Scaleway Cockpit, location: "France (fr-par)", purpose: "traces techniques des APIs lorsque l'observabilité est activée (sans contenu des requêtes)" }
      - { name: Resend, location: "European Union (eu-west-1)", purpose: "envoi des e-mails de la plateforme (réinitialisation du mot de passe, invitation)" }
  domain: "prod.mairie360-eip.fr"
  # Sender of core-api's and Keycloak's e-mails; its domain must be verified
  # in the Resend dashboard.
  emailFrom: "noreply@mairie360-eip.fr"
  # Scaleway Object Storage bucket of elearning-api's course attachments.
  elearningBucket: "mairie360-elearning-prod"

backup:
  s3:
    bucket: "mairie360-backup-prod"

keycloak:
  realm:
    smtp:
      from: "noreply@mairie360-eip.fr"
