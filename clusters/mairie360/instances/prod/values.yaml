# ============================================================================
# mairie360 / prod
#
# Une machine = un cluster k3s = un namespace mairie360-<env>.
# Déployé par l'ApplicationSet 'instances' de l'Argo CD du groupe mairie360,
# vers le cluster enregistré sous le nom 'prod'.
#
# Ce fichier ne contient QUE ce qui change d'un déploiement à l'autre.
# Les défauts sont dans charts/mairie360-stack/values.yaml.
# Les tags d'images sont mis à jour par argocd-image-updater.
# ============================================================================

global:
  domain: "mairie360-eip.fr"
  imagePullSecret: "ghcr-secret"
  # ingress-nginx est le seul contrôleur : k3s est installé avec Traefik
  # désactivé (rôle Ansible k8s_node).
  ingressNamespace: "ingress-nginx"
  networkPolicy:
    enabled: true
    # Passer à true une fois les destinations externes connues et déclarées
    # dans egressAllowCIDRs.
    egressDefaultDeny: false

# Secrets fournis par SealedSecret (secrets.yaml, généré par
# scripts/seal-secrets.sh mairie360 prod). Jamais de valeur en clair ici.
secrets:
  create: false

ingress:
  enabled: true
  className: "nginx"
  clusterIssuer: "letsencrypt-prod"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

database:
  image:
    tag: "1.3.0"
  secret:
    create: false
  persistence:
    size: "20Gi"
    storageClass: "local-path"

redis:
  secret:
    create: false

liquibase:
  image:
    tag: "1.3.0"
  db:
    name: "mairie_db_prod"

APIs:
  instances:
    core-api:
      enabled: true
      image: { repository: ghcr.io/mairie360/core-api, tag: "1.2.0" }
      env:
        - name: PUBLIC_URL
          value: "https://login.mairie360-eip.fr"
    project-api:
      enabled: true
      image: { repository: ghcr.io/mairie360/project-api, tag: "0.5.1" }
    calendar-api:
      enabled: true
      image: { repository: ghcr.io/mairie360/calendar-api, tag: "0.6.1" }
    message-api:
      enabled: true
      image: { repository: ghcr.io/mairie360/message-api, tag: "0.7.1" }
    elearning-api:
      enabled: true
      image: { repository: ghcr.io/mairie360/elearning-api, tag: "0.6.1" }

BFFs:
  instances:
    user-bff:
      enabled: true
      port: 4000
      image: { repository: ghcr.io/mairie360/bff-user, tag: "0.5.0" }
      env:
        - name: COOKIE_DOMAIN
          value: ".mairie360-eip.fr"
    project-bff:
      enabled: true
      port: 4001
      image: { repository: ghcr.io/mairie360/bff-project, tag: "0.4.0" }
    calendar-bff:
      enabled: true
      port: 4002
      image: { repository: ghcr.io/mairie360/bff-calendar, tag: "0.4.0" }
      env:
        - name: CALENDAR_API_BASE_PATH
          value: "http://{{ .Release.Name }}-calendar-api:3002/api"
    message-bff:
      enabled: true
      port: 4003
      image: { repository: ghcr.io/mairie360/bff-message, tag: "0.4.0" }
      env:
        - name: MESSAGE_API_BASE_PATH
          value: "http://{{ .Release.Name }}-message-api:3003/api"
    dashboard-bff:
      enabled: true
      port: 4004
      image: { repository: ghcr.io/mairie360/bff-dashboard, tag: "1.1.0" }
    settings-bff:
      enabled: true
      port: 4005
      image: { repository: ghcr.io/mairie360/bff-settings, tag: "1.1.0" }
    elearning-bff:
      enabled: true
      port: 4006
      image: { repository: ghcr.io/mairie360/bff-elearning, tag: "0.4.0" }

Fronts:
  instances:
    login-front:
      enabled: true
      port: 5000
      image: { repository: ghcr.io/mairie360/login-front, tag: "0.2.0" }
      env:
        - name: COOKIE_DOMAIN
          value: ".mairie360-eip.fr"
    project-front:
      enabled: true
      port: 5001
      image: { repository: ghcr.io/mairie360/projects-front, tag: "1.0.0" }
      env:
        - name: COOKIE_DOMAIN
          value: ".mairie360-eip.fr"
    calendar-front:
      enabled: true
      port: 5002
      image: { repository: ghcr.io/mairie360/calendar-front, tag: "0.3.0" }
      env:
        - name: COOKIE_DOMAIN
          value: ".mairie360-eip.fr"
    message-front:
      enabled: true
      port: 5003
      image: { repository: ghcr.io/mairie360/message-front, tag: "0.3.0" }
      env:
        - name: COOKIE_DOMAIN
          value: ".mairie360-eip.fr"
    dashboard-front:
      enabled: true
      port: 5004
      image: { repository: ghcr.io/mairie360/dashboard-front, tag: "1.0.0" }
    settings-front:
      enabled: true
      port: 5005
      image: { repository: ghcr.io/mairie360/settings-front, tag: "1.0.0" }
    elearning-front:
      enabled: true
      port: 5006
      image: { repository: ghcr.io/mairie360/elearning-front, tag: "0.2.0" }
      env:
        - name: COOKIE_DOMAIN
          value: ".mairie360-eip.fr"
    admin-front:
      enabled: false  # no release published yet; re-enable with its first version
      port: 5007
      image: { repository: ghcr.io/mairie360/administrator-front, tag: "1.0.0" }
      env:
        - name: COOKIE_DOMAIN
          value: ".mairie360-eip.fr"
