# ============================================================================
# mairie360 / prod
#
# Une machine = un cluster k3s = un namespace mairie360-<env>.
# Déployé par l'ApplicationSet 'instances' de l'Argo CD du groupe mairie360,
# vers le cluster enregistré sous le nom 'prod'.
#
# Only what differs from clusters/_base/prod.yaml (MAIR-414), which holds the
# versions and settings shared by every prod instance.
# ============================================================================

global:
  # MAIR-620: OpenTelemetry Collector -> the instance's Cockpit data sources
  # (created by mairie360/Infra, orgs/mairie360). COCKPIT_TOKEN is sealed by
  # ansible from the vault (/mairie360/prod/cockpit-token, issued by Infra's
  # scripts/issue-cockpit-tokens.sh).
  # TO TURN ON (true) in the same commit as the endpoints below, once the
  # Infra apply created the data sources: the chart refuses to render an
  # enabled collector without them.
  observability:
    enabled: false
    apis: ["core-api"]
  # Legal pages (MAIR-292): identity of the mairie to complete; retention and
  # subprocessors repeat compliance/mairie360/ (scripts/check-compliance.py).
  legal:
    mairie: { name: "", address: "", email: "" }
    publicationDirector: ""
    dpo: { name: "", email: "" }
    host: { name: "", address: "" }
    retention:
      technical_logs: "1 year"
      archived_accounts_anonymization: "1 year"
      sessions: "6 months"
      connection_logs: "1 year"
      access_logs: "3 years"
      users_audit_log: "10 years"
    subprocessors:
      - { name: Scaleway, location: "France (fr-par)", purpose: "hébergement des sauvegardes chiffrées de la base et des pièces jointes des formations (stockage objet)" }
      - { name: Scaleway Cockpit, location: "France (fr-par)", purpose: "traces techniques des APIs lorsque l'observabilité est activée (sans contenu des requêtes)" }
      - { name: Resend, location: "European Union (eu-west-1)", purpose: "envoi des e-mails de la plateforme (réinitialisation du mot de passe, invitation)" }
  domain: "prod.mairie360-eip.fr"
  # Session tokens signed by core-api alone (MAIR-680, audit A1). TODO
  # (after scripts/seal-secrets.sh, or ansible playbooks/secrets.yml, sealed
  # <release>-jwt-signing-secret on this machine): paste the PUBLIC KEY block
  # it printed as publicKey, then turn signing on once every API and BFF image
  # of prod verifies EdDSA. Empty = the services keep verifying the HS256
  # tokens of JWT_SECRET only; the chart refuses signing without a public key.
  jwt:
    publicKey: ""
    signing:
      enabled: false
  # MAIR-612: this machine runs Traefik (ADR 0001), like dev and staging. Must
  # match ansible's `ingress_controller` for the host; the other prod
  # instances keep the base's nginx until their machine switches.
  ingressController: "traefik"
  # Sender of core-api's and Keycloak's e-mails; its domain must be verified
  # in the Resend dashboard.
  emailFrom: "noreply@mairie360-eip.fr"
  # Scaleway Object Storage bucket of elearning-api's course attachments.
  elearningBucket: "mairie360-elearning-prod"

# MAIR-620: push URLs of this instance's Cockpit data sources, from
#   scripts/tf.sh orgs/mairie360 output -json instances | jq '.prod.cockpit_endpoints'
# in mairie360/Infra. Not secret. TO FILL after the Infra apply: the chart
# refuses to render with empty endpoints, and
# tests/scripts/mair_620_cockpit_endpoints_test.sh refuses anything but a
# Cockpit data source URL.
observability:
  cockpit:
    metricsEndpoint: ""
    tracesEndpoint: ""

backup:
  s3:
    # Versioned, COMPLIANCE-locked 30 days, created by mairie360/Infra (MAIR-618).
    bucket: "mairie360-backups-prod"

keycloak:
  realm:
    smtp:
      from: "noreply@mairie360-eip.fr"
