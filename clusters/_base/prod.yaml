# ============================================================================
# Base of every `prod` instance (MAIR-414), whatever its group: mairie360's
# prod and each client's prod run the same versions and settings.
#
# The instances ApplicationSet (ansible, roles/k8s_argocd) passes, in order:
#   clusters/_base/<env>.yaml                      this file
#   clusters/<org>/instances/<env>/values.yaml     what differs per instance
#   clusters/<org>/instances/<env>/secrets.yaml    the SealedSecrets
# Lists (env, instances.*.env) are replaced, not merged, by a later file:
# anything that differs per instance inside a list is a global value
# referenced through `tpl` here (global.domain, global.emailFrom,
# global.elearningBucket), so instance files never copy a list.
# Every script that renders an instance reads it through
# scripts/instance-values.sh.
# ============================================================================

global:
  imagePullSecret: "ghcr-secret"
  # Ingress controller of this machine: "nginx" or "traefik" (MAIR-260).
  # Must match the Argo CD cluster label mairie360.fr/ingress set by ansible
  # (`ingress_controller`); switch procedure in
  # docs/adr/0001-replace-ingress-nginx.md. The IngressClass, annotations
  # and NetworkPolicy namespace follow from it.
  ingressController: "nginx"
  networkPolicy:
    enabled: true
    # Passer à true une fois les destinations externes connues et déclarées
    # dans egressAllowCIDRs.
    egressDefaultDeny: false

# Secrets come from the instance's SealedSecrets (secrets.yaml, generated by
# scripts/seal-secrets.sh). Never a plaintext value here.
secrets:
  create: false

ingress:
  enabled: true
  clusterIssuer: "letsencrypt-prod"
  # 50 MiB body limit and HTTPS redirect: chart defaults (ingress.maxBodySizeMiB).

database:
  image:
    tag: "1.3.0"
  secret:
    create: false
  persistence:
    size: "20Gi"
    storageClass: "local-path"

redis:
  secret:
    create: false

liquibase:
  image:
    tag: "1.3.0"
  db:
    name: "mairie_db_prod"

# Off-machine encrypted Postgres backups (MAIR-119/MAIR-231,
# charts/backup/README.md). Needs the bucket below to exist and
# <release>-backup-secret sealed (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
# exported when running scripts/seal-secrets.sh) before the first sync after
# this change — until then the CronJob's pod sits in
# CreateContainerConfigError, same as any new Secret (see the root
# CLAUDE.md Gotchas). Schedule and retention are applied by Argo CD on the
# next sync. keycloak.enabled also dumps <release>-keycloak-db into the same
# repository (KEYCLOAK_DB_PASSWORD, no extra secret to seal).
backup:
  enabled: true
  schedule: "0 3 * * *"
  retention:
    keepDaily: 7
    keepWeekly: 4
    keepMonthly: 6
  s3:
    endpoint: "https://s3.fr-par.scw.cloud"
    # bucket: per instance
    region: "fr-par"
  keycloak:
    enabled: true

# Keycloak (MAIR-139): the instance's identity provider, on
# https://auth.<global.domain> (DNS record required, like the fronts). Realm
# and clients: charts/mairie360-stack/charts/keycloak/values.yaml. Its own
# Postgres is covered by the backup CronJob above (backup.keycloak.enabled,
# MAIR-231). Requires <release>-keycloak-secret in secrets.yaml
# (scripts/seal-secrets.sh).
keycloak:
  enabled: true
  # 4 GB machine (3 vCPU, same as dev): cap the heap explicitly, otherwise the
  # JVM sizes it from the 1Gi limit and the node runs out of memory while
  # Keycloak builds its server image at start-up (2026-10-07: staging thrashed
  # its page cache, every probe timed out). The build alone takes several
  # minutes there, hence the longer start-up window (120 x 5s = 10 min).
  extraEnv:
    - name: JAVA_OPTS_KC_HEAP
      value: "-Xms64m -Xmx512m"
  startupProbe:
    periodSeconds: 5
    failureThreshold: 120
  realm:
    # Same Resend relay and verified domain as core-api's EMAIL_FROM above.
    smtp:
      fromDisplayName: "Mairie360"
  db:
    persistence:
      size: "5Gi"
      storageClass: "local-path"

APIs:
  instances:
    core-api:
      enabled: true
      image: { repository: ghcr.io/mairie360/core-api, tag: "1.2.0" }
      env:
        - name: PUBLIC_URL
          value: "https://login.{{ .Values.global.domain }}"
        # Transactional e-mails (password reset) go through Resend's SMTP relay.
        # The Resend API key is the SMTP password: it lives in
        # <release>-app-secrets (scripts/seal-secrets.sh, RESEND_API_KEY).
        # `optional` keeps core-api starting on a cluster whose Secret was
        # sealed before that key existed (scripts/verify.sh reports it).
        # The EMAIL_FROM domain must be verified in the Resend dashboard.
        - name: SMTP_HOST
          value: "smtp.resend.com"
        - name: SMTP_PORT
          value: "587"
        - name: SMTP_USERNAME
          value: "resend"
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: "{{ .Release.Name }}-app-secrets"
              key: SMTP_PASSWORD
              optional: true
        - name: EMAIL_FROM
          value: "Mairie360 <{{ required \"global.emailFrom is required\" .Values.global.emailFrom }}>"
    project-api:
      enabled: true
      image: { repository: ghcr.io/mairie360/project-api, tag: "0.5.1" }
    calendar-api:
      enabled: true
      image: { repository: ghcr.io/mairie360/calendar-api, tag: "0.6.1" }
    message-api:
      enabled: true
      image: { repository: ghcr.io/mairie360/message-api, tag: "0.7.1" }
    elearning-api:
      enabled: true
      image: { repository: ghcr.io/mairie360/elearning-api, tag: "0.6.1" }
      env:
        # Course attachments are stored in Scaleway Object Storage (S3 API)
        # and served through presigned URLs. The access key pair lives in
        # <release>-app-secrets (scripts/seal-secrets.sh, S3_ACCESS_KEY /
        # S3_SECRET_KEY). Not optional: elearning-api panics without it, so a
        # missing key shows up as CreateContainerConfigError instead of a
        # CrashLoop.
        - name: S3_BUCKET
          value: "{{ required \"global.elearningBucket is required\" .Values.global.elearningBucket }}"
        - name: S3_REGION
          value: "fr-par"
        - name: S3_ENDPOINT
          value: "https://s3.fr-par.scw.cloud"
        - name: S3_PRESIGN_TTL_SECS
          value: "900"
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: "{{ .Release.Name }}-app-secrets"
              key: S3_ACCESS_KEY
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: "{{ .Release.Name }}-app-secrets"
              key: S3_SECRET_KEY

BFFs:
  instances:
    user-bff:
      enabled: true
      port: 4000
      image: { repository: ghcr.io/mairie360/bff-user, tag: "0.5.0" }
      env:
        - name: COOKIE_DOMAIN
          value: ".{{ .Values.global.domain }}"
    project-bff:
      enabled: true
      port: 4001
      image: { repository: ghcr.io/mairie360/bff-project, tag: "0.4.0" }
    calendar-bff:
      enabled: true
      port: 4002
      image: { repository: ghcr.io/mairie360/bff-calendar, tag: "0.4.0" }
      env:
        - name: CALENDAR_API_BASE_PATH
          value: "http://{{ .Release.Name }}-calendar-api:3002"
    message-bff:
      enabled: true
      port: 4003
      image: { repository: ghcr.io/mairie360/bff-message, tag: "0.4.0" }
      env:
        - name: MESSAGE_API_BASE_PATH
          value: "http://{{ .Release.Name }}-message-api:3003"
    dashboard-bff:
      enabled: true
      port: 4004
      image: { repository: ghcr.io/mairie360/bff-dashboard, tag: "1.1.0" }
    settings-bff:
      enabled: true
      port: 4005
      image: { repository: ghcr.io/mairie360/bff-settings, tag: "1.1.0" }
    elearning-bff:
      enabled: true
      port: 4006
      image: { repository: ghcr.io/mairie360/bff-elearning, tag: "0.4.0" }

Fronts:
  instances:
    login-front:
      enabled: true
      port: 5000
      image: { repository: ghcr.io/mairie360/login-front, tag: "0.2.0" }
      env:
        - name: COOKIE_DOMAIN
          value: ".{{ .Values.global.domain }}"
    project-front:
      enabled: true
      port: 5001
      image: { repository: ghcr.io/mairie360/projects-front, tag: "1.0.2" }
      env:
        - name: COOKIE_DOMAIN
          value: ".{{ .Values.global.domain }}"
    calendar-front:
      enabled: true
      port: 5002
      image: { repository: ghcr.io/mairie360/calendar-front, tag: "0.3.2" }
      env:
        - name: COOKIE_DOMAIN
          value: ".{{ .Values.global.domain }}"
    message-front:
      enabled: true
      port: 5003
      image: { repository: ghcr.io/mairie360/message-front, tag: "0.3.2" }
      env:
        - name: COOKIE_DOMAIN
          value: ".{{ .Values.global.domain }}"
    dashboard-front:
      enabled: true
      port: 5004
      image: { repository: ghcr.io/mairie360/dashboard-front, tag: "1.4.2" }
    settings-front:
      enabled: true
      port: 5005
      image: { repository: ghcr.io/mairie360/settings-front, tag: "1.5.0" }
    elearning-front:
      enabled: true
      port: 5006
      image: { repository: ghcr.io/mairie360/elearning-front, tag: "0.2.2" }
      env:
        - name: COOKIE_DOMAIN
          value: ".{{ .Values.global.domain }}"
    admin-front:
      enabled: false  # no release published yet; re-enable with its first version
      port: 5007
      image: { repository: ghcr.io/mairie360/administrator-front, tag: "1.0.1" }
      env:
        - name: COOKIE_DOMAIN
          value: ".{{ .Values.global.domain }}"
