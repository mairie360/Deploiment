{{- if .Values.enabled }}
# Governing Service of the StatefulSet: headless, gives the pod a stable DNS
# identity (<pod>.<service>.<ns>.svc).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "keycloak.db.fullname" . }}-hl
  labels:
    {{- include "keycloak.db.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    {{- include "keycloak.db.selectorLabels" . | nindent 4 }}
---
# Client Service: the one Keycloak connects to (<release>-keycloak-db:5432).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "keycloak.db.fullname" . }}
  labels:
    {{- include "keycloak.db.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    {{- include "keycloak.db.selectorLabels" . | nindent 4 }}
{{- end }}
