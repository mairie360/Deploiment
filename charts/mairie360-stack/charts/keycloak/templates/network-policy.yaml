{{- if and .Values.enabled (($.Values.global).networkPolicy).enabled }}
{{- /* Same rule as mairie360.ingressNamespace in the parent chart. */}}
{{- $ingressNamespace := .Values.global.ingressNamespace | default (ternary "traefik" "ingress-nginx" (eq (.Values.global.ingressController | default "nginx") "traefik")) }}
# Keycloak is the second and last thing exposed to the ingress controller
# (auth.<domain>, browser flows and the admin console). Inside the namespace
# only the BFFs (session / token exchange) and the APIs (token validation,
# admin client of MAIR-142) may reach it; fronts and data pods never do.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "keycloak.fullname" . }}-allow-from-ingress-and-apps
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: keycloak
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ingressNamespace }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: bff
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: 8080
---
# Keycloak's database is Keycloak's alone: not the APIs, not the migration
# Job — only Keycloak itself and, since MAIR-231, the backup CronJob (it
# authenticates with its own KEYCLOAK_DB_PASSWORD, never the Mairie360
# database's superuser).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "keycloak.db.fullname" . }}-allow-from-keycloak
  labels:
    {{- include "keycloak.db.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: keycloak-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: keycloak
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: backup
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
