{{- if and .Values.enabled (($.Values.global).networkPolicy).enabled }}
{{- /*
The policy of Keycloak itself (ingress controller + the APIs that are a
Keycloak client) is rendered by the umbrella chart since MAIR-610
(templates/keycloak-network-policy.yaml): only the umbrella knows which APIs
call Keycloak (APIs.keycloakClientInstances, global.compliance).
*/}}
# Keycloak's database is Keycloak's alone: not the APIs, not the migration
# Job — only Keycloak itself and, since MAIR-231, the backup CronJob (it
# authenticates with its own KEYCLOAK_DB_PASSWORD, never the Mairie360
# database's superuser).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "keycloak.db.fullname" . }}-allow-from-keycloak
  labels:
    {{- include "keycloak.db.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: keycloak-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: keycloak
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: backup
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
