{{- /*
Secret <release>-keycloak-secret. Created by the chart ONLY when
secret.create=true (throwaway local cluster / e2e). On every instance it is
a SealedSecret of the same name written by scripts/seal-secrets.sh.
*/ -}}
{{- if and .Values.enabled .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "keycloak.secretName" . }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  KEYCLOAK_ADMIN_PASSWORD: {{ required "keycloak.env.KEYCLOAK_ADMIN_PASSWORD is required when keycloak.secret.create=true" .Values.env.KEYCLOAK_ADMIN_PASSWORD | quote }}
  KEYCLOAK_DB_PASSWORD: {{ required "keycloak.env.KEYCLOAK_DB_PASSWORD is required when keycloak.secret.create=true" .Values.env.KEYCLOAK_DB_PASSWORD | quote }}
  BFF_USER_CLIENT_SECRET: {{ required "keycloak.env.BFF_USER_CLIENT_SECRET is required when keycloak.secret.create=true" .Values.env.BFF_USER_CLIENT_SECRET | quote }}
{{- end }}
