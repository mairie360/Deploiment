{{- if .Values.enabled }}
{{- /*
Realm imported by Keycloak at first start (`start --import-realm` reads
/opt/keycloak/data/import/*.json). Only the realm NAME, roles, clients and
SMTP relay are provisioned here; users come with MAIR-141.

No secret value is rendered: `${BFF_USER_CLIENT_SECRET}`,
`${CORE_API_CLIENT_SECRET}` and `${SMTP_PASSWORD}` are Keycloak placeholders, resolved at import time from
the container's environment (secretKeyRef in deployment.yaml). They are NOT
Helm expressions — Helm leaves `${...}` untouched.

Keycloak skips the import when the realm already exists, so editing this
file after the first sync changes nothing on a running instance: use the
admin console, or delete the realm and let the next restart re-import it.
The core-api client (MAIR-554) is added to an existing realm by
scripts/keycloak-core-api-client.sh, the second-factor flow and OTP policy
(MAIR-572) by scripts/keycloak-2fa.sh.
*/ -}}
{{- $realm := .Values.realm -}}
{{- $loginFront := $realm.clients.loginFront -}}
{{- $bffUser := $realm.clients.bffUser -}}
{{- $coreApi := $realm.clients.coreApi -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "keycloak.realmConfigMapName" . }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  {{ include "keycloak.realmName" . }}-realm.json: |
    {
      "realm": {{ include "keycloak.realmName" . | quote }},
      "displayName": {{ $realm.displayName | quote }},
      "enabled": true,
      "sslRequired": "external",
      "registrationAllowed": false,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "resetPasswordAllowed": true,
      "rememberMe": true,
      "bruteForceProtected": true,
      "internationalizationEnabled": true,
      "supportedLocales": {{ $realm.supportedLocales | toJson }},
      "defaultLocale": {{ $realm.defaultLocale | quote }},
      {{- with $realm.otpPolicy }}
      "otpPolicyType": {{ .type | quote }},
      "otpPolicyAlgorithm": {{ .algorithm | quote }},
      "otpPolicyDigits": {{ .digits | int }},
      "otpPolicyPeriod": {{ .period | int }},
      "otpPolicyLookAheadWindow": {{ .lookAheadWindow | int }},
      "otpPolicyCodeReusable": false,
      {{- end }}
      {{- /*
      MAIR-572: Keycloak 26's built-in browser flow asks for an OTP but keeps
      WebAuthn disabled. This flow is the same minus Kerberos and Organizations
      (unused), with OTP and WebAuthn as alternatives, only for users who
      configured one ("Condition - user configured"). Importing one flow does
      not remove the built-in ones: Keycloak still creates them.
      */}}
      "browserFlow": "mairie360 browser",
      "authenticationFlows": [
        {
          "alias": "mairie360 browser",
          "description": "Password, then the second factor the user configured (MAIR-572)",
          "providerId": "basic-flow", "topLevel": true, "builtIn": false,
          "authenticationExecutions": [
            { "authenticator": "auth-cookie", "requirement": "ALTERNATIVE", "priority": 10, "authenticatorFlow": false },
            { "authenticator": "identity-provider-redirector", "requirement": "ALTERNATIVE", "priority": 25, "authenticatorFlow": false },
            { "flowAlias": "mairie360 browser forms", "requirement": "ALTERNATIVE", "priority": 30, "authenticatorFlow": true }
          ]
        },
        {
          "alias": "mairie360 browser forms",
          "description": "Username and password, then the optional second factor",
          "providerId": "basic-flow", "topLevel": false, "builtIn": false,
          "authenticationExecutions": [
            { "authenticator": "auth-username-password-form", "requirement": "REQUIRED", "priority": 10, "authenticatorFlow": false },
            { "flowAlias": "mairie360 browser second factor", "requirement": "CONDITIONAL", "priority": 20, "authenticatorFlow": true }
          ]
        },
        {
          "alias": "mairie360 browser second factor",
          "description": "Authenticator app or security key, for users who configured one",
          "providerId": "basic-flow", "topLevel": false, "builtIn": false,
          "authenticationExecutions": [
            { "authenticator": "conditional-user-configured", "requirement": "REQUIRED", "priority": 10, "authenticatorFlow": false },
            { "authenticator": "auth-otp-form", "requirement": "ALTERNATIVE", "priority": 20, "authenticatorFlow": false },
            { "authenticator": "webauthn-authenticator", "requirement": "ALTERNATIVE", "priority": 30, "authenticatorFlow": false }
          ]
        }
      ],
      {{- with $realm.smtp }}
      {{- if .from }}
      "smtpServer": {
        "from": {{ .from | quote }},
        "fromDisplayName": {{ .fromDisplayName | quote }},
        "host": {{ .host | quote }},
        "port": {{ .port | quote }},
        "starttls": {{ .starttls | toString | quote }},
        "auth": "true",
        "user": {{ .user | quote }},
        "password": "${SMTP_PASSWORD}"
      },
      {{- end }}
      {{- end }}
      "roles": {
        "realm": [
          {{- range $i, $role := $realm.roles }}
          {{- if $i }},{{ end }}
          { "name": {{ $role.name | quote }}, "description": {{ $role.description | default "" | quote }} }
          {{- end }}
        ]
      },
      "clients": [
        {
          "clientId": {{ $loginFront.clientId | quote }},
          "name": "Login_Web_Service",
          "description": "Mairie 360 login front (public client, authorization code + PKCE)",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": true,
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "rootUrl": {{ include "keycloak.loginUrl" . | quote }},
          "redirectUris": {{ include "keycloak.clientRedirectUris" (dict "root" . "client" $loginFront) }},
          "webOrigins": {{ include "keycloak.clientWebOrigins" (dict "root" . "client" $loginFront) }},
          "attributes": {
            "pkce.code.challenge.method": "S256",
            "post.logout.redirect.uris": "+"
          }
        },
        {
          "clientId": {{ $bffUser.clientId | quote }},
          "name": "BFF_user",
          "description": "Mairie 360 root BFF (confidential client, authorization code + service account)",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "clientAuthenticatorType": "client-secret",
          "secret": "${BFF_USER_CLIENT_SECRET}",
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": true,
          "rootUrl": {{ include "keycloak.loginUrl" . | quote }},
          "redirectUris": {{ include "keycloak.clientRedirectUris" (dict "root" . "client" $bffUser) }},
          "webOrigins": {{ include "keycloak.clientWebOrigins" (dict "root" . "client" $bffUser) }},
          "attributes": {
            "post.logout.redirect.uris": "+"
          }
        },
        {
          "clientId": {{ $coreApi.clientId | quote }},
          "name": "Core_API",
          "description": "Mairie 360 Core API (confidential client: sign-in code exchange + realm administration service account, MAIR-554)",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "clientAuthenticatorType": "client-secret",
          "secret": "${CORE_API_CLIENT_SECRET}",
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": true,
          "rootUrl": {{ include "keycloak.loginUrl" . | quote }},
          "redirectUris": {{ include "keycloak.clientRedirectUris" (dict "root" . "client" $coreApi) }},
          "webOrigins": {{ include "keycloak.clientWebOrigins" (dict "root" . "client" $coreApi) }},
          "attributes": {
            "pkce.code.challenge.method": "S256",
            "post.logout.redirect.uris": "+"
          }
        }
      ],
      "users": [
        {
          "username": {{ printf "service-account-%s" $coreApi.clientId | quote }},
          "enabled": true,
          "serviceAccountClientId": {{ $coreApi.clientId | quote }},
          "clientRoles": {
            "realm-management": {{ $coreApi.serviceAccountRoles | toJson }}
          }
        }
      ]
    }
{{- end }}
