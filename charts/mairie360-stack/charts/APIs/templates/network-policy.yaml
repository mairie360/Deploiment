{{- if (($.Values.global).networkPolicy).enabled }}
# Seuls les BFFs peuvent joindre les APIs, sur leur port conteneur (3000).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "apis.fullname" . }}-allow-from-bffs
  labels:
    {{- include "apis.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: bff
      ports:
        - protocol: TCP
          port: 3000
{{- end }}
