{{- range $apiName, $apiConfig := .Values.instances }}
{{- if $apiConfig.enabled }}
{{- $ctx := dict "root" $ "name" $apiName }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $apiName }}
  labels:
    {{- include "apis.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $apiName }}
    app: {{ $apiName }}
  annotations:
    # Les APIs démarrent après la base (wave 0) et les migrations (wave 1).
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: {{ $apiConfig.replicaCount | default 1 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ $.Values.strategy.maxSurge }}
      maxUnavailable: {{ $.Values.strategy.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "apis.instanceSelectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "apis.instancePodLabels" $ctx | nindent 8 }}
    spec:
      {{- with $.Values.global.imagePullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      containers:
        - name: {{ $apiName }}
          image: "{{ $apiConfig.image.repository }}:{{ required (printf "APIs.instances.%s.image.tag est obligatoire (pas de :latest)" $apiName) $apiConfig.image.tag }}"
          imagePullPolicy: {{ $apiConfig.image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 3000
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            {{- include "apis.commonEnv" $ctx | nindent 12 }}
            {{- with $apiConfig.env }}
            {{- tpl (toYaml .) $ | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml ($apiConfig.resources | default $.Values.resources) | nindent 12 }}
{{- end }}
{{- end }}
