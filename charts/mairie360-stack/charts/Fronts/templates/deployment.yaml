{{- range $frontName, $frontConfig := .Values.instances }}
{{- if $frontConfig.enabled }}
{{- $name := $frontName | lower }}
{{- $port := required (printf "Fronts.instances.%s.port est obligatoire" $frontName) $frontConfig.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    {{- include "fronts.labels" $ | nindent 4 }}
    app: {{ $name }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  replicas: {{ $frontConfig.replicaCount | default 1 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ $.Values.strategy.maxSurge }}
      maxUnavailable: {{ $.Values.strategy.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "fronts.selectorLabels" $ | nindent 6 }}
      app: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "fronts.labels" $ | nindent 8 }}
        app: {{ $name }}
    spec:
      automountServiceAccountToken: {{ $.Values.automountServiceAccountToken }}
      {{- with $.Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.global.imagePullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $frontConfig.image.repository }}:{{ required (printf "Fronts.instances.%s.image.tag est obligatoire (pas de :latest)" $frontName) $frontConfig.image.tag }}"
          imagePullPolicy: {{ $frontConfig.image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ $port }}
          env:
            {{- include "fronts.commonEnv" $ | nindent 12 }}
            - name: PORT
              value: {{ $port | quote }}
            {{- with $frontConfig.env }}
            {{- tpl (toYaml .) $ | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml ($frontConfig.resources | default $.Values.resources) | nindent 12 }}
          {{- with $.Values.writableDirs }}
          volumeMounts:
            {{- range . }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
            {{- end }}
          {{- end }}
      {{- with $.Values.writableDirs }}
      volumes:
        {{- range . }}
        - name: {{ .name }}
          emptyDir:
            {{- with .sizeLimit }}
            sizeLimit: {{ . }}
            {{- end }}
        {{- end }}
      {{- end }}
{{- end }}
{{- end }}
