{{- range $frontName, $frontConfig := .Values.instances }}
{{- if $frontConfig.enabled }}
{{- $name := $frontName | lower }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    {{- include "fronts.labels" $ | nindent 4 }}
    app: {{ $name }}
spec:
  type: ClusterIP
  ports:
    # L'Ingress parle toujours au Service sur 80 ; le Service renvoie vers
    # le port du conteneur.
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    {{- include "fronts.selectorLabels" $ | nindent 4 }}
    app: {{ $name }}
{{- end }}
{{- end }}
