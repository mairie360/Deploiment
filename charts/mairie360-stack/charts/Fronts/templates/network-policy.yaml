{{- if (($.Values.global).networkPolicy).enabled }}
# Les fronts n'acceptent que le trafic du contrôleur d'ingress.
# C'est la SEULE porte d'entrée du namespace depuis l'extérieur.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fronts.fullname" . }}-allow-from-ingress
  labels:
    {{- include "fronts.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.global.ingressNamespace | default "ingress-nginx" }}
{{- end }}
