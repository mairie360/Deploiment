{{- if (($.Values.global).networkPolicy).enabled }}
{{- /* Same rule as mairie360.ingressNamespace in the parent chart. */}}
{{- $ingressNamespace := .Values.global.ingressNamespace | default (ternary "traefik" "ingress-nginx" (eq (.Values.global.ingressController | default "nginx") "traefik")) }}
# The fronts only accept traffic from the ingress controller: the ONLY way
# into the namespace from outside.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fronts.fullname" . }}-allow-from-ingress
  labels:
    {{- include "fronts.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ingressNamespace }}
{{- end }}
