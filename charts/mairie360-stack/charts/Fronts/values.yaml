# Sous-chart Fronts — une Deployment + un Service par entrée de `instances`.
# Chaque front est exposé sur https://<nom sans "-front">.<global.domain>
# par l'Ingress du chart parent (templates/ingress.yaml).

resources:
  requests: { memory: "64Mi", cpu: "50m" }
  limits:   { memory: "256Mi", cpu: "500m" }

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: false
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

strategy:
  maxSurge: 0
  maxUnavailable: 1

commonEnv:
  - name: NODE_ENV
    value: "production"

# Renseigné par environnement :
#   instances:
#     login-front:
#       enabled: true
#       port: 5000
#       image: { repository: ghcr.io/mairie360/login-front, tag: "dev-abc1234" }
#       env:
#         - name: COOKIE_DOMAIN
#           value: ".dev.mairie360-eip.fr"
instances: {}
