{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "backup.secretName" . }}
  labels:
    {{- include "backup.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ required "backup.env.AWS_ACCESS_KEY_ID is required when backup.secret.create=true" .Values.env.AWS_ACCESS_KEY_ID | quote }}
  AWS_SECRET_ACCESS_KEY: {{ required "backup.env.AWS_SECRET_ACCESS_KEY is required when backup.secret.create=true" .Values.env.AWS_SECRET_ACCESS_KEY | quote }}
  RESTIC_PASSWORD: {{ required "backup.env.RESTIC_PASSWORD is required when backup.secret.create=true" .Values.env.RESTIC_PASSWORD | quote }}
{{- end }}
