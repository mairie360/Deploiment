{{- if .Values.restore.enabled }}
# Disaster-recovery Job. No Argo CD hook annotation on purpose: this is
# rendered and applied by hand (see values.yaml `restore` comment / the
# runbook in charts/backup/README.md), never left enabled in a values file
# an Argo CD Application tracks, or it would rerun on every sync.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "backup.fullname" . }}-restore
  labels:
    {{- include "backup.labels" . | nindent 4 }}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "backup.podLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        {{- include "backup.podSecurityContext" . | nindent 8 }}
      {{- with .Values.global.imagePullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      initContainers:
        {{- include "backup.resticInit" . | nindent 8 }}
      {{- if .Values.sealing.enabled }}
        # MAIR-500: restore the sealed dump first (initContainer), then unseal
        # (main container below): users whose key still exists come back,
        # erased ones stay anonymized.
      {{- else }}
      containers:
      {{- end }}
        - name: restore
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "backup.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            {{- include "backup.workMounts" . | nindent 12 }}
            {{- if .Values.sealing.enabled }}
            - { name: work, mountPath: /work }
            {{- end }}
          env:
            {{- include "backup.env" . | nindent 12 }}
            {{- include "backup.workEnv" . | nindent 12 }}
            - name: SNAPSHOT_ID
              value: {{ include "backup.restoreSnapshotId" . | quote }}
            # MAIR-240: must be the name of the database this Job is about to
            # replace; compared with the real one before anything is touched.
            - name: CONFIRM_DATABASE
              value: {{ required "backup.restore.confirmDatabase is required: the name of the database to replace (its POSTGRES_DB)" .Values.restore.confirmDatabase | quote }}
          # MAIR-240, nothing is touched before every check below passed:
          #  1. CONFIRM_DATABASE is the database this pod is connected to;
          #  2. the snapshot exists (an explicit id, never `latest`) and its
          #     archive is readable (`pg_restore --list`);
          #  3. the current state is saved first, as a `pre-restore` snapshot
          #     (a wrong snapshot can then be undone). Not with sealing: that
          #     copy would hold unsealed personal data, which the sealed
          #     backups exist to avoid; the scheduled sealed backup is the net.
          # The restore replaces schema public, then loads the dump, in ONE
          # transaction (MAIR-414: a restore that fails half way rolls back
          # instead of leaving a database with its objects dropped and only
          # part of the dump loaded). `pg_restore --clean` cannot do it, it
          # fails on partitioned tables ("cannot drop inherited constraint
          # access_logs_default_pkey"), so the dump is turned into SQL and fed
          # to psql after a DROP SCHEMA. The COMMIT is only sent when
          # pg_restore finished: a truncated script ends with the transaction
          # still open, which the server rolls back at EOF. Schema public gets
          # back what a new database has (owner pg_database_owner, USAGE for
          # PUBLIC), then the dump brings the grants of the API roles. A
          # restored `public.users` table that is empty aborts the transaction.
          # --no-owner avoids failing on role names that differ between
          # environments.
          command: ["sh", "-c"]
          args:
            - |
              set -euo pipefail
              if [ "$PGDATABASE" != "$CONFIRM_DATABASE" ]; then
                echo "REFUSED: this Job targets '$PGDATABASE' but backup.restore.confirmDatabase is '$CONFIRM_DATABASE'. Nothing was changed." >&2
                exit 1
              fi
              echo "== snapshot $SNAPSHOT_ID of host $PGDATABASE"
              restic snapshots --host "$PGDATABASE" "$SNAPSHOT_ID"
              {{- if .Values.sealing.enabled }}
              restic restore --host "$PGDATABASE" "$SNAPSHOT_ID" --target /work
              pg_restore --list "/work/${PGDATABASE}.dump" >/dev/null
              {{- else }}
              restic dump --host "$PGDATABASE" "$SNAPSHOT_ID" "${PGDATABASE}.dump" | pg_restore --list >/dev/null
              echo "== saving the current state as a pre-restore snapshot"
              pg_dump -Fc "$PGDATABASE" \
                | restic backup --stdin --stdin-filename "${PGDATABASE}.dump" --host "$PGDATABASE" --tag pre-restore
              {{- end }}
              echo "== restoring"
              {
                echo 'BEGIN; DROP SCHEMA public CASCADE; CREATE SCHEMA public AUTHORIZATION pg_database_owner; GRANT USAGE ON SCHEMA public TO PUBLIC;'
                {{- if .Values.sealing.enabled }}
                pg_restore --no-owner -f - "/work/${PGDATABASE}.dump" \
                {{- else }}
                restic dump --host "$PGDATABASE" "$SNAPSHOT_ID" "${PGDATABASE}.dump" | pg_restore --no-owner -f - \
                {{- end }}
                  && echo "DO \$\$ BEGIN IF (SELECT count(*) FROM public.users) = 0 THEN RAISE EXCEPTION 'restored users table is empty'; END IF; END \$\$;" \
                  && echo 'COMMIT;'
              } | psql -q -v ON_ERROR_STOP=1 -d "$PGDATABASE"
              echo "== restore committed"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.sealing.enabled }}
      containers:
        - name: unseal
          image: {{ include "backup.complianceImage" . }}
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- include "backup.containerSecurityContext" . | nindent 12 }}
          env:
            {{- include "backup.env" . | nindent 12 }}
            {{- include "backup.keyManagerEnv" . | nindent 12 }}
          # `env`: the connection comes from the PG* variables, no password on a command line.
          command: ["/app/compliance-backup", "unseal", "env", "/work"]
          volumeMounts:
            - { name: work, mountPath: /work, readOnly: true }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- end }}
      volumes:
        {{- include "backup.workVolumes" . | nindent 8 }}
        {{- if .Values.sealing.enabled }}
        {{- include "backup.sealVolumes" . | nindent 8 }}
        {{- end }}
{{- end }}
