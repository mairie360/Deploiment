{{- if and (include "observability.enabled" .) .Values.usage.enabled (((.Values.global).networkPolicy).enabled) }}
# MAIR-501: the collector scrapes /internal/usage on the APIs and BFFs listed in
# observability.usage.services, on their ports only. The ingress never exposes that path: the APIs
# and BFFs have no Ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "observability.fullname" . }}-usage-scrape
  labels:
    {{- include "observability.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [api, bff]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: telemetry
      ports:
        {{- range .Values.usage.services }}
        - { protocol: TCP, port: {{ .port }} }
        {{- end }}
{{- end }}
