{{- if and (include "observability.enabled" .) .Values.postgresExporter.enabled }}
{{- $pe := .Values.postgresExporter }}
{{- $name := include "observability.pgExporterName" . }}
# Postgres_exporter for the instance's database, scraped by the
# collector (receiver prometheus/database).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "observability.pgExporterLabels" . | nindent 4 }}
  annotations:
    # After the database (wave 0).
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "observability.pgExporterSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "observability.pgExporterLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres-exporter
          image: "{{ $pe.image.repository }}:{{ $pe.image.tag }}"
          imagePullPolicy: {{ $pe.image.pullPolicy }}
          args: ["--web.listen-address=:9187"]
          env:
            - name: DATA_SOURCE_USER
              valueFrom:
                secretKeyRef: { name: {{ include "observability.databaseSecretName" . }}, key: POSTGRES_USER }
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef: { name: {{ include "observability.databaseSecretName" . }}, key: POSTGRES_PASSWORD }
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: {{ include "observability.databaseSecretName" . }}, key: POSTGRES_DB }
            # In-cluster hop to the database Service, as the other clients.
            - name: DATA_SOURCE_URI
              value: {{ printf "%s-database:5432/$(POSTGRES_DB)?sslmode=disable" .Release.Name | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - { name: metrics, containerPort: 9187 }
          livenessProbe:
            httpGet: { path: /, port: metrics }
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /, port: metrics }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml $pe.podResources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "observability.pgExporterLabels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  selector:
    {{- include "observability.pgExporterSelectorLabels" . | nindent 4 }}
  ports:
    - { name: metrics, port: 9187, targetPort: metrics }
{{- if ((.Values.global).networkPolicy).enabled }}
---
# Only the collector reads it (its own way into Postgres is in the database
# chart's NetworkPolicy).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-allow-from-collector
  labels:
    {{- include "observability.pgExporterLabels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector:
    matchLabels:
      {{- include "observability.pgExporterSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "observability.selectorLabels" . | nindent 14 }}
      ports:
        - { protocol: TCP, port: 9187 }
{{- end }}
{{- end }}
