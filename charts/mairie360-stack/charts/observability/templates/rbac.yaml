{{- if include "observability.enabled" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "observability.fullname" . }}
  labels:
    {{- include "observability.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
{{- if .Values.kubeletStats.enabled }}
---
# kubeletstats reads the kubelet's /stats/summary. `nodes/stats` is a
# cluster-scoped resource, hence a ClusterRole; alone it grants read access to
# resource usage only (see utilizationMetrics below for the pod specs). Named after the namespace
# so two releases on one cluster would not collide.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-%s" .Release.Namespace (include "observability.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "observability.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: [""]
    resources: ["nodes/stats"]
    verbs: ["get"]
  {{- if .Values.kubeletStats.utilizationMetrics }}
  # The request/limit utilization metrics need the pod specs (kubelet /pods).
  - apiGroups: [""]
    resources: ["nodes/pods"]
    verbs: ["get"]
  {{- if .Values.kubeletStats.grantNodesProxy }}
  # Before Kubernetes 1.33 (KubeletFineGrainedAuthz) the kubelet only checks
  # nodes/proxy for /pods. nodes/proxy is the whole kubelet API, exec into any
  # pod of the node included: drop it (grantNodesProxy: false) once the
  # machines run k3s >= 1.33.
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]
  {{- end }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-%s" .Release.Namespace (include "observability.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "observability.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-%s" .Release.Namespace (include "observability.fullname" .) | trunc 63 | trimSuffix "-" }}
subjects:
  - kind: ServiceAccount
    name: {{ include "observability.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
