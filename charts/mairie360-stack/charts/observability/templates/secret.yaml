{{- if and (include "observability.enabled" .) .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "observability.secretName" . }}
  labels:
    {{- include "observability.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  COCKPIT_TOKEN: {{ required "observability.token is required when observability.secret.create=true" .Values.token | quote }}
{{- end }}
