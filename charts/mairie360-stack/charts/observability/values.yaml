# observability subchart (MAIR-131, POC) — one OpenTelemetry Collector per
# instance, relaying to Scaleway Cockpit:
#
#   core-api ──OTLP/HTTP :4318──► otel-collector ──OTLP/HTTP + X-TOKEN──► Cockpit
#   kubelet :10250 (pod CPU/RAM) ─┘   (traces data source, metrics data source)
#
# Rendered only when `global.observability.enabled` is true: that same flag
# makes the APIs chart inject the OTEL_* env vars into the APIs listed in
# `global.observability.apis`, so the collector and its clients are switched
# on together.

# "k8s" distribution of the collector: otlp receiver, kubeletstats receiver,
# otlphttp exporter, filter/resource/memory_limiter/batch processors and the
# health_check extension, nothing more.
image:
  repository: otel/opentelemetry-collector-k8s
  tag: "0.162.0"
  pullPolicy: IfNotPresent

# Scaleway Cockpit push endpoints, one per data source (Cockpit console >
# Data sources > <source> > URL, then append the path below). Data sources
# and the token must be in the same region. Not secret; the token is.
cockpit:
  # https://<metrics-datasource-id>.metrics.cockpit.fr-par.scw.cloud/otlp/v1/metrics
  metricsEndpoint: ""
  # https://<traces-datasource-id>.traces.cockpit.fr-par.scw.cloud/otlp/v1/traces
  tracesEndpoint: ""
  # https://<logs-datasource-id>.logs.cockpit.fr-par.scw.cloud/otlp/v1/logs
  # Optional: "" = no logs pipeline (the token then needs "push logs" too).
  logsEndpoint: ""

# Secret <release>-cockpit-secret, key COCKPIT_TOKEN: a Cockpit token with the
# "push metrics" and "push traces" scopes. Same model as backup-secret:
# create: true  -> built from `token` below (throwaway local cluster only)
# create: false -> provided by a SealedSecret (scripts/seal-secrets.sh,
#                  COCKPIT_TOKEN env var)
secretName: ""
secret:
  create: false
token: ""

# Resource attributes copied onto every data point of the metrics pipeline:
# Cockpit drops resource attributes, so without them all pods share one series.
metricResourceLabels:
  - k8s.namespace.name
  - k8s.pod.name
  - k8s.container.name
  - deployment.environment.name
  - service.name

# Node and pod CPU/RAM/disk, read from the kubelet's /stats/summary of the
# node the collector runs on. One Deployment is enough because every instance
# is a single-node k3s cluster; a multi-node instance would need a DaemonSet.
kubeletStats:
  enabled: true
  collectionInterval: "30s"
  # `node` gives the machine itself (k8s.node.cpu.*, k8s.node.memory.*,
  # k8s.node.filesystem.* = the disk holding the PVCs and images) without
  # mounting the host's /proc and / into the pod (hostmetrics receiver).
  metricGroups: [node, pod, container]
  # k3s serves the kubelet API with a self-signed certificate that does not
  # cover the node IP.
  insecureSkipVerify: true
  # Usage as a share of each container's and pod's requests and limits
  # (k8s.{container,pod}.{cpu,memory}_{request,limit}_utilization), to size
  # them on real numbers. Needs the pod specs: RBAC nodes/pods.
  utilizationMetrics: true
  # k3s < 1.33 authorizes the kubelet's /pods on nodes/proxy only: the whole
  # kubelet API (exec into any pod of the node). Accepted on 2026-11-20 for
  # these metrics; set false once the machines run k3s >= 1.33.
  grantNodesProxy: true

resources:
  requests: { memory: "64Mi", cpu: "20m" }
  limits: { memory: "256Mi", cpu: "200m" }

# memory_limiter refuses data above this share of the container limit
# instead of letting the collector get OOM-killed.
memoryLimiter:
  limitPercentage: 80
  spikeLimitPercentage: 20

# MAIR-498: personal data the logs must never carry, replaced by the
# `transform/mask-personal-data` processor in the logs pipeline (body and
# attributes) and on the span attributes of the traces pipeline, before
# anything leaves the instance. The list is a COPY of mairie360/Compliance_API
# `masking-patterns.yaml` (also served by its GET /api/v1/masking-patterns):
# change both together. RE2 syntax, written raw here: the chart escapes them
# for OTTL and the collector's `$` expansion. IP addresses are kept on purpose
# (security logs).
logMasking:
  enabled: true
  patterns:
    - name: email
      regex: '(?i)[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}'
      replacement: '<email>'
    - name: phone_fr
      regex: '(?:\+33\s?|0)[1-9](?:[\s.-]?\d{2}){4}'
      replacement: '<phone>'
    - name: jwt
      regex: 'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+'
      replacement: '<jwt>'
    - name: bearer
      regex: '(?i)bearer\s+[A-Za-z0-9._~+/=-]{16,}'
      replacement: 'Bearer <token>'
    - name: password_hash
      regex: '\$argon2(?:id|i|d)\$[^\s"''}]+'
      replacement: '<hash>'

# Span attributes the collector lets through (MAIR-501): actions only, never who did them nor what
# they sent (no user id, e-mail, name, query string, body, client address, user agent). Every
# other attribute of a span is dropped before the export. Same list as
# mairie360_api_lib::usage::ALLOWED_SPAN_ATTRIBUTES and bffs-lib's TELEMETRY_ATTRIBUTES.
spanAttributesAllowlist:
  - http.request.method
  - http.method
  - http.route
  - http.response.status_code
  - http.status_code
  - url.template
  - url.scheme
  - server.address
  - server.port
  - network.protocol.version
  - error.type
  - express.name
  - express.type
  - otel.name
  - otel.kind
  - otel.status_code

# Usage ledger of the mairie (MAIR-501). The APIs and BFFs count their usage per operation and
# period without any identifier (distinct users from a hash salted per period, never exported)
# and serve the closed periods on /internal/usage; the collector scrapes them and drops any count
# under `threshold` again before the export. Off by default.
usage:
  enabled: false
  path: /internal/usage
  scrapeInterval: "5m"
  # Services whose /internal/usage is scraped: <release>-<name>:<port>.
  services: []
  #  - { name: core-api, port: 3000 }
  #  - { name: user-bff, port: 4000 }
  # Minimum count exported (k): a smaller count could point at an agent of a small mairie.
  threshold: 5
  # The ledger always goes to the instance's own Cockpit metrics; `export` also sends it to
  # Mairie 360 (statistics per mairie and per service). The endpoint's host must be declared in
  # compliance/<org>/subprocessors.yaml (scripts/check-compliance.py fails otherwise).
  export:
    enabled: false
    # Full OTLP/HTTP metrics URL of Mairie 360's statistics collector.
    endpoint: ""
    # Label of this mairie in Mairie 360's statistics (no personal data: an organisation).
    mairie: ""

# kube-state-metrics: state of the instance's own workloads, read
# from the API server and scraped by the collector. Restarts, why a container
# last stopped (OOMKilled...), why it waits (CrashLoopBackOff...), the last
# success of each CronJob, failed Jobs and missing replicas. Namespaced: it
# only watches the instance's namespace (Role, not ClusterRole), and only
# exposes the series listed in `metricAllowlist`, so Cockpit ingests a few
# series per pod instead of hundreds.
kubeStateMetrics:
  enabled: true
  image:
    repository: registry.k8s.io/kube-state-metrics/kube-state-metrics
    tag: "v2.20.0"
    pullPolicy: IfNotPresent
  scrapeInterval: "60s"
  # Kubernetes resources watched (kube-state-metrics --resources). Each needs
  # a matching rule in templates/kube-state-metrics.yaml's Role.
  resources: [pods, deployments, statefulsets, jobs, cronjobs]
  metricAllowlist:
    - kube_pod_status_phase
    - kube_pod_container_status_restarts_total
    - kube_pod_container_status_last_terminated_reason
    - kube_pod_container_status_waiting_reason
    # The current reason: a Job container that ends OOMKilled with
    # restartPolicy Never has no last terminated state yet.
    - kube_pod_container_status_terminated_reason
    - kube_pod_container_status_ready
    # Init containers have their own families: without them an init
    # container in CrashLoopBackOff shows nothing but a Pending pod.
    - kube_pod_init_container_status_restarts_total
    - kube_pod_init_container_status_waiting_reason
    - kube_pod_init_container_status_last_terminated_reason
    - kube_pod_init_container_status_terminated_reason
    - kube_deployment_status_replicas_unavailable
    - kube_statefulset_status_replicas_ready
    - kube_statefulset_replicas
    - kube_job_status_failed
    - kube_job_status_succeeded
    - kube_cronjob_status_last_successful_time
    - kube_cronjob_status_last_schedule_time
    - kube_cronjob_spec_suspend
  podResources:
    requests: { memory: "32Mi", cpu: "10m" }
    limits: { memory: "128Mi", cpu: "100m" }
