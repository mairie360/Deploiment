apiVersion: batch/v1
kind: Job
metadata:
  # Nom STABLE. L'ancien suffixe horodaté rendait l'application ArgoCD
  # perpétuellement OutOfSync et relançait les migrations en boucle.
  name: {{ include "liquibase.fullname" . }}
  labels:
    {{- include "liquibase.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: {{ .Values.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "liquibase.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.imagePullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      initContainers:
        - name: wait-for-db
          image: "{{ .Values.waitImage.repository }}:{{ .Values.waitImage.tag }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: DB_HOST
              value: {{ printf "%s-database" .Release.Name | quote }}
            - name: DB_PORT
              value: {{ .Values.db.port | quote }}
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ include "liquibase.dbSecretName" . }}
                  key: POSTGRES_USER
          command:
            - sh
            - -c
            - |
              until pg_isready -h "$DB_HOST" -p "$DB_PORT" -U "$PGUSER"; do
                echo "Waiting for DB..."; sleep 2
              done
      containers:
        - name: liquibase
          image: "{{ .Values.image.repository }}:{{ required "liquibase.image.tag est obligatoire (pas de :latest)" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          workingDir: /migrations
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          env:
            # No usage report to liquibase.com from inside the cluster.
            - name: LIQUIBASE_ANALYTICS_ENABLED
              value: "false"
            - name: LIQUIBASE_COMMAND_URL
              value: {{ printf "jdbc:postgresql://%s-database:%s/%s" .Release.Name (toString .Values.db.port) .Values.db.name | quote }}
            - name: LIQUIBASE_COMMAND_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "liquibase.dbSecretName" . }}
                  key: POSTGRES_USER
            - name: LIQUIBASE_COMMAND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "liquibase.dbSecretName" . }}
                  key: POSTGRES_PASSWORD
            - name: LIQUIBASE_SEARCH_PATH
              value: "/migrations"
            {{- $g := .Values.global | default dict }}
            {{- range $role := ($g.database | default dict).roles | default list }}
            - name: {{ include "liquibase.rolePasswordKey" $role }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "liquibase.dbSecretName" $ }}
                  key: {{ include "liquibase.rolePasswordKey" $role }}
            {{- end }}
            # MAIR-170: the admin account (users.id = 1) e-mail/password.
            # MAIR-414: required unless adminAccount.required is false (e2e,
            # local): without them the changelog seeds the template admin
            # account, whose credentials are public.
            {{- $optional := not .Values.adminAccount.required }}
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ include "liquibase.dbSecretName" . }}
                  key: ADMIN_EMAIL
                  {{- if $optional }}
                  optional: true
                  {{- end }}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "liquibase.dbSecretName" . }}
                  key: ADMIN_PASSWORD
                  {{- if $optional }}
                  optional: true
                  {{- end }}
          # Per-role passwords are passed as Liquibase changelog parameters
          # (-D<role>_password) so the changelog can CREATE ROLE ... PASSWORD
          # :role_password without the values ever appearing in the chart.
          # Needs a shell because changelog params interpolate env vars;
          # the image's entrypoint only forwards args to the liquibase binary.
          # The -D parameters must come AFTER the command: Liquibase 5 rejects
          # them before it ("Unexpected argument(s)").
          command: ["sh", "-c"]
          args:
            - |
              {{- if .Values.adminAccount.required }}
              # MAIR-414: a key present but empty passes the secretKeyRef, and
              # a plaintext password breaks chk_users_password_hashed halfway
              # through the migration: refuse both before touching the schema.
              [ -n "$ADMIN_EMAIL" ] || { echo "ADMIN_EMAIL is empty in the database secret: re-run scripts/seal-secrets.sh with ADMIN_EMAIL" >&2; exit 1; }
              case "$ADMIN_PASSWORD" in
                '$argon2id$'*) ;;
                *) echo "ADMIN_PASSWORD is not an argon2id hash: re-run scripts/seal-secrets.sh (MAIR-414)" >&2; exit 1 ;;
              esac
              {{- end }}
              exec liquibase --changelog-file={{ .Values.changelogFile }} update
                {{- range $role := ($g.database | default dict).roles | default list }} \
                -D{{ include "liquibase.roleName" $role }}_password="${{ include "liquibase.rolePasswordKey" $role }}"
                {{- end }} \
                -Dadmin_email="$ADMIN_EMAIL" \
                -Dadmin_password="$ADMIN_PASSWORD"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
