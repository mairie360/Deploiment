{{- if .Values.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "retention.fullname" . }}
  labels:
    {{- include "retention.labels" . | nindent 4 }}
  annotations:
    # Ordinary resource, not an Argo CD Sync hook: it must persist across
    # syncs (a CronJob, not a one-shot Job) and only needs the database
    # (wave 0) to exist before its first scheduled run fires.
    argocd.argoproj.io/sync-wave: "1"
spec:
  schedule: {{ required "retention.schedule is required when retention.enabled=true" .Values.schedule | quote }}
  concurrencyPolicy: {{ .Values.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.backoffLimit }}
      activeDeadlineSeconds: {{ .Values.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "retention.podLabels" . | nindent 12 }}
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          # MAIR-414: psql as the image's postgres user (uid 70), nothing written.
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          {{- with .Values.global.imagePullSecret }}
          imagePullSecrets:
            - name: {{ . }}
          {{- end }}
          containers:
            - name: retention
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              env:
                {{- include "retention.env" . | nindent 16 }}
              # The periods of `policies` are written first (MAIR-294), in one
              # transaction that fails on an unknown table. Then
              # fn_apply_retention_policies() creates the next access_logs
              # partitions and applies every retention_policies row
              # (Devops/Database, MAIR-236). SECURITY DEFINER + REVOKE ALL
              # FROM PUBLIC: only the superuser this Job authenticates as
              # can call it.
              command: ["sh", "-c"]
              args:
                - |
                  set -euo pipefail
                  psql -v ON_ERROR_STOP=1 <<'SQL'
                  DO $policies$
                  BEGIN
                  {{- range $table, $period := .Values.policies }}
                  {{- if not (regexMatch "^[a-z_][a-z0-9_]*$" $table) }}{{ fail (printf "retention.policies: %q is not a table name" $table) }}{{ end }}
                  {{- if not (regexMatch "^[0-9]+ (day|days|month|months|year|years)$" $period) }}{{ fail (printf "retention.policies.%s: %q must be \"<n> day(s)|month(s)|year(s)\"" $table $period) }}{{ end }}
                    UPDATE retention_policies SET retention_period = INTERVAL '{{ $period }}' WHERE table_name = '{{ $table }}';
                    IF NOT FOUND THEN RAISE EXCEPTION 'retention_policies has no row for {{ $table }}'; END IF;
                  {{- end }}
                  END
                  $policies$;
                  SELECT * FROM fn_apply_retention_policies();
                  SQL
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
{{- end }}
