# retention subchart (MAIR-236) — daily CronJob running
# `SELECT * FROM fn_apply_retention_policies()`: applies the Devops/Database
# `retention_policies` (DELETE on `sessions`, PARTITION_DROP on
# `access_logs`) and creates the next few months of `access_logs` partitions
# (`fn_ensure_access_logs_partitions`, called first). Both functions are
# `SECURITY DEFINER` with `REVOKE ALL ... FROM PUBLIC`, so only the database
# owner can call them — this Job authenticates as the same Postgres
# superuser as Liquibase and the `backup` CronJob
# (`<release>-database-secret`).
#
# On by default: unlike `backup`, nothing external needs provisioning first —
# it only reuses the existing database Secret.
enabled: true

image:
  repository: postgres
  # Exact minor (MAIR-414), bumped by Renovate.
  tag: "18.6-alpine"
  pullPolicy: IfNotPresent

# Daily, after the backup CronJob's default 03:00 run: a dump always has
# yesterday's rows before retention can prune them.
schedule: "30 3 * * *"
concurrencyPolicy: Forbid
successfulJobsHistoryLimit: 3
failedJobsHistoryLimit: 3
backoffLimit: 2
activeDeadlineSeconds: 600

db:
  port: 5432

resources:
  requests: { memory: "64Mi", cpu: "50m" }
  limits: { memory: "256Mi", cpu: "250m" }
