{{- range $bffName, $bffConfig := .Values.instances }}
{{- if $bffConfig.enabled }}
{{- $ctx := dict "root" $ "name" $bffName }}
{{- $port := $bffConfig.port | default 4000 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $bffName }}
  labels:
    {{- include "bffs.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $bffName }}
    app: {{ $bffName }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: {{ $bffConfig.replicaCount | default 1 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ $.Values.strategy.maxSurge }}
      maxUnavailable: {{ $.Values.strategy.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "bffs.instanceSelectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bffs.instancePodLabels" $ctx | nindent 8 }}
    spec:
      automountServiceAccountToken: {{ $.Values.automountServiceAccountToken }}
      {{- with $.Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.global.imagePullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      containers:
        - name: {{ $bffName }}
          image: "{{ $bffConfig.image.repository }}:{{ required (printf "BFFs.instances.%s.image.tag est obligatoire (pas de :latest)" $bffName) $bffConfig.image.tag }}"
          imagePullPolicy: {{ $bffConfig.image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ $port }}
          env:
            {{- include "bffs.commonEnv" $ctx | nindent 12 }}
            - name: PORT
              value: {{ $port | quote }}
            {{- with $bffConfig.env }}
            {{- tpl (toYaml .) $ | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml ($bffConfig.resources | default $.Values.resources) | nindent 12 }}
          {{- with $.Values.writableDirs }}
          volumeMounts:
            {{- range . }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
            {{- end }}
          {{- end }}
      {{- with $.Values.writableDirs }}
      volumes:
        {{- range . }}
        - name: {{ .name }}
          emptyDir:
            {{- with .sizeLimit }}
            sizeLimit: {{ . }}
            {{- end }}
        {{- end }}
      {{- end }}
{{- end }}
{{- end }}
