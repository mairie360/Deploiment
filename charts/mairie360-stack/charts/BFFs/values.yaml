# Sous-chart BFFs — une Deployment + un Service par entrée de `instances`.

resources:
  requests: { memory: "128Mi", cpu: "20m" }
  limits:   { memory: "512Mi", cpu: "500m" }

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: false
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

strategy:
  maxSurge: 0
  maxUnavailable: 1

# Variables communes à tous les BFFs (en plus de DB_*, REDIS_*, JWT_SECRET,
# et des *_API_URL / *_BFF_URL générées depuis global.apis / global.bffs).
commonEnv:
  - name: NODE_ENV
    value: "production"
  - name: NODE_OPTIONS
    value: "--max-old-space-size=200"

# Renseigné par environnement :
#   instances:
#     user-bff:
#       enabled: true
#       port: 4000
#       image: { repository: ghcr.io/mairie360/bff-user, tag: "dev-abc1234" }
#       env:
#         - name: COOKIE_DOMAIN
#           value: ".dev.mairie360-eip.fr"
instances: {}
