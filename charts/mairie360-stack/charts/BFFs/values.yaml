# BFFs subchart: one Deployment + one Service per entry of `instances`.

resources:
  requests: { memory: "128Mi", cpu: "20m" }
  limits:   { memory: "512Mi", cpu: "500m" }

# Container hardening (MAIR-229). Every pod runs as a fixed non-root uid/gid:
# 1000:1000 is the `node` user of node:*-alpine (`USER node` in every BFF
# Dockerfile).
# A numeric runAsUser is what lets `runAsNonRoot: true` pass the kubelet check
# even on an image whose Dockerfile declares no numeric USER.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  # The BFFs write nothing to disk except tsx's transpile cache under /tmp
  # (BFF_Calendar starts with tsx), hence the /tmp emptyDir below.
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

# No workload calls the Kubernetes API: do not mount the namespace's
# default ServiceAccount token into the pods.
automountServiceAccountToken: false

# Writable emptyDir volumes mounted over the read-only root filesystem.
writableDirs:
  - name: tmp
    mountPath: /tmp
    sizeLimit: 64Mi

# The new pod is ready before the old one stops: with one replica, maxSurge 0
# stopped the only pod first and every rollout dropped requests. Costs one more
# BFF pod (memory limit) during the rollout.
strategy:
  maxSurge: 1
  maxUnavailable: 0

# Graceful shutdown: the pod first waits `preStopSleepSeconds` (Traefik and
# the Service endpoints stop routing to it), then gets SIGTERM; the BFF
# (bffs-lib `gracefulShutdown`, under tini) drains its requests, ends its SSE
# streams and exits within 10 s, well inside the grace period.
preStopSleepSeconds: 5
terminationGracePeriodSeconds: 30

# BFFs that get JWT_SECRET. MAIR-414 limited it to BFF_user, the only one
# signing tokens; since MAIR-474 every BFF verifies the session itself
# (bffs-lib `requireSession`) and refuses to start without it (MAIR-520), so
# every instance of global.bffs must be listed here.
jwtSecretInstances:
  - user-bff
  - project-bff
  - calendar-bff
  - message-bff
  - elearning-bff
  - dashboard-bff
  - settings-bff

# Variables shared by every BFF (on top of TRUST_PROXY and the *_API_URL /
# *_BFF_URL generated from global.apis / global.bffs).
commonEnv:
  - name: NODE_ENV
    value: "production"
  - name: NODE_OPTIONS
    value: "--max-old-space-size=200"

# Set per environment:
#   instances:
#     user-bff:
#       enabled: true
#       port: 4000
#       image: { repository: ghcr.io/mairie360/bff-user, tag: "dev-abc1234" }
#       env:
#         - name: COOKIE_DOMAIN
#           value: ".dev.mairie360-eip.fr"
instances: {}
