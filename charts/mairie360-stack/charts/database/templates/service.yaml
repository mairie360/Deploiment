{{- if .Values.statefulset.enabled }}
# Governing Service of the StatefulSet: headless, gives its pod a stable DNS
# name (<pod>.<service>.<ns>.svc). Also the source of a CloudNativePG import.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "database.fullname" . }}-hl
  labels:
    {{- include "database.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    {{- include "database.selectorLabels" . | nindent 4 }}
---
{{- end }}
# Client Service: the one the APIs, Liquibase, backup and retention use
# (<release>-database:5432). `engine` picks the Postgres behind it: the
# StatefulSet's pod, or the primary of the current CloudNativePG Cluster.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "database.fullname" . }}
  labels:
    {{- include "database.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      # By number: the CloudNativePG container names its port "postgresql".
      targetPort: 5432
  selector:
    {{- if eq .Values.engine "cnpg" }}
    cnpg.io/cluster: {{ include "database.cnpgCurrentCluster" . }}
    cnpg.io/instanceRole: primary
    {{- else }}
    {{- include "database.selectorLabels" . | nindent 4 }}
    {{- end }}
