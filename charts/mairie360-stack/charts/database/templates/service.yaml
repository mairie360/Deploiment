# Service "gouvernant" du StatefulSet : headless, obligatoire pour l'identité
# DNS stable des pods (<pod>.<service>.<ns>.svc).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "database.fullname" . }}-hl
  labels:
    {{- include "database.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    {{- include "database.selectorLabels" . | nindent 4 }}
---
# Service client : c'est celui-ci que les APIs et Liquibase utilisent
# (<release>-database:5432).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "database.fullname" . }}
  labels:
    {{- include "database.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    {{- include "database.selectorLabels" . | nindent 4 }}
