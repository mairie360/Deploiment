{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "database.secretName" . }}
  labels:
    {{- include "database.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.env.POSTGRES_USER | quote }}
  POSTGRES_PASSWORD: {{ required "database.env.POSTGRES_PASSWORD est obligatoire quand database.secret.create=true" .Values.env.POSTGRES_PASSWORD | quote }}
  POSTGRES_DB: {{ .Values.env.POSTGRES_DB | quote }}
{{- end }}
