{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "database.secretName" . }}
  labels:
    {{- include "database.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.env.POSTGRES_USER | quote }}
  POSTGRES_PASSWORD: {{ required "database.env.POSTGRES_PASSWORD est obligatoire quand database.secret.create=true" .Values.env.POSTGRES_PASSWORD | quote }}
  POSTGRES_DB: {{ .Values.env.POSTGRES_DB | quote }}
  {{- $g := .Values.global | default dict }}
  {{- range $role := ($g.database | default dict).roles | default list }}
  {{ include "database.rolePasswordKey" $role }}: {{ required (printf "database.rolePasswords.%s is required when database.secret.create=true" $role) (index $.Values.rolePasswords $role) | quote }}
  {{- end }}
  # MAIR-170: optional, unlike the keys above — an empty value here leaves
  # the admin account (users.id = 1) on its changelog template values.
  ADMIN_EMAIL: {{ .Values.env.ADMIN_EMAIL | default "" | quote }}
  ADMIN_PASSWORD: {{ .Values.env.ADMIN_PASSWORD | default "" | quote }}
{{- end }}
