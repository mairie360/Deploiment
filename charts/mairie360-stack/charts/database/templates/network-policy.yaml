{{- if (($.Values.global).networkPolicy).enabled }}
# MAIR-114: Postgres is only reachable from APIs (each with its own role),
# the Liquibase migration Job, the backup CronJob (MAIR-119) and the
# retention CronJob (MAIR-236) — the latter three authenticate as the
# postgres superuser via <release>-database-secret. BFFs and fronts never
# talk to Postgres directly — they go through an API, which is also the
# only place Postgres RBAC has to hold.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "database.fullname" . }}-allow-from-apps
  labels:
    {{- include "database.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: database
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: api
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: migration
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: backup
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: retention
      ports:
        - protocol: TCP
          port: 5432
{{- if .Values.cnpg.enabled }}
---
# CloudNativePG: the operator drives each Postgres pod through its instance
# manager (8000); the pods of a Cluster and its bootstrap Jobs (import from
# the StatefulSet, replicas) reach Postgres on 5432.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "database.fullname" . }}-allow-cnpg
  labels:
    {{- include "database.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: database
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.cnpg.operatorNamespace }}
      ports:
        - protocol: TCP
          port: 8000
    - from:
        - podSelector:
            matchExpressions:
              - key: cnpg.io/cluster
                operator: Exists
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
{{- end }}
