{{- if (($.Values.global).networkPolicy).enabled }}
# MAIR-114: Postgres is only reachable from APIs (each with its own role) and
# the Liquibase migration Job (the postgres superuser). BFFs and fronts never
# talk to Postgres directly — they go through an API, which is also the only
# place Postgres RBAC has to hold.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "database.fullname" . }}-allow-from-apps
  labels:
    {{- include "database.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: database
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: api
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: migration
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
