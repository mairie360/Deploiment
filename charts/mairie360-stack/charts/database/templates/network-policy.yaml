{{- if (($.Values.global).networkPolicy).enabled }}
# MAIR-114: Postgres is only reachable from APIs (each with its own role),
# the Liquibase migration Job, the backup CronJob (MAIR-119), the
# retention CronJob (MAIR-236) and, with observability on, postgres_exporter — the latter three authenticate as the
# postgres superuser via <release>-database-secret. BFFs and fronts never
# talk to Postgres directly — they go through an API, which is also the
# only place Postgres RBAC has to hold.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "database.fullname" . }}-allow-from-apps
  labels:
    {{- include "database.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: database
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: api
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: migration
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: backup
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: retention
        {{- if (($.Values.global).observability).enabled }}
        # MAIR-626: postgres_exporter of charts/observability (read-only
        # statistics; rendered with the collector).
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres-exporter
              app.kubernetes.io/component: metrics-exporter
        {{- end }}
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
