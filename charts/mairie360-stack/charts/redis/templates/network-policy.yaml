{{- if (($.Values.global).networkPolicy).enabled }}
# Redis is only reachable by the APIs, each with its own ACL account (see
# templates/configmap.yaml). Fronts and BFFs have no ACL account (MAIR-414)
# and no network path to Redis either.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "redis.fullname" . }}-allow-from-apps
  labels:
    {{- include "redis.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: cache
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: 6379
{{- end }}
