{{- if (($.Values.global).networkPolicy).enabled }}
# Redis n'est joignable que par les APIs et les BFFs : chacun se connecte
# avec son propre compte ACL (voir templates/configmap.yaml). Les fronts
# n'ont pas de compte ACL et ne sont donc plus autorisés à joindre Redis.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "redis.fullname" . }}-allow-from-apps
  labels:
    {{- include "redis.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: cache
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: api
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: bff
      ports:
        - protocol: TCP
          port: 6379
{{- end }}
