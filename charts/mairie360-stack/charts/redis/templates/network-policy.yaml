{{- if (($.Values.global).networkPolicy).enabled }}
# Redis is only reachable by the APIs and the BFFs, each with its own ACL
# account (see templates/configmap.yaml; BFFs since MAIR-531, for MAIR-499).
# Fronts have no ACL account and no network path to Redis either.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "redis.fullname" . }}-allow-from-apps
  labels:
    {{- include "redis.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: cache
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: api
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: bff
      ports:
        - protocol: TCP
          port: 6379
{{- end }}
