# `helm test <release>` : vérifie que Redis exige une authentification (le
# compte `default` est désactivé) ET que le compte `admin` répond.
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "redis.fullname" . }}-test-connection"
  labels:
    app.kubernetes.io/component: api   # autorisé par la NetworkPolicy
  annotations:
    "helm.sh/hook": test
    # Not hook-succeeded: `helm test --logs` reads the pod logs AFTER the hook
    # completes, and fails with "pods not found" if the pod is already gone.
    # The pod is replaced at the next `helm test` instead.
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  containers:
    - name: redis-test
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
      env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "redis.fullname" . }}
              key: redis-password
        - name: HOST
          value: {{ include "redis.fullname" . | quote }}
      command:
        - sh
        - -c
        - |
          set -e
          # 1. Sans identifiants : doit être refusé (compte default désactivé)
          if redis-cli -h "$HOST" ping 2>&1 | grep -q PONG; then
            echo "ECHEC : Redis repond sans authentification"; exit 1
          fi
          # 2. Avec le compte admin : doit repondre PONG
          redis-cli -h "$HOST" --user admin -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG
          echo "OK : Redis authentifie correctement"
