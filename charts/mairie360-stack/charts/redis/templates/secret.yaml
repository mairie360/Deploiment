{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "redis.fullname" . }}
  labels:
    {{- include "redis.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  redis-password: {{ required "redis.password est obligatoire quand redis.secret.create=true" .Values.password | quote }}
  {{- range $role := (include "redis.roles" . | fromYamlArray) }}
  {{ include "redis.rolePasswordKey" $role }}: {{ required (printf "redis.rolePasswords.%s est obligatoire quand redis.secret.create=true" $role) (index $.Values.rolePasswords $role) | quote }}
  {{- end }}
{{- end }}
