# redis subchart: a single instance.
#
# WARNING: replicaCount > 1 does NOT give a replicated Redis but N independent
# Redis behind one Service. Keep it at 1.

enabled: true
replicaCount: 1

image:
  repository: redis
  tag: "7.4-alpine"
  pullPolicy: IfNotPresent

# Secret <release>-redis.
#   redis-password  -> compte "admin" (ACL, utilisé par les probes et `helm test`)
#   <role>-password -> un compte ACL par rôle (API/BFF), rôles = clés de
#                       global.apis.instances / global.bffs.instances
# create: true  -> créé depuis `password` / `rolePasswords` (cluster local UNIQUEMENT)
# create: false -> fourni par un SealedSecret
secret:
  create: false
password: ""
rolePasswords: {}

# ACL commands granted to every role, limited to what API_lib's cache-aside
# actually uses. The `default` account is disabled (see
# templates/configmap.yaml: entrypoint.sh).
aclCommands: ["get", "set", "del", "exists", "expire"]

# Shared JWT revocation list (MAIR-264). Core API writes one key per revoked
# session, `revoked:<sid>` (SET + EXPIRE, TTL = remaining JWT lifetime), and
# every API checks it (EXISTS) through API_lib before accepting a token.
# The key is used exactly as written: API_lib does not prefix it with the role.
#   - writerRoles: read + write on keyPattern (next to their own <role>:*);
#   - every other API role (global.apis.instances): read-only, Redis 7 key
#     permission `%R~<keyPattern>`;
#   - BFF roles: no access.
revokedTokens:
  keyPattern: "revoked:*"
  writerRoles: ["core-api"]

# Persistence of /data. false = emptyDir: data survives a container restart
# (with config.appendonly) but not a new pod (config change, node reboot).
# true = a PVC, which also keeps the revocation list across new pods.
persistence:
  enabled: false
  size: 1Gi
  storageClass: ""

config:
  maxmemory: "256mb"
  # noeviction (MAIR-264): Redis now holds the JWT revocation list, and an
  # evicted `revoked:<sid>` key means a revoked token is accepted again by
  # every API but Core. Every other policy can drop it before its TTL:
  #   - allkeys-lru/lfu/random evict any key, revoked ones included;
  #   - volatile-* only evict keys WITH a TTL, and today the revocation keys
  #     are the only keys with one (Core's cache `sessions:<id>` and its
  #     forgot-password / first-connection tokens have none), so they
  #     would be the very first to go.
  # With noeviction a full Redis refuses writes (OOM error) instead: Core's
  # writes fail loudly, the cache-aside degrades to Postgres, nothing is
  # silently forgotten. Keys are tiny (~100 bytes), so 256mb is far from
  # full; watch `used_memory` rather than trade correctness for it.
  maxmemoryPolicy: "noeviction"
  # AOF in /data (emptyDir, or the PVC when persistence.enabled): the
  # revocation list survives a Redis container restart (crash, OOM kill).
  appendonly: true

resources:
  requests: { memory: "64Mi", cpu: "50m" }
  limits:   { memory: "320Mi", cpu: "500m" }
