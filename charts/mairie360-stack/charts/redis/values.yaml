# Sous-chart redis — instance unique.
#
# ATTENTION : replicaCount > 1 ne donne PAS un Redis répliqué mais N Redis
# indépendants derrière un même Service. Laisser à 1.

enabled: true
replicaCount: 1

image:
  repository: redis
  tag: "7.4-alpine"
  pullPolicy: IfNotPresent

# Secret <release>-redis.
#   redis-password  -> compte "admin" (ACL, utilisé par les probes et `helm test`)
#   <role>-password -> un compte ACL par rôle (API/BFF), rôles = clés de
#                       global.apis.instances / global.bffs.instances
# create: true  -> créé depuis `password` / `rolePasswords` (cluster local UNIQUEMENT)
# create: false -> fourni par un SealedSecret
secret:
  create: false
password: ""
rolePasswords: {}

# Commandes ACL accordées à chaque rôle, restreintes à ce qui est
# effectivement utilisé par le cache-aside de API_lib. Le compte `default`
# est désactivé (voir templates/configmap.yaml : entrypoint.sh).
aclCommands: ["get", "set", "del", "exists", "expire"]

# Persistance. false = emptyDir : les données sont perdues à chaque
# redémarrage du pod. Suffisant pour un cache, pas pour des sessions.
persistence:
  enabled: false
  size: 1Gi
  storageClass: ""

config:
  maxmemory: "256mb"
  maxmemoryPolicy: "allkeys-lru"

resources:
  requests: { memory: "64Mi", cpu: "50m" }
  limits:   { memory: "320Mi", cpu: "500m" }
