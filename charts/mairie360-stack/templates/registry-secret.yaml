{{- /*
Secret de registre GHCR. Rendu uniquement si image.pullSecretData est fourni
(cluster local). En environnement réel : SealedSecret du même nom.
*/ -}}
{{- if .Values.image.pullSecretData }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.image.pullSecret }}
  labels:
    {{- include "mairie360.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ .Values.image.pullSecretData }}
{{- end }}
