{{- /*
Dedicated Ingress of Keycloak (MAIR-139): https://auth.<domain>, the only
thing exposed besides the fronts. Its own TLS Secret and certificate — one
more HTTP-01 challenge per instance, on top of the fronts' 8.
Only `keycloak.ingress.paths` are routed (MAIR-414): the realms (login
pages, OIDC endpoints, account console) and their static resources. The
admin console (/admin) is not exposed: it is reached through
`kubectl port-forward`, see charts/keycloak/values.yaml `adminUrl`.
Class, ClusterIssuer and annotations are the fronts' (`ingress.*`), plus
`keycloak.ingress.annotations` (proxy buffer size, see values.yaml), all
through the controller-agnostic helpers of templates/_helpers.tpl (MAIR-260).
*/ -}}
{{- if and .Values.ingress.enabled .Values.keycloak.enabled }}
{{- $host := include "mairie360.keycloakHost" . -}}
{{- $fullname := include "mairie360.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-keycloak
  labels:
    {{- include "mairie360.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    {{- /* The fronts' annotations for the instance's controller, then Keycloak's own on top. */}}
    {{- $annotations := merge (dict) (.Values.keycloak.ingress | default dict).annotations (include "mairie360.ingressAnnotations" . | fromYaml) }}
    {{- toYaml $annotations | nindent 4 }}
spec:
  ingressClassName: {{ include "mairie360.ingressClassName" . | quote }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ printf "%s-keycloak-tls" $fullname }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          {{- range (required "keycloak.ingress.paths must list what auth.<domain> exposes" .Values.keycloak.ingress.paths) }}
          - path: {{ . | quote }}
            pathType: Prefix
            backend:
              service:
                name: {{ printf "%s-keycloak" $.Release.Name }}
                port:
                  number: 8080
          {{- end }}
{{- end }}
