{{- /*
Base network policy of the namespace.

NetworkPolicies ADD UP: there is no "deny" that wins over an "allow". So a
default-deny is set on every pod, then each (sub)chart opens ONLY the flow
it needs:

  ingress-controller ─► fronts ─► bffs ─► apis ─► postgres / redis
                                   └──────────────► redis
                        (liquibase migration ──────► postgres)
  ingress-controller ─► keycloak ─► keycloak-db      (MAIR-139)
  core-api [+ compliance-api] ─► keycloak            (MAIR-610, templates/keycloak-network-policy.yaml)
         core-api ─► compliance-api                 (MAIR-498, global.compliance.enabled)

Any permissive policy (podSelector: {} + namespaceSelector: {}) would cancel
everything: never add one.
*/ -}}
{{- if .Values.global.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mairie360.fullname" . }}-default-deny
  labels:
    {{- include "mairie360.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    {{- if .Values.global.networkPolicy.egressDefaultDeny }}
    - Egress
    {{- end }}
{{- if .Values.global.networkPolicy.egressDefaultDeny }}
---
# Avec un default-deny en sortie, le DNS est la première chose qui casse.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mairie360.fullname" . }}-allow-egress
  labels:
    {{- include "mairie360.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # DNS du cluster
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # Tout le namespace applicatif (les flux entrants sont déjà filtrés)
    - to:
        - podSelector: {}
    {{- with .Values.global.networkPolicy.egressAllowCIDRs }}
    # Destinations externes déclarées (SMTP, S3…)
    - to:
        {{- range . }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
    {{- end }}
{{- end }}
{{- if .Values.global.monitoringNamespace }}
---
# Prometheus doit pouvoir scraper les pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mairie360.fullname" . }}-allow-monitoring
  labels:
    {{- include "mairie360.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.global.monitoringNamespace }}
{{- end }}
{{- end }}
