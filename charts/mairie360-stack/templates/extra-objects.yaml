{{- /*
Raw objects rendered as-is. Used to embed an environment's SealedSecrets
(secrets.yaml next to values.yaml, generated by scripts/seal-secrets.sh).
Strings go through `tpl`, so {{ .Release.Namespace }} etc. are usable.
A string item is emitted verbatim: `toYaml` on a string would quote it into
a scalar document, which Helm rejects ("cannot unmarshal string into
SimpleHead").
*/ -}}
{{- range .Values.extraObjects }}
---
{{- if kindIs "string" . }}
{{ tpl . $ }}
{{- else }}
{{ tpl (toYaml .) $ }}
{{- end }}
{{- end }}
