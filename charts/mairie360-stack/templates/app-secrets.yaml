{{- /*
Secret applicatif partagé par les APIs et les BFFs.
Créé par le chart UNIQUEMENT si secrets.create=true (cluster local).
Partout ailleurs il est fourni par un SealedSecret sous le même nom.
*/ -}}
{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mairie360.appSecretName" . }}
  labels:
    {{- include "mairie360.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  JWT_SECRET: {{ required "secrets.jwtSecret est obligatoire quand secrets.create=true" .Values.secrets.jwtSecret | quote }}
{{- end }}
