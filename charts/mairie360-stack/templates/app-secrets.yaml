{{- /*
Secret applicatif partagé par les APIs et les BFFs.
Créé par le chart UNIQUEMENT si secrets.create=true (cluster local).
Partout ailleurs il est fourni par un SealedSecret sous le même nom.
*/ -}}
{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mairie360.appSecretName" . }}
  labels:
    {{- include "mairie360.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  JWT_SECRET: {{ required "secrets.jwtSecret est obligatoire quand secrets.create=true" .Values.secrets.jwtSecret | quote }}
  # Object Storage (S3) credentials used by elearning-api for course
  # attachments. Required: the API panics at startup without them.
  S3_ACCESS_KEY: {{ required "secrets.s3AccessKey est obligatoire quand secrets.create=true" .Values.secrets.s3AccessKey | quote }}
  S3_SECRET_KEY: {{ required "secrets.s3SecretKey est obligatoire quand secrets.create=true" .Values.secrets.s3SecretKey | quote }}
{{- end }}
