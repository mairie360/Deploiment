{{- /*
With no front enabled, an Ingress with neither rules nor defaultBackend is
rejected by the API server ("either `defaultBackend` or `rules` must be
specified"), so it is simply not rendered.
*/ -}}
{{- $enabledFronts := dict -}}
{{- range $frontName, $frontConfig := .Values.Fronts.instances -}}
{{- if $frontConfig.enabled -}}
{{- $_ := set $enabledFronts $frontName $frontConfig -}}
{{- end -}}
{{- end -}}
{{- if and .Values.ingress.enabled $enabledFronts }}
{{- $domain := required "global.domain is required by the fronts Ingress" .Values.global.domain -}}
{{- $fullname := include "mairie360.fullname" . -}}
{{- $release := .Release.Name -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-fronts
  labels:
    {{- include "mairie360.labels" . | nindent 4 }}
  annotations:
    # The fronts are exposed last: everything else must be ready first.
    argocd.argoproj.io/sync-wave: "5"
    # cert-manager.io/cluster-issuer is what makes cert-manager issue the
    # certificate of the tls: block below; the rest translates ingress.*
    # into the controller's annotations (templates/_helpers.tpl).
    {{- include "mairie360.ingressAnnotations" . | nindent 4 }}
spec:
  ingressClassName: {{ include "mairie360.ingressClassName" . | quote }}
  tls:
    - hosts:
        {{- range $frontName, $frontConfig := $enabledFronts }}
        - {{ printf "%s.%s" ($frontName | lower | replace "-front" "") $domain | quote }}
        {{- end }}
      secretName: {{ .Values.ingress.tlsSecretName | default (printf "%s-fronts-tls" $fullname) }}
  rules:
    {{- range $frontName, $frontConfig := $enabledFronts }}
    - host: {{ printf "%s.%s" ($frontName | lower | replace "-front" "") $domain | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ printf "%s-%s" $release ($frontName | lower) }}
                port:
                  number: 80
    {{- end }}
{{- end }}
