{{- if .Values.ingress.enabled }}
{{- $domain := required "global.domain est obligatoire pour l'Ingress des fronts" .Values.global.domain -}}
{{- $fullname := include "mairie360.fullname" . -}}
{{- $release := .Release.Name -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-fronts
  labels:
    {{- include "mairie360.labels" . | nindent 4 }}
  annotations:
    # Les fronts sont exposés en dernier : tout le reste doit être prêt avant.
    argocd.argoproj.io/sync-wave: "5"
    {{- if .Values.ingress.clusterIssuer }}
    # C'est cette annotation qui déclenche l'émission du certificat par
    # cert-manager. Sans elle, le bloc tls: ci-dessous ne crée rien.
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer | quote }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | default "nginx" | quote }}
  tls:
    - hosts:
        {{- range $frontName, $frontConfig := .Values.Fronts.instances }}
        {{- if $frontConfig.enabled }}
        - {{ printf "%s.%s" ($frontName | lower | replace "-front" "") $domain | quote }}
        {{- end }}
        {{- end }}
      secretName: {{ .Values.ingress.tlsSecretName | default (printf "%s-fronts-tls" $fullname) }}
  rules:
    {{- range $frontName, $frontConfig := .Values.Fronts.instances }}
    {{- if $frontConfig.enabled }}
    - host: {{ printf "%s.%s" ($frontName | lower | replace "-front" "") $domain | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ printf "%s-%s" $release ($frontName | lower) }}
                port:
                  number: 80
    {{- end }}
    {{- end }}
{{- end }}
