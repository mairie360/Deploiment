# MAIR-625: kube-state-metrics gives the collector restarts, OOMKilled /
# CrashLoopBackOff reasons and the last success of each CronJob, limited to the
# instance's namespace.
suite: kube-state-metrics (MAIR-625)
values:
  - ../../../clusters/mairie360/instances/staging/values.yaml
set:
  global.observability.enabled: true
  observability.cockpit.metricsEndpoint: https://11111111-1111-1111-1111-111111111111.metrics.cockpit.fr-par.scw.cloud/otlp/v1/metrics
  observability.cockpit.tracesEndpoint: https://11111111-1111-1111-1111-111111111111.traces.cockpit.fr-par.scw.cloud/otlp/v1/traces
release:
  name: staging
  namespace: mairie360-staging
tests:
  - it: only watches the instance's namespace, with a namespaced read-only Role
    templates: [charts/observability/templates/kube-state-metrics.yaml]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --namespaces=mairie360-staging
        documentSelector: { path: kind, value: Deployment }
      # ServiceAccount, Role, RoleBinding, Deployment, Service, NetworkPolicy: no ClusterRole
      - hasDocuments: { count: 6 }
      - equal:
          path: rules
          value:
            - { apiGroups: [""], resources: [pods], verbs: [list, watch] }
            - { apiGroups: [apps], resources: [deployments, statefulsets], verbs: [list, watch] }
            - { apiGroups: [batch], resources: [jobs, cronjobs], verbs: [list, watch] }
        documentSelector: { path: kind, value: Role }

  - it: exposes the series the alerts need, and only an allowlist
    templates: [charts/observability/templates/kube-state-metrics.yaml]
    documentSelector: { path: kind, value: Deployment }
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[2]
          pattern: '^--metric-allowlist=.*kube_pod_container_status_restarts_total'
      - matchRegex:
          path: spec.template.spec.containers[0].args[2]
          pattern: 'kube_pod_container_status_last_terminated_reason,kube_pod_container_status_waiting_reason'
      - matchRegex:
          path: spec.template.spec.containers[0].args[2]
          pattern: 'kube_cronjob_status_last_successful_time'
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true

  - it: only the collector may scrape it
    templates: [charts/observability/templates/kube-state-metrics.yaml]
    documentSelector: { path: kind, value: NetworkPolicy }
    asserts:
      - equal:
          path: spec.ingress
          value:
            - from:
                - podSelector:
                    matchLabels:
                      app.kubernetes.io/name: otel-collector
                      app.kubernetes.io/instance: staging
              ports:
                - { protocol: TCP, port: 8080 }

  - it: is not selected by the policies of the collector (other component label)
    templates: [charts/observability/templates/kube-state-metrics.yaml]
    documentSelector: { path: kind, value: Deployment }
    asserts:
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: metrics-exporter

  - it: the collector scrapes it into the metrics pipeline
    templates: [charts/observability/templates/configmap.yaml]
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'prometheus/cluster:\n(.*\n)*\s+- targets: \["staging-kube-state-metrics:8080"\]'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'receivers: \[otlp, kubeletstats, prometheus/cluster\]'

  - it: renders nothing when turned off
    set:
      observability.kubeStateMetrics.enabled: false
    templates:
      - charts/observability/templates/kube-state-metrics.yaml
      - charts/observability/templates/configmap.yaml
    asserts:
      - hasDocuments: { count: 0 }
        template: charts/observability/templates/kube-state-metrics.yaml
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: prometheus/cluster
        template: charts/observability/templates/configmap.yaml

  - it: refuses a watched resource the Role does not cover
    set:
      observability.kubeStateMetrics.resources: [pods, secrets]
    templates: [charts/observability/templates/kube-state-metrics.yaml]
    asserts:
      - failedTemplate:
          errorPattern: 'no Role rule for "secrets"'
