# MAIR-119: encrypted off-machine PostgreSQL backups (pg_dump + restic to S3).
suite: backup (MAIR-119)
values:
  - ../../../clusters/mairie360/instances/staging/values.yaml
tests:
  - it: "renders nothing when backup.enabled=false (default: no bucket/secret provisioned yet)"
    set:
      # staging/values.yaml now enables backup (MAIR-231); this test is about
      # the umbrella chart's own default, so override it back off.
      backup: { enabled: false }
    templates:
      - charts/backup/templates/cronjob.yaml
      - charts/backup/templates/restore-job.yaml
      - charts/backup/templates/secret.yaml
    asserts:
      - hasDocuments: { count: 0 }

  - it: renders a Forbid-concurrency CronJob labelled component=backup once enabled
    set:
      backup:
        enabled: true
        schedule: "30 2 * * *"
        s3: { endpoint: "https://s3.example.com", bucket: "mairie360-staging", region: "fr-par" }
    templates: [charts/backup/templates/cronjob.yaml]
    asserts:
      - equal:
          path: spec.schedule
          value: "30 2 * * *"
      - equal:
          path: spec.concurrencyPolicy
          value: Forbid
      - equal:
          path: spec.jobTemplate.spec.template.metadata.labels["app.kubernetes.io/component"]
          value: backup
      - notExists:
          path: metadata.annotations["argocd.argoproj.io/hook"]

  - it: the backup pod authenticates to Postgres as the superuser, not a per-API role
    set:
      backup:
        enabled: true
        s3: { endpoint: "https://s3.example.com", bucket: "mairie360-staging", region: "fr-par" }
    templates: [charts/backup/templates/cronjob.yaml]
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: PGUSER
            valueFrom:
              secretKeyRef: { name: RELEASE-NAME-database-secret, key: POSTGRES_USER }

  - it: no S3/restic credential is ever inlined, only secretKeyRef
    set:
      backup:
        enabled: true
        s3: { endpoint: "https://s3.example.com", bucket: "mairie360-staging", region: "fr-par" }
    templates: [charts/backup/templates/cronjob.yaml]
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef: { name: RELEASE-NAME-backup-secret, key: AWS_ACCESS_KEY_ID }
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: RESTIC_PASSWORD
            valueFrom:
              secretKeyRef: { name: RELEASE-NAME-backup-secret, key: RESTIC_PASSWORD }
      - notContains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: RESTIC_REPOSITORY
            value: "s3:/"

  - it: retention flags forwarded to restic forget
    set:
      backup:
        enabled: true
        s3: { endpoint: "https://s3.example.com", bucket: "mairie360-staging", region: "fr-par" }
        retention: { keepDaily: 14, keepWeekly: 8, keepMonthly: 12 }
    templates: [charts/backup/templates/cronjob.yaml]
    asserts:
      - matchRegex:
          path: spec.jobTemplate.spec.template.spec.containers[0].args[0]
          pattern: '--keep-daily 14'
      - matchRegex:
          path: spec.jobTemplate.spec.template.spec.containers[0].args[0]
          pattern: '--keep-weekly 8'
      - matchRegex:
          path: spec.jobTemplate.spec.template.spec.containers[0].args[0]
          pattern: '--keep-monthly 12'

  - it: the restore Job is off by default and carries no Argo CD hook
    set:
      backup:
        enabled: true
        s3: { endpoint: "https://s3.example.com", bucket: "mairie360-staging", region: "fr-par" }
    templates: [charts/backup/templates/restore-job.yaml]
    asserts:
      - hasDocuments: { count: 0 }

  - it: the restore Job requires an explicit snapshot id
    set:
      backup:
        enabled: true
        s3: { endpoint: "https://s3.example.com", bucket: "mairie360-staging", region: "fr-par" }
        restore: { enabled: true, snapshotId: "" }
    templates: [charts/backup/templates/restore-job.yaml]
    asserts:
      - failedTemplate:
          errorPattern: "backup.restore.snapshotId is required"

  - it: the restore Job runs pg_restore --clean against the chosen snapshot
    set:
      backup:
        enabled: true
        s3: { endpoint: "https://s3.example.com", bucket: "mairie360-staging", region: "fr-par" }
        restore: { enabled: true, snapshotId: "abcd1234" }
    templates: [charts/backup/templates/restore-job.yaml]
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-backup-restore
      - notExists:
          path: metadata.annotations["argocd.argoproj.io/hook"]
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'restic dump --host "\$PGDATABASE" "\$SNAPSHOT_ID"'
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'pg_restore --clean --if-exists --no-owner'

  - it: "MAIR-231: no Keycloak dump wired in when backup.keycloak.enabled is left off"
    set:
      backup:
        enabled: true
        s3: { endpoint: "https://s3.example.com", bucket: "mairie360-staging", region: "fr-par" }
        keycloak: { enabled: false }
    templates: [charts/backup/templates/cronjob.yaml]
    asserts:
      - notContains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: BACKUP_KEYCLOAK
            value: "true"
      - notMatchRegex:
          path: spec.jobTemplate.spec.template.spec.containers[0].args[0]
          pattern: 'KEYCLOAK_PGDATABASE'

  - it: "MAIR-231: dumps Keycloak's own PostgreSQL as a second snapshot lineage when enabled"
    set:
      backup:
        enabled: true
        s3: { endpoint: "https://s3.example.com", bucket: "mairie360-staging", region: "fr-par" }
        keycloak: { enabled: true }
    templates: [charts/backup/templates/cronjob.yaml]
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: KEYCLOAK_PGHOST
            value: RELEASE-NAME-keycloak-db
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: KEYCLOAK_PGPASSWORD
            valueFrom:
              secretKeyRef: { name: RELEASE-NAME-keycloak-secret, key: KEYCLOAK_DB_PASSWORD }
      - matchRegex:
          path: spec.jobTemplate.spec.template.spec.containers[0].args[0]
          pattern: 'pg_dump -Fc "\$KEYCLOAK_PGDATABASE"'
      - matchRegex:
          path: spec.jobTemplate.spec.template.spec.containers[0].args[0]
          pattern: '--host "keycloak-\$\{KEYCLOAK_PGDATABASE\}"'
      - matchRegex:
          path: spec.jobTemplate.spec.template.spec.containers[0].args[0]
          pattern: 'restic forget --host "keycloak-\$\{KEYCLOAK_PGDATABASE\}"'

  # The database/keycloak-db NetworkPolicies' admission of the backup
  # component is covered by tests/network_policy_test.yaml, alongside the
  # rest of the ingress/fronts/bffs/apis/data chain it asserts on.

  - it: "MAIR-414: the backup runs as uid 70 on a read-only root filesystem, restic from its pinned image"
    templates: [charts/backup/templates/cronjob.yaml]
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.securityContext.runAsUser
          value: 70
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].image
          value: restic/restic:0.18.1
      - notMatchRegex:
          path: spec.jobTemplate.spec.template.spec.containers[0].args[0]
          pattern: 'apk add'
      - notMatchRegex:
          path: spec.jobTemplate.spec.template.spec.containers[0].image
          pattern: ':\d+-alpine$'

  - it: "MAIR-414: the restore is all-or-nothing"
    set:
      backup:
        restore: { enabled: true, snapshotId: "abcd1234" }
    templates: [charts/backup/templates/restore-job.yaml]
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'pg_restore .*--single-transaction --exit-on-error'
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 70
