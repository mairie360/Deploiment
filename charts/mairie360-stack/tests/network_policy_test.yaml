# Vérifie que le cloisonnement réseau est bien celui attendu :
#   ingress -> fronts -> bffs -> apis -> data
suite: network policies
values:
  - ../../../clusters/mairie360/instances/dev/values.yaml
tests:
  - it: pose un default-deny sur tous les pods
    templates: [templates/network-policy.yaml]
    asserts:
      - hasDocuments: { count: 1 }
      - equal:
          path: spec.podSelector
          value: {}
      - contains:
          path: spec.policyTypes
          content: Ingress

  - it: n'a AUCUNE policy permissive (podSelector vide + from tous namespaces)
    templates: [templates/network-policy.yaml]
    asserts:
      - notContains:
          path: spec.ingress
          content:
            from:
              - podSelector: {}
              - namespaceSelector: {}

  - it: les APIs n'acceptent que les BFFs sur 3000
    templates: [charts/APIs/templates/network-policy.yaml]
    asserts:
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/component"]
          value: api
      - equal:
          path: spec.ingress[0].from[0].podSelector.matchLabels["app.kubernetes.io/component"]
          value: bff
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 3000

  - it: les fronts n'acceptent que le namespace du contrôleur d'ingress
    templates: [charts/Fronts/templates/network-policy.yaml]
    asserts:
      - equal:
          path: spec.ingress[0].from[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: ingress-nginx

  - it: la base n'accepte que api, migration et backup, jamais bff ni frontend (MAIR-114/MAIR-119)
    templates: [charts/database/templates/network-policy.yaml]
    asserts:
      - lengthEqual:
          path: spec.ingress[0].from
          count: 3
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 5432
      - contains:
          path: spec.ingress[0].from
          content:
            podSelector:
              matchLabels:
                app.kubernetes.io/component: api
      - contains:
          path: spec.ingress[0].from
          content:
            podSelector:
              matchLabels:
                app.kubernetes.io/component: migration
      - contains:
          path: spec.ingress[0].from
          content:
            podSelector:
              matchLabels:
                app.kubernetes.io/component: backup
      - notContains:
          path: spec.ingress[0].from
          content:
            podSelector:
              matchLabels:
                app.kubernetes.io/component: bff
      - notContains:
          path: spec.ingress[0].from
          content:
            podSelector:
              matchLabels:
                app.kubernetes.io/component: frontend

  - it: les sélecteurs des policies correspondent aux labels réellement posés sur les pods
    templates:
      - charts/APIs/templates/deployment.yaml
      - charts/BFFs/templates/deployment.yaml
      - charts/Fronts/templates/deployment.yaml
      - charts/database/templates/statefulset.yaml
      - charts/redis/templates/deployment.yaml
    asserts:
      - exists:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]


  # --- Cilium L7 visibility (templates/cilium-l7-visibility.yaml) -------------

  - it: renders the Cilium L7 policies on the two HTTP hops when ciliumL7Visibility is on
    templates: [templates/cilium-l7-visibility.yaml]
    set:
      global.networkPolicy.ciliumL7Visibility: true
    asserts:
      - hasDocuments: { count: 2 }
      - isKind: { of: CiliumNetworkPolicy }
      - isAPIVersion: { of: cilium.io/v2 }
      - exists:
          path: spec.ingress[0].toPorts[0].rules.http

  - it: BFFs L7 policy only comes from fronts and bffs, on every BFF port
    templates: [templates/cilium-l7-visibility.yaml]
    set:
      global.networkPolicy.ciliumL7Visibility: true
    documentIndex: 0
    asserts:
      - equal:
          path: spec.endpointSelector.matchLabels["app.kubernetes.io/component"]
          value: bff
      - lengthEqual:
          path: spec.ingress[0].fromEndpoints
          count: 2
      - contains:
          path: spec.ingress[0].toPorts[0].ports
          content: { port: "4000", protocol: TCP }
      - lengthEqual:
          path: spec.ingress[0].toPorts[0].ports
          count: 7

  - it: APIs L7 policy only comes from bffs, on 3000
    templates: [templates/cilium-l7-visibility.yaml]
    set:
      global.networkPolicy.ciliumL7Visibility: true
    documentIndex: 1
    asserts:
      - equal:
          path: spec.endpointSelector.matchLabels["app.kubernetes.io/component"]
          value: api
      - lengthEqual:
          path: spec.ingress[0].fromEndpoints
          count: 1
      - equal:
          path: spec.ingress[0].fromEndpoints[0].matchLabels["app.kubernetes.io/component"]
          value: bff
      - equal:
          path: spec.ingress[0].toPorts[0].ports[0].port
          value: "3000"

  - it: renders no Cilium policy by default (a cluster without the CRDs must still sync)
    templates: [templates/cilium-l7-visibility.yaml]
    set:
      global.networkPolicy.ciliumL7Visibility: false
    asserts:
      - hasDocuments: { count: 0 }

  - it: lets the ingress controller reach cert-manager's HTTP-01 solver pods, and nothing else
    templates: [templates/acme-solver-network-policy.yaml]
    asserts:
      - hasDocuments: { count: 1 }
      - equal:
          path: spec.podSelector.matchLabels["acme.cert-manager.io/http01-solver"]
          value: "true"
      - equal:
          path: spec.ingress[0].from[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: ingress-nginx
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 8089
      - lengthEqual: { path: spec.ingress, count: 1 }

  - it: renders no ACME solver policy without an Ingress
    templates: [templates/acme-solver-network-policy.yaml]
    set: { ingress.enabled: false }
    asserts:
      - hasDocuments: { count: 0 }
