suite: redis
values:
  - ../../../clusters/mairie360/instances/dev/values.yaml
tests:
  - it: démarre via l'entrypoint ACL et sa configuration montée
    templates: [charts/redis/templates/deployment.yaml]
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["sh", "/etc/redis/entrypoint.sh"]
      - contains:
          path: spec.template.spec.volumes
          content:
            name: config
            configMap: { name: RELEASE-NAME-redis }
      - contains:
          path: spec.template.spec.volumes
          content:
            name: acl
            emptyDir: {}

  - it: le compte default est désactivé dans le script ACL
    templates: [charts/redis/templates/configmap.yaml]
    asserts:
      - matchRegex:
          path: data["entrypoint.sh"]
          pattern: "user default off"

  - it: injects one dedicated ACL password per API (required) and per BFF (optional, MAIR-531)
    templates: [charts/redis/templates/deployment.yaml]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CORE_API_REDIS_PASSWORD
            valueFrom:
              secretKeyRef: { name: RELEASE-NAME-redis, key: core-api-password }
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: USER_BFF_REDIS_PASSWORD
            valueFrom:
              secretKeyRef: { name: RELEASE-NAME-redis, key: user-bff-password, optional: true }
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ELEARNING_BFF_REDIS_PASSWORD
            valueFrom:
              secretKeyRef: { name: RELEASE-NAME-redis, key: elearning-bff-password, optional: true }

  - it: "MAIR-531: a BFF account is on only with a password, off (never passwordless) otherwise"
    templates: [charts/redis/templates/configmap.yaml]
    asserts:
      - matchRegex:
          path: data["entrypoint.sh"]
          pattern: 'if \[ -n "\$\{USER_BFF_REDIS_PASSWORD:-\}" \]; then\s+echo "user user-bff on >\$USER_BFF_REDIS_PASSWORD ~user-bff:\* resetchannels -@all [^"]*"\s+else\s+echo "user user-bff off resetpass '
      - notMatchRegex:
          path: data["entrypoint.sh"]
          pattern: 'nopass'
      - notMatchRegex:
          path: data["entrypoint.sh"]
          pattern: 'if \[ -n "\$\{[A-Z_]+_API_REDIS_PASSWORD'

  - it: les probes s'authentifient avec le compte admin, pas le compte default
    templates: [charts/redis/templates/deployment.yaml]
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[2]
          pattern: "--user admin"
      - matchRegex:
          path: spec.template.spec.containers[0].livenessProbe.exec.command[2]
          pattern: "--user admin"

  - it: chaque API reçoit son propre identifiant ACL Redis, pas le mot de passe partagé
    templates: [charts/APIs/templates/deployment.yaml]
    documentIndex: 0 # premier document = "calendar-api" (ordre alphabétique du range)
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_USERNAME
            value: "calendar-api"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef: { name: RELEASE-NAME-redis, key: calendar-api-password }

  - it: "MAIR-414: the BFFs get no database credentials"
    templates: [charts/BFFs/templates/deployment.yaml]
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].env[*].name
          pattern: '^DB_'

  - it: "MAIR-531: each BFF gets its own Redis account, optional password, URL built like the APIs"
    templates: [charts/BFFs/templates/deployment.yaml]
    documentIndex: 0 # first document = "calendar-bff" (alphabetical range)
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: REDIS_USERNAME, value: "calendar-bff" }
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef: { name: RELEASE-NAME-redis, key: calendar-bff-password, optional: true }
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_URL
            value: "redis://$(REDIS_USERNAME):$(REDIS_PASSWORD)@RELEASE-NAME-redis:6379"

  - it: les fronts n'ont plus d'identifiants Redis
    templates: [charts/Fronts/templates/deployment.yaml]
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_HOST
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_PASSWORD

  - it: "the redis NetworkPolicy only admits the APIs and the BFFs, never the fronts (MAIR-531)"
    templates: [charts/redis/templates/network-policy.yaml]
    asserts:
      - equal:
          path: spec.ingress[0].from
          value:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/component: api
            - podSelector:
                matchLabels:
                  app.kubernetes.io/component: bff

  - it: message-api publishes and subscribes on its own channels only (MAIR-394)
    templates: [charts/redis/templates/configmap.yaml]
    asserts:
      - matchRegex:
          path: data["entrypoint.sh"]
          pattern: 'user message-api on [^"]* resetchannels &message-api:\* -@all [^"]*\+expire \+publish \+subscribe"'
      - notMatchRegex:
          path: data["entrypoint.sh"]
          pattern: 'user (core|project|calendar|elearning)-api on [^"]*(&|\+publish|\+subscribe)'

  - it: an empty pubSubRoles gives no role any channel
    templates: [charts/redis/templates/configmap.yaml]
    set:
      redis.pubSubRoles: []
    asserts:
      - notMatchRegex:
          path: data["entrypoint.sh"]
          pattern: 'user [a-z-]+ on [^"]*(&[a-z]|\+publish|\+subscribe)'
