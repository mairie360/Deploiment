suite: compatibilité ArgoCD
values:
  - ../../../clusters/mairie360/instances/staging/values.yaml
tests:
  - it: le Job de migration a un nom stable et est un hook Sync en vague 1
    templates: [charts/liquibase/templates/job.yaml]
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-liquibase
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook"]
          value: Sync
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "1"

  - it: la couche data démarre avant les APIs, qui démarrent avant les BFFs, puis les fronts
    templates:
      - charts/database/templates/statefulset.yaml
      - charts/APIs/templates/deployment.yaml
      - charts/BFFs/templates/deployment.yaml
      - charts/Fronts/templates/deployment.yaml
    asserts:
      - exists:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]

  - it: refuse une image sans tag explicite
    set:
      APIs.instances.core-api.image.tag: ""
    templates: [charts/APIs/templates/deployment.yaml]
    asserts:
      - failedTemplate:
          errorPattern: "image.tag est obligatoire"

  - it: ne rend aucun Ingress quand aucun front n'est activé (un Ingress sans rules est refusé par l'API server)
    set:
      Fronts.instances: null
    templates: [templates/ingress.yaml]
    asserts:
      - hasDocuments: { count: 0 }

  - it: l'Ingress ne liste que les fronts activés
    set:
      Fronts.instances.admin-front.enabled: false
    templates: [templates/ingress.yaml]
    asserts:
      - notMatchRegex:
          path: spec.rules[*].host
          pattern: '^admin\.'
