# MAIR-114: each API connects to Postgres with its own role; the postgres
# superuser is reserved to Liquibase.
suite: database access (MAIR-114)
values:
  - ../../../clusters/mairie360/instances/dev/values.yaml
tests:
  - it: an API with a Postgres role gets its own DB_USER, not the superuser
    templates: [charts/APIs/templates/deployment.yaml]
    documentIndex: 0 # first document = "calendar-api" (alphabetical range order)
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_USER
            value: "calendar_api"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_PASSWORD
            valueFrom:
              secretKeyRef: { name: RELEASE-NAME-database-secret, key: CALENDAR_API_PASSWORD }
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_USER
            value: "postgres"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_PASSWORD
            valueFrom:
              secretKeyRef: { name: RELEASE-NAME-database-secret, key: POSTGRES_PASSWORD }

  - it: an API with no Postgres role gets no DB_USER/DB_PASSWORD at all
    templates: [charts/APIs/templates/deployment.yaml]
    set:
      APIs.instances.test-noroles-api:
        enabled: true
        image: { repository: ghcr.io/mairie360/test-noroles-api, tag: "1.0.0" }
    documentIndex: 5 # "test-noroles-api" (alphabetical range order, after the 5 real APIs)
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: { name: DB_USER }
      - notContains:
          path: spec.template.spec.containers[0].env
          content: { name: DB_PASSWORD }

  - it: Liquibase still authenticates as the postgres superuser
    templates: [charts/liquibase/templates/job.yaml]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LIQUIBASE_COMMAND_USERNAME
            valueFrom:
              secretKeyRef: { name: RELEASE-NAME-database-secret, key: POSTGRES_USER }
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LIQUIBASE_COMMAND_PASSWORD
            valueFrom:
              secretKeyRef: { name: RELEASE-NAME-database-secret, key: POSTGRES_PASSWORD }

  - it: Liquibase forwards each role's password as a changelog parameter, never inlined
    templates: [charts/liquibase/templates/job.yaml]
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["sh", "-c"]
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CORE_API_PASSWORD
            valueFrom:
              secretKeyRef: { name: RELEASE-NAME-database-secret, key: CORE_API_PASSWORD }
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '-Dcore_api_password="\$CORE_API_PASSWORD"'
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '-Delearning_api_password="\$ELEARNING_API_PASSWORD"'
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '-Demail_api_password'

  - it: Liquibase gets the changelog parameters after the command (Liquibase 5 rejects them before)
    templates: [charts/liquibase/templates/job.yaml]
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '(?s)\bupdate\b.*-Dcore_api_password'
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '(?s)-D[a-z_]+_password.*\bupdate\b'

  - it: "MAIR-170: Liquibase forwards the admin account's e-mail/password as changelog parameters, optional in the secret"
    templates: [charts/liquibase/templates/job.yaml]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ADMIN_EMAIL
            valueFrom:
              secretKeyRef: { name: RELEASE-NAME-database-secret, key: ADMIN_EMAIL, optional: true }
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ADMIN_PASSWORD
            valueFrom:
              secretKeyRef: { name: RELEASE-NAME-database-secret, key: ADMIN_PASSWORD, optional: true }
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '-Dadmin_email="\$ADMIN_EMAIL"'
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '-Dadmin_password="\$ADMIN_PASSWORD"'
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '(?s)\bupdate\b.*-Dadmin_email'

  - it: "MAIR-170: the database Secret carries ADMIN_EMAIL/ADMIN_PASSWORD when created by the chart, empty by default"
    set:
      database.secret.create: true
      database.env.POSTGRES_PASSWORD: "test-only"
      database.rolePasswords:
        core-api: "test-only"
        project-api: "test-only"
        calendar-api: "test-only"
        message-api: "test-only"
        elearning-api: "test-only"
    templates: [charts/database/templates/secret.yaml]
    asserts:
      - equal: { path: stringData.ADMIN_EMAIL, value: "" }
      - equal: { path: stringData.ADMIN_PASSWORD, value: "" }
