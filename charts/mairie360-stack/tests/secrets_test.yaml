suite: secrets
tests:
  - it: ne crée aucun Secret quand create=false (comportement par défaut)
    values:
      - ../../../clusters/mairie360/instances/prod/values.yaml
    templates:
      - templates/app-secrets.yaml
      - templates/registry-secret.yaml
      - charts/database/templates/secret.yaml
      - charts/redis/templates/secret.yaml
    asserts:
      - hasDocuments: { count: 0 }

  - it: peut créer des Secrets en clair si create=true (jamais en production)
    set:
      secrets.create: true
      secrets.jwtSecret: "test-only"
      secrets.s3AccessKey: "SCWTESTACCESS"
      secrets.s3SecretKey: "test-secret"
    templates:
      - templates/app-secrets.yaml
    asserts:
      - hasDocuments: { count: 1 }
      - equal:
          path: stringData.JWT_SECRET
          value: "test-only"
      - equal:
          path: stringData.S3_ACCESS_KEY
          value: "SCWTESTACCESS"
      - equal:
          path: stringData.S3_SECRET_KEY
          value: "test-secret"

  - it: refuse de créer le Secret sans le couple de clés S3 (create=true)
    set:
      secrets.create: true
      secrets.jwtSecret: "test-only"
    templates:
      - templates/app-secrets.yaml
    asserts:
      - failedTemplate:
          errorPattern: secrets.s3AccessKey

  - it: aucun secret n'est injecté en clair dans les APIs
    values:
      - ../../../clusters/mairie360/instances/prod/values.yaml
    templates: [charts/APIs/templates/deployment.yaml]
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: { name: JWT_SECRET, value: 'b"secret"' }
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: JWT_SECRET
            valueFrom:
              secretKeyRef: { name: RELEASE-NAME-app-secrets, key: JWT_SECRET }

  - it: Postgres lit son mot de passe dans le Secret, pas dans les values
    values:
      - ../../../clusters/mairie360/instances/prod/values.yaml
    templates: [charts/database/templates/statefulset.yaml]
    asserts:
      - exists:
          path: spec.template.spec.containers[0].env[1].valueFrom.secretKeyRef

  - it: elearning-api reads the S3 key pair from the app Secret, never from values
    values:
      - ../../../clusters/mairie360/instances/prod/values.yaml
    templates: [charts/APIs/templates/deployment.yaml]
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-elearning-api
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: S3_ACCESS_KEY
            valueFrom:
              secretKeyRef: { name: RELEASE-NAME-app-secrets, key: S3_ACCESS_KEY }
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: S3_SECRET_KEY
            valueFrom:
              secretKeyRef: { name: RELEASE-NAME-app-secrets, key: S3_SECRET_KEY }
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: S3_BUCKET, value: mairie360-elearning-prod }
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: S3_REGION, value: fr-par }
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: S3_ENDPOINT, value: https://s3.fr-par.scw.cloud }
      - notMatchRegexRaw:
          pattern: "SCW[A-Z0-9]{17}"

  - it: every instance gives elearning-api a bucket and the S3 key pair
    values:
      - ../../../clusters/mairie360/instances/dev/values.yaml
    templates: [charts/APIs/templates/deployment.yaml]
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-elearning-api
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: S3_BUCKET, value: mairie360-elearning-dev }
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: S3_SECRET_KEY
            valueFrom:
              secretKeyRef: { name: RELEASE-NAME-app-secrets, key: S3_SECRET_KEY }
