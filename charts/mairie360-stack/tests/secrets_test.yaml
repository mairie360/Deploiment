suite: secrets
tests:
  - it: ne crée aucun Secret quand create=false (comportement par défaut)
    values:
      - ../../../clusters/mairie360/instances/prod/values.yaml
    templates:
      - templates/app-secrets.yaml
      - templates/registry-secret.yaml
      - charts/database/templates/secret.yaml
      - charts/redis/templates/secret.yaml
    asserts:
      - hasDocuments: { count: 0 }

  - it: peut créer des Secrets en clair si create=true (jamais en production)
    set:
      secrets.create: true
      secrets.jwtSecret: "test-only"
    templates:
      - templates/app-secrets.yaml
    asserts:
      - hasDocuments: { count: 1 }
      - equal:
          path: stringData.JWT_SECRET
          value: "test-only"
      - equal:
          path: stringData.SMTP_PASSWORD
          value: ""

  - it: aucun secret n'est injecté en clair dans les APIs
    values:
      - ../../../clusters/mairie360/instances/prod/values.yaml
    templates: [charts/APIs/templates/deployment.yaml]
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: { name: JWT_SECRET, value: 'b"secret"' }
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: JWT_SECRET
            valueFrom:
              secretKeyRef: { name: RELEASE-NAME-app-secrets, key: JWT_SECRET }

  - it: Postgres lit son mot de passe dans le Secret, pas dans les values
    values:
      - ../../../clusters/mairie360/instances/prod/values.yaml
    templates: [charts/database/templates/statefulset.yaml]
    asserts:
      - exists:
          path: spec.template.spec.containers[0].env[1].valueFrom.secretKeyRef

  - it: core-api reads the Resend API key (SMTP_PASSWORD) from the app Secret, never from values
    values:
      - ../../../clusters/mairie360/instances/prod/values.yaml
    templates: [charts/APIs/templates/deployment.yaml]
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-core-api
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMTP_PASSWORD
            valueFrom:
              secretKeyRef: { name: RELEASE-NAME-app-secrets, key: SMTP_PASSWORD, optional: true }
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: SMTP_HOST, value: smtp.resend.com }
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: SMTP_USERNAME, value: resend }
      - notMatchRegexRaw:
          pattern: "re_[A-Za-z0-9]{8,}"

  - it: the app Secret carries SMTP_PASSWORD when created by the chart
    set:
      secrets.create: true
      secrets.jwtSecret: "test-only"
      secrets.smtpPassword: "re_test"
    templates:
      - templates/app-secrets.yaml
    asserts:
      - equal:
          path: stringData.SMTP_PASSWORD
          value: "re_test"
