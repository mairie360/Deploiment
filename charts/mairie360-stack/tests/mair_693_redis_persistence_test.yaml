suite: Redis persistence of staging and prod (MAIR-693)
# The AOF holds the JWT revocation list (`revoked:<sid>`). On an emptyDir a rescheduled pod starts
# empty and a revoked JWT is accepted again until it expires; staging and every prod instance keep
# /data on a PVC.
tests:
  - it: staging keeps the Redis data on a PVC
    values:
      - ../../../clusters/mairie360/instances/staging/values.yaml
    templates: [charts/redis/templates/deployment.yaml]
    documentSelector:
      path: kind
      value: PersistentVolumeClaim
    asserts:
      - equal: { path: metadata.name, value: RELEASE-NAME-redis-data }
      - equal: { path: spec.storageClassName, value: local-path }
      - equal: { path: spec.accessModes, value: [ReadWriteOnce] }
      - equal: { path: spec.resources.requests.storage, value: 1Gi }

  - it: the PVC is in the sync wave of its Deployment, a WaitForFirstConsumer volume would stall an earlier wave
    values:
      - ../../../clusters/mairie360/instances/staging/values.yaml
    templates: [charts/redis/templates/deployment.yaml]
    documentSelector:
      path: kind
      value: PersistentVolumeClaim
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "0"

  - it: the Deployment that mounts the PVC is in that same wave
    values:
      - ../../../clusters/mairie360/instances/staging/values.yaml
    templates: [charts/redis/templates/deployment.yaml]
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "0"

  - it: staging mounts that PVC on /data, not an emptyDir
    values:
      - ../../../clusters/mairie360/instances/staging/values.yaml
    templates: [charts/redis/templates/deployment.yaml]
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: data
            persistentVolumeClaim: { claimName: RELEASE-NAME-redis-data }
      - notContains:
          path: spec.template.spec.volumes
          content: { name: data, emptyDir: {} }
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: { name: data, mountPath: /data }

  - it: the Redis of staging still writes its AOF in /data
    values:
      - ../../../clusters/mairie360/instances/staging/values.yaml
    templates: [charts/redis/templates/configmap.yaml]
    asserts:
      - matchRegex:
          path: data["redis.conf"]
          pattern: 'appendonly yes'

  - it: every prod instance keeps the Redis data on a PVC (mairie360 prod)
    values:
      - ../../../clusters/_base/prod.yaml
      - ../../../clusters/mairie360/instances/prod/values.yaml
    templates: [charts/redis/templates/deployment.yaml]
    documentSelector:
      path: kind
      value: PersistentVolumeClaim
    asserts:
      - equal: { path: metadata.name, value: RELEASE-NAME-redis-data }
      - equal: { path: spec.storageClassName, value: local-path }
      - equal: { path: spec.resources.requests.storage, value: 1Gi }

  - it: every prod instance keeps the Redis data on a PVC (client-example prod)
    values:
      - ../../../clusters/_base/prod.yaml
      - ../../../clusters/client-example/instances/prod/values.yaml
    templates: [charts/redis/templates/deployment.yaml]
    documentSelector:
      path: kind
      value: PersistentVolumeClaim
    asserts:
      - equal: { path: metadata.name, value: RELEASE-NAME-redis-data }
      - equal: { path: spec.storageClassName, value: local-path }

  - it: prod mounts the PVC on /data and replaces the pod instead of running two on one volume
    values:
      - ../../../clusters/_base/prod.yaml
      - ../../../clusters/mairie360/instances/prod/values.yaml
    templates: [charts/redis/templates/deployment.yaml]
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: data
            persistentVolumeClaim: { claimName: RELEASE-NAME-redis-data }
      - equal: { path: spec.strategy.type, value: Recreate }

  - it: dev stays on an emptyDir, a disposable environment
    values:
      - ../../../clusters/mairie360/instances/dev/values.yaml
    templates: [charts/redis/templates/deployment.yaml]
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content: { name: data, emptyDir: {} }
