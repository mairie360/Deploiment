suite: shell information of the fronts (MAIR-844)
# The fronts' shell shows the image tag as the footer version (APP_VERSION) and
# the commune name (COMMUNE_NAME, from global.legal.mairie.name, MAIR-1109);
# both are runtime env vars.
values:
  - ../../../clusters/mairie360/instances/dev/values.yaml
templates: [charts/Fronts/templates/deployment.yaml]
tests:
  - it: MAIR-844 message-front gets the image tag as APP_VERSION
    set:
      Fronts.instances.message-front.image.tag: "dev-1234567"
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-message-front
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: APP_VERSION, value: "dev-1234567" }

  - it: MAIR-844 every front gets APP_VERSION (ahead of its V2 shell)
    documentSelector:
      path: kind
      value: Deployment
      matchMany: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: APP_VERSION }
          any: true

  - it: MAIR-844 an instance env entry wins over the generated APP_VERSION
    set:
      Fronts.instances.message-front.image.tag: "dev-1234567"
      Fronts.instances.message-front.env:
        - { name: APP_VERSION, value: "1.2.3" }
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-message-front
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: APP_VERSION, value: "1.2.3" }
      - notContains:
          path: spec.template.spec.containers[0].env
          content: { name: APP_VERSION, value: "dev-1234567" }

  - it: MAIR-844 a commonEnv entry wins too and is not duplicated
    set:
      Fronts.instances.message-front.image.tag: "dev-1234567"
      Fronts.commonEnv:
        - { name: NODE_ENV, value: "production" }
        - { name: APP_VERSION, value: "2.0.0" }
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-message-front
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: APP_VERSION, value: "2.0.0" }
      - notContains:
          path: spec.template.spec.containers[0].env
          content: { name: APP_VERSION, value: "dev-1234567" }

  # MAIR-844 first brought its own COMMUNE_NAME (global.commune.name) next to
  # MAIR-1109's, which put it twice in the container env. The shell information
  # carries no commune name of its own: global.legal.mairie.name is the only source.
  - it: MAIR-844 COMMUNE_NAME comes from global.legal.mairie.name
    set:
      global.legal.mairie.name: "Testville"
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-message-front
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: COMMUNE_NAME, value: "Testville" }

  - it: MAIR-844 without a mairie name no front gets COMMUNE_NAME, APP_VERSION still comes
    set:
      global.legal.mairie.name: ""
    documentSelector:
      path: kind
      value: Deployment
      matchMany: true
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: { name: COMMUNE_NAME }
          any: true
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: APP_VERSION }
          any: true
