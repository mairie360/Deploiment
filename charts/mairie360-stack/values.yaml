# --- 1. Variables Globales ---
global:
  domain: "mairie360-eip.fr" # Utilisé par l'Ingress pour générer les sous-domaines

image:
  pullSecret: "ghcr-secret"
  pullSecretData: ""
  pullPolicy: "Always"

# --- 2. Configuration Ingress (fronts) ---
# Consommé par templates/ingress.yaml : un Ingress unique qui expose chaque front
# activé sur https://<front sans "-front">.<global.domain>, avec un certificat
# multi-SAN émis par cert-manager (clusterIssuer).
ingress:
  enabled: true
  # Doit correspondre au contrôleur présent sur le cluster cible (nginx, traefik…).
  className: "nginx"
  # ClusterIssuer cert-manager déployé par bootstrap/appsets/cluster-issuer-appset.yaml.
  clusterIssuer: "letsencrypt-prod"
  # Nom du Secret TLS (défaut : <fullname>-fronts-tls).
  tlsSecretName: ""
  # Annotations spécifiques au contrôleur (surchargées par environnement).
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"

# --- 3. Configuration des Sous-Charts (Fronts & BFFs) ---
# Note : Les noms ici doivent correspondre EXACTEMENT aux noms dans ton dossier charts/
Fronts:
  enabled: true
  # Ressources par défaut pour TOUS les fronts (standalone)
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  # Cette liste sera surchargée par tes fichiers dev/values.yaml ou prod/values.yaml
  instances: {}

BFFs:
  enabled: true
  resources:
    requests:
      memory: "32Mi"
      cpu: "20m"
    limits:
      memory: "128Mi"
      cpu: "100m"
  instances: {}
