# =============================================================================
# mairie360-stack — valeurs par défaut
#
# Ce fichier définit l'INTERFACE du chart. Les fichiers d'environnement
# (clusters/<cluster>/instances/<env>/values.yaml) ne font que surcharger
# ce qui change d'un environnement à l'autre : domaine, tags d'images,
# tailles, secrets.
#
# Règle : tout ce qui est sous `global:` est visible par les sous-charts
# (APIs, BFFs, Fronts, database, redis, liquibase). Le reste ne l'est pas.
# =============================================================================

global:
  # Domaine public. Les fronts sont exposés sur https://<front>.<domain>
  domain: "mairie360-eip.fr"

  # Nom du Secret de type dockerconfigjson utilisé par TOUS les pods pour
  # tirer les images GHCR. Mettre "" si les images sont publiques.
  imagePullSecret: "ghcr-secret"

  # Ingress controller running on this instance's machine (MAIR-260):
  # "nginx" (ingress-nginx, retired upstream) or "traefik". It drives the
  # IngressClass of the chart's Ingresses, their controller-specific
  # annotations/Middlewares and, unless ingressNamespace is set, the
  # namespace the NetworkPolicies admit. It MUST match the controller the
  # platform AppSets install on that machine, chosen by the Argo CD cluster
  # label `mairie360.fr/ingress` (ansible `ingress_controller`): see
  # docs/adr/0001-replace-ingress-nginx.md for the switch procedure.
  ingressController: "nginx"

  # Namespace of the ingress controller: the only namespace allowed to reach
  # the fronts and the ACME solver pods (NetworkPolicy). "" = derived from
  # ingressController ("ingress-nginx" or "traefik").
  ingressNamespace: ""

  # Addresses of the in-cluster reverse proxies (the ingress controller and the
  # fronts' Next.js server routes all run as pods). Injected into every BFF
  # as TRUST_PROXY (Express `trust proxy`, preceded by `loopback`) so that
  # req.ip is the browser's address taken from X-Forwarded-For, which the
  # per-IP rate limits of BFF_user rely on (MAIR-226). Must match the pod
  # CIDR of the machines: ansible `k3s_cluster_cidr` (Cilium cluster-pool).
  # Never add a public range: any peer in this list may choose the client IP.
  # [] = TRUST_PROXY not set, every client is seen as the front pod.
  trustedProxyCIDRs: ["10.42.0.0/16"]

  # Namespace de Prometheus, s'il existe. Autorise le scraping des pods.
  # Laisser "" si pas de monitoring.
  monitoringNamespace: ""

  networkPolicy:
    # Interdit tout trafic entrant non explicitement autorisé (default-deny)
    # puis ouvre uniquement les flux ingress → fronts → bffs → apis → data.
    # NB : sur Kind, le CNI par défaut ignore les NetworkPolicy. Sur k3s
    # elles sont appliquées.
    enabled: true
    # Interdit aussi le trafic SORTANT non autorisé. Désactivé par défaut
    # car core-api (Resend, smtp.resend.com:587), elearning-api (Scaleway
    # Object Storage, s3.<region>.scw.cloud) et le CronJob backup (bucket S3)
    # ont besoin d'Internet ; à activer une fois ces destinations déclarées
    # dans `egressAllowCIDRs`.
    egressDefaultDeny: false
    egressAllowCIDRs: []
    # Cilium only. Mirrors the HTTP hops (fronts -> bffs, bffs -> apis) as
    # CiliumNetworkPolicies with an L7 rule so that Hubble records method,
    # path and status code of every request (`hubble observe --protocol http`,
    # scripts/hubble-flows.sh). Purely for visibility: it allows nothing the
    # NetworkPolicies do not. Needs the Cilium CNI (Ansible role k8s_node);
    # a cluster without its CRDs cannot sync it. templates/cilium-l7-visibility.yaml
    ciliumL7Visibility: false

  secrets:
    # Secret contenant les secrets applicatifs partagés : JWT_SECRET (toutes
    # les APIs/BFFs), SMTP_PASSWORD (clé API Resend, lue par core-api) et
    # S3_ACCESS_KEY / S3_SECRET_KEY (Object Storage, lus par elearning-api).
    # Défaut : <release>-app-secrets. Voir `secrets.create` plus bas.
    appSecretName: ""

  database:
    # Nom du Secret Postgres (clés POSTGRES_USER / POSTGRES_PASSWORD /
    # POSTGRES_DB, réservées à Liquibase, + une clé <ROLE>_PASSWORD par rôle
    # ci-dessous). Défaut : <release>-database-secret.
    secretName: ""
    # Postgres roles, one per API that owns a schema (MAIR-114). Deliberately
    # NOT derived from global.apis.instances like redis.roles: only the 5
    # shipped APIs have a role created by the Devops/Database migration.
    # An API with no entry here gets no DB_USER/DB_PASSWORD at all rather
    # than falling back to the postgres superuser. Keep in sync with
    # scripts/seal-secrets.sh's DB_ROLES.
    roles: ["core-api", "project-api", "calendar-api", "message-api", "elearning-api"]

  # Ports de service des APIs et BFFs. Source de vérité UNIQUE : ces valeurs
  # alimentent à la fois les Services et les variables *_URL injectées dans
  # les BFFs et les fronts. Les conteneurs APIs écoutent tous sur 3000 ; un
  # port de Service différent par API n'est pas nécessaire (chaque Service a
  # sa propre IP) mais est conservé pour ne pas casser les URLs existantes.
  apis:
    instances:
      core-api:      { port: 3000 }
      project-api:   { port: 3001 }
      calendar-api:  { port: 3002 }
      message-api:   { port: 3003 }
      elearning-api: { port: 3006 }
  bffs:
    instances:
      user-bff:      { port: 4000 }
      project-bff:   { port: 4001 }
      calendar-bff:  { port: 4002 }
      message-bff:   { port: 4003 }
      dashboard-bff: { port: 4004 }
      settings-bff:  { port: 4005 }
      elearning-bff: { port: 4006 }

# -----------------------------------------------------------------------------
# Secret de registre (templates/registry-secret.yaml)
# Ne renseigner `pullSecretData` QUE pour un cluster local jetable. En
# environnement réel, le Secret `ghcr-secret` est fourni par un SealedSecret
# (voir scripts/seal-secrets.sh) et cette valeur reste vide.
# -----------------------------------------------------------------------------
image:
  pullSecret: "ghcr-secret"
  pullSecretData: ""

# -----------------------------------------------------------------------------
# Secrets applicatifs (templates/app-secrets.yaml)
# create: true  -> le chart crée <release>-app-secrets à partir des valeurs
#                  ci-dessous. RÉSERVÉ AU CLUSTER LOCAL.
# create: false -> le Secret doit exister (SealedSecret). C'est le mode
#                  attendu sur dev / staging / prod.
# -----------------------------------------------------------------------------
secrets:
  create: false
  jwtSecret: ""
  # Resend API key (SMTP password of core-api). Optional: empty means core-api
  # starts but cannot send e-mails.
  smtpPassword: ""
  # Object Storage (S3) access key pair read by elearning-api. Required when
  # create=true: the API refuses to start without them.
  s3AccessKey: ""
  s3SecretKey: ""

# -----------------------------------------------------------------------------
# Single Ingress for every enabled front (templates/ingress.yaml)
# -----------------------------------------------------------------------------
ingress:
  enabled: true
  # IngressClass. "" = global.ingressController ("nginx" or "traefik"), which
  # is what the platform AppSets install; only set it for a custom class.
  className: ""
  # cert-manager ClusterIssuer. Start with letsencrypt-staging to validate
  # the chain, then switch to letsencrypt-prod.
  clusterIssuer: "letsencrypt-prod"
  # TLS Secret name. Default: <release>-fronts-tls.
  tlsSecretName: ""
  # Maximum request body size, in MiB, translated per controller:
  #   nginx   -> nginx.ingress.kubernetes.io/proxy-body-size: "<n>m"
  #   traefik -> a `buffering` Middleware (maxRequestBodyBytes), attached
  #              with traefik.ingress.kubernetes.io/router.middlewares
  # Requests above it get 413. 0 = no limit set by the chart.
  maxBodySizeMiB: 50
  # HTTP -> HTTPS redirect: nginx gets ssl-redirect/force-ssl-redirect on the
  # Ingress; with traefik the redirect is done by the controller itself (web
  # entrypoint, bootstrap/values/traefik.yaml) and the fronts' routers only
  # listen on websecure, so it cannot be turned off per instance.
  # Extra annotations, added as-is whatever the controller (they win over
  # the generated ones).
  annotations: {}

# -----------------------------------------------------------------------------
# Objets supplémentaires rendus tels quels (SealedSecret, ExternalSecret…).
# Alimenté par clusters/<cluster>/instances/<env>/secrets.yaml.
# -----------------------------------------------------------------------------
extraObjects: []

# -----------------------------------------------------------------------------
# Sous-charts. Les clés doivent correspondre EXACTEMENT aux noms des dossiers
# dans charts/ (APIs, BFFs, Fronts, database, redis, liquibase).
# Les `instances` sont renseignées par environnement.
# -----------------------------------------------------------------------------
database:
  enabled: true
redis:
  enabled: true
liquibase:
  enabled: true
# Off by default: needs a real S3 bucket + sealed backup-secret per instance
# first. See charts/backup/README.md (MAIR-119).
backup:
  enabled: false

APIs:
  enabled: true
  resources:
    requests: { memory: "64Mi", cpu: "50m" }
    limits:   { memory: "256Mi", cpu: "500m" }
  instances: {}

BFFs:
  enabled: true
  resources:
    requests: { memory: "128Mi", cpu: "20m" }
    limits:   { memory: "512Mi", cpu: "500m" }
  instances: {}

Fronts:
  enabled: true
  resources:
    requests: { memory: "64Mi", cpu: "50m" }
    limits:   { memory: "256Mi", cpu: "500m" }
  instances: {}
