# =============================================================================
# mairie360-stack — valeurs par défaut
#
# Ce fichier définit l'INTERFACE du chart. Les fichiers d'environnement
# (clusters/<cluster>/instances/<env>/values.yaml) ne font que surcharger
# ce qui change d'un environnement à l'autre : domaine, tags d'images,
# tailles, secrets.
#
# Règle : tout ce qui est sous `global:` est visible par les sous-charts
# (APIs, BFFs, Fronts, database, redis, liquibase, keycloak). Le reste ne l'est pas.
# =============================================================================

global:
  # Domaine public. Les fronts sont exposés sur https://<front>.<domain>
  domain: "mairie360-eip.fr"

  # Nom du Secret de type dockerconfigjson utilisé par TOUS les pods pour
  # tirer les images GHCR. Mettre "" si les images sont publiques.
  imagePullSecret: "ghcr-secret"

  # Ingress controller running on this instance's machine (MAIR-260):
  # "nginx" (ingress-nginx, retired upstream) or "traefik". It drives the
  # IngressClass of the chart's Ingresses, their controller-specific
  # annotations/Middlewares and, unless ingressNamespace is set, the
  # namespace the NetworkPolicies admit. It MUST match the controller the
  # platform AppSets install on that machine, chosen by the Argo CD cluster
  # label `mairie360.fr/ingress` (ansible `ingress_controller`): see
  # docs/adr/0001-replace-ingress-nginx.md for the switch procedure.
  ingressController: "nginx"

  # Namespace of the ingress controller: the only namespace allowed to reach
  # the fronts and the ACME solver pods (NetworkPolicy). "" = derived from
  # ingressController ("ingress-nginx" or "traefik").
  ingressNamespace: ""

  # Addresses of the in-cluster reverse proxies (the ingress controller and the
  # fronts' Next.js server routes all run as pods). Injected into every BFF
  # as TRUST_PROXY (Express `trust proxy`, preceded by `loopback`) so that
  # req.ip is the browser's address taken from X-Forwarded-For, which the
  # per-IP rate limits of BFF_user rely on (MAIR-226). Must match the pod
  # CIDR of the machines: ansible `k3s_cluster_cidr` (Cilium cluster-pool).
  # Never add a public range: any peer in this list may choose the client IP.
  # [] = TRUST_PROXY not set, every client is seen as the front pod.
  trustedProxyCIDRs: ["10.42.0.0/16"]

  # Namespace de Prometheus, s'il existe. Autorise le scraping des pods.
  # Laisser "" si pas de monitoring.
  monitoringNamespace: ""

  networkPolicy:
    # Interdit tout trafic entrant non explicitement autorisé (default-deny)
    # puis ouvre uniquement les flux ingress → fronts → bffs → apis → data.
    # NB : sur Kind, le CNI par défaut ignore les NetworkPolicy. Sur k3s
    # elles sont appliquées.
    enabled: true
    # Interdit aussi le trafic SORTANT non autorisé. Désactivé par défaut
    # car core-api et Keycloak (Resend, smtp.resend.com:587), elearning-api
    # (Scaleway Object Storage, s3.<region>.scw.cloud) et le CronJob backup
    # (bucket S3) ont besoin d'Internet ; à activer une fois ces destinations
    # déclarées dans `egressAllowCIDRs`.
    egressDefaultDeny: false
    egressAllowCIDRs: []
    # Cilium only. Mirrors the HTTP hops (fronts -> bffs, bffs -> apis) as
    # CiliumNetworkPolicies with an L7 rule so that Hubble records method,
    # path and status code of every request (`hubble observe --protocol http`,
    # scripts/hubble-flows.sh). Purely for visibility: it allows nothing the
    # NetworkPolicies do not. Needs the Cilium CNI (Ansible role k8s_node);
    # a cluster without its CRDs cannot sync it. templates/cilium-l7-visibility.yaml
    ciliumL7Visibility: false

  # MAIR-131 (POC): OpenTelemetry Collector (charts/observability) relaying
  # traces and metrics to Scaleway Cockpit. `enabled` renders the collector
  # AND injects the OTEL_* SDK variables into the APIs listed in `apis`, so
  # both sides switch on together. Needs the observability.cockpit.*
  # endpoints and <release>-cockpit-secret (scripts/seal-secrets.sh,
  # COCKPIT_TOKEN) first.
  observability:
    enabled: false
    apis: ["core-api"]

  # MAIR-498: the instance's compliance service (mairie360/Compliance_API),
  # deployed as the `compliance-api` entry of APIs.instances. `enabled` is the
  # one switch: it adds the compliance-api Postgres role password to the
  # Liquibase job and the API (DB_USER compliance_api), its Redis ACL account
  # (read on every key for the long-TTL scan, write on `redis.erasurePatterns`
  # only), the compliance-only env below, and a NetworkPolicy that admits
  # core-api alone. Off, nothing changes for the other services and the
  # Liquibase job still passes a random throwaway password for the
  # compliance_api role the Database changelog creates (v3.0.1+), so the role
  # exists but cannot be logged into.
  # Before turning it on: the COMPLIANCE_API_PASSWORD key of the database
  # secret and the compliance-api-password key of the Redis secret
  # (scripts/seal-secrets.sh), and an APIs.instances.compliance-api entry.
  compliance:
    enabled: false
    port: 3004
    # Secret with the erasure credentials, ONLY mounted in compliance-api,
    # every key optional (a connector without its credentials is "not
    # configured" and its erasure step is recorded as such):
    #   KEYCLOAK_ADMIN_CLIENT_SECRET  service account with realm-management manage-users
    #   RESEND_API_KEY                full access key (removes audience contacts)
    #   S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY  delete rights on s3.bucket
    # Default: <release>-compliance-secret (scripts/seal-secrets.sh).
    secretName: ""
    keycloak:
      # Confidential client of the realm with a service account. Keycloak only
      # imports a realm once: create it in the admin console on a running
      # instance.
      adminClientId: "compliance"
      # "" = the in-cluster Service (<release>-keycloak:8080, global.keycloak.realm)
      adminUrl: ""
      tokenUrl: ""
    resend:
      audienceId: ""
    s3:
      endpoint: ""
      region: ""
      bucket: ""
      prefix: "users/{user_id}/"
    # MAIR-500: Scaleway Key Manager of the instance, holding one key per user
    # for the sealed backups (backup.sealing). compliance-api destroys a user's
    # key at erasure (SCW_SECRET_KEY of the compliance secret), the backup Job
    # creates keys and data keys (SCW_SECRET_KEY of the backup secret). "" =
    # not configured: the erasure records the backup-key step as such.
    keyManager:
      projectId: ""
      region: "fr-par"
    redis:
      # Keys of a user, `{user_id}` replaced at erasure time (REDIS_ERASURE_PATTERNS);
      # the ACL grants write on them with `{user_id}` -> `*`.
      erasurePatterns: []
      # Commands added to redis.aclCommands for this account (SCAN + TTL for
      # the long-TTL scan).
      extraCommands: ["scan", "ttl"]
      longTtlSeconds: 2592000
    scanIntervalSeconds: 21600
    erasureRetrySeconds: 300

  secrets:
    # Secret contenant les secrets applicatifs partagés : JWT_SECRET (toutes
    # les APIs/BFFs), SMTP_PASSWORD (clé API Resend, lue par core-api) et
    # S3_ACCESS_KEY / S3_SECRET_KEY (Object Storage, lus par elearning-api).
    # Défaut : <release>-app-secrets. Voir `secrets.create` plus bas.
    appSecretName: ""

  # Session tokens signed by core-api alone (MAIR-680, audit A1). Core signs
  # with an Ed25519 key (EdDSA), every API and BFF only verifies them with the
  # public half: a compromised pod can no longer forge an administrator token,
  # as it could with the HS256 JWT_SECRET shared by the 12 services.
  # scripts/seal-secrets.sh generates the key pair of the instance (once,
  # never overwritten), seals the private key in <release>-jwt-signing-secret
  # and prints the public key to paste below. templates/jwt-session-keys.yaml
  # refuses inconsistent settings.
  jwt:
    # JWT_PUBLIC_KEY of every API and BFF (compliance-api included): plain
    # PEM, not a secret. Several `PUBLIC KEY` blocks are allowed during a
    # rotation (publish the new key first, then let core-api sign with it).
    # "" = not injected: the services then only accept the HS256 tokens of
    # JWT_SECRET (transition, safe as long as JWT_SECRET is set).
    publicKey: ""
    signing:
      # core-api (and only core-api) gets JWT_PRIVATE_KEY and signs EdDSA
      # tokens. Turn on only once EVERY API and BFF of the instance runs an
      # image that verifies EdDSA (API_lib / bffs-lib MAIR-680): an older one
      # refuses every session signed after the switch. Requires publicKey.
      # The private key is read from <release>-jwt-signing-secret (key
      # JWT_PRIVATE_KEY), the name scripts/seal-secrets.sh seals: no override,
      # so the chart and the provisioning cannot disagree.
      enabled: false

  database:
    # Nom du Secret Postgres (clés POSTGRES_USER / POSTGRES_PASSWORD /
    # POSTGRES_DB, réservées à Liquibase, + une clé <ROLE>_PASSWORD par rôle
    # ci-dessous). Défaut : <release>-database-secret.
    secretName: ""
    # Postgres roles, one per API that owns a schema (MAIR-114). Deliberately
    # NOT derived from global.apis.instances like redis.roles: only the 5
    # shipped APIs have a role created by the Devops/Database migration.
    # An API with no entry here gets no DB_USER/DB_PASSWORD at all rather
    # than falling back to the postgres superuser. Keep in sync with
    # scripts/seal-secrets.sh's DB_ROLES.
    roles: ["core-api", "project-api", "calendar-api", "message-api", "elearning-api"]

  # Per-instance values that the shared clusters/_base/<env>.yaml references
  # inside env lists (MAIR-414), since a list cannot be partly overridden:
  #   emailFrom        sender address of core-api's e-mails (EMAIL_FROM)
  #   elearningBucket  Object Storage bucket of elearning-api (S3_BUCKET)
  emailFrom: ""
  elearningBucket: ""

  # Legal notice and privacy policy of the instance (MAIR-292), shown by the
  # login front at /mentions-legales and /confidentialite (every front's
  # footer links there). Passed as LEGAL_CONFIG (JSON) to the fronts of
  # Fronts.legalConfigInstances, read at request time: one image serves every
  # mairie. `retention` and `subprocessors` repeat the decisions of
  # compliance/<org>/ (MAIR-294): scripts/check-compliance.py fails when they
  # differ. Empty values are shown as "to be completed by the mairie".
  legal:
    mairie: { name: "", address: "", email: "" }
    publicationDirector: ""
    dpo: { name: "", email: "" }
    host: { name: "", address: "" }
    # Keys of compliance/<org>/retention.yaml: technical_logs,
    # archived_accounts_anonymization and the tables (sessions,
    # connection_logs, access_logs, users_audit_log) -> "<n> day(s)|month(s)|year(s)".
    retention: {}
    # { name, location, purpose } of compliance/<org>/subprocessors.yaml
    # (purpose: its French `purpose_fr`).
    subprocessors: []

  # Keycloak (MAIR-139): the instance's identity provider, charts/keycloak.
  # Global because the BFFs/APIs will need the same issuer URL
  # (https://<hostname>/realms/<realm>) as the browser.
  keycloak:
    # Public hostname, exposed by templates/keycloak-ingress.yaml.
    # "" = auth.<global.domain>
    hostname: ""
    # Realm provisioned at first start (charts/keycloak/values.yaml `realm`).
    realm: "mairie360"

  # Ports de service des APIs et BFFs. Source de vérité UNIQUE : ces valeurs
  # alimentent à la fois les Services et les variables *_URL injectées dans
  # les BFFs et les fronts. Les conteneurs APIs écoutent tous sur 3000 ; un
  # port de Service différent par API n'est pas nécessaire (chaque Service a
  # sa propre IP) mais est conservé pour ne pas casser les URLs existantes.
  apis:
    instances:
      core-api:      { port: 3000 }
      project-api:   { port: 3001 }
      calendar-api:  { port: 3002 }
      message-api:   { port: 3003 }
      elearning-api: { port: 3006 }
  bffs:
    instances:
      user-bff:      { port: 4000 }
      project-bff:   { port: 4001 }
      calendar-bff:  { port: 4002 }
      message-bff:   { port: 4003 }
      dashboard-bff: { port: 4004 }
      settings-bff:  { port: 4005 }
      elearning-bff: { port: 4006 }

# -----------------------------------------------------------------------------
# Secret de registre (templates/registry-secret.yaml)
# Ne renseigner `pullSecretData` QUE pour un cluster local jetable. En
# environnement réel, le Secret `ghcr-secret` est fourni par un SealedSecret
# (voir scripts/seal-secrets.sh) et cette valeur reste vide.
# -----------------------------------------------------------------------------
image:
  pullSecret: "ghcr-secret"
  pullSecretData: ""

# -----------------------------------------------------------------------------
# Secrets applicatifs (templates/app-secrets.yaml)
# create: true  -> le chart crée <release>-app-secrets à partir des valeurs
#                  ci-dessous. RÉSERVÉ AU CLUSTER LOCAL.
# create: false -> le Secret doit exister (SealedSecret). C'est le mode
#                  attendu sur dev / staging / prod.
# -----------------------------------------------------------------------------
secrets:
  create: false
  jwtSecret: ""
  # Resend API key (SMTP password of core-api). Optional: empty means core-api
  # starts but cannot send e-mails.
  smtpPassword: ""
  # Object Storage (S3) access key pair read by elearning-api. Required when
  # create=true: the API refuses to start without them.
  s3AccessKey: ""
  s3SecretKey: ""
  # Ed25519 private key (PEM) of <release>-jwt-signing-secret, created with
  # create=true and global.jwt.signing.enabled only (MAIR-680).
  jwtPrivateKey: ""

# -----------------------------------------------------------------------------
# Single Ingress for every enabled front (templates/ingress.yaml), and the
# dedicated Keycloak Ingress (templates/keycloak-ingress.yaml): same class,
# same ClusterIssuer, same annotations (+ keycloak.ingress.annotations).
# -----------------------------------------------------------------------------
ingress:
  enabled: true
  # IngressClass. "" = global.ingressController ("nginx" or "traefik"), which
  # is what the platform AppSets install; only set it for a custom class.
  className: ""
  # cert-manager ClusterIssuer. Start with letsencrypt-staging to validate
  # the chain, then switch to letsencrypt-prod.
  clusterIssuer: "letsencrypt-prod"
  # TLS Secret name. Default: <release>-fronts-tls.
  tlsSecretName: ""
  # Maximum request body size, in MiB, translated per controller:
  #   nginx   -> nginx.ingress.kubernetes.io/proxy-body-size: "<n>m"
  #   traefik -> a `buffering` Middleware (maxRequestBodyBytes), attached
  #              with traefik.ingress.kubernetes.io/router.middlewares
  # Requests above it get 413. 0 = no limit set by the chart.
  maxBodySizeMiB: 50
  # HTTP -> HTTPS redirect: nginx gets ssl-redirect/force-ssl-redirect on the
  # Ingress; with traefik the redirect is done by the controller itself (web
  # entrypoint, bootstrap/addons/traefik/values.yaml) and the fronts' routers only
  # listen on websecure, so it cannot be turned off per instance.
  # Extra annotations, added as-is whatever the controller (they win over
  # the generated ones).
  annotations: {}

# -----------------------------------------------------------------------------
# Objets supplémentaires rendus tels quels (SealedSecret, ExternalSecret…).
# Alimenté par clusters/<cluster>/instances/<env>/secrets.yaml.
# -----------------------------------------------------------------------------
extraObjects: []

# -----------------------------------------------------------------------------
# Sous-charts. Les clés doivent correspondre EXACTEMENT aux noms des dossiers
# dans charts/ (APIs, BFFs, Fronts, database, redis, liquibase, backup,
# retention, keycloak).
# Les `instances` sont renseignées par environnement.
# -----------------------------------------------------------------------------
database:
  enabled: true
redis:
  enabled: true
liquibase:
  enabled: true
# Off by default: needs a real S3 bucket + sealed backup-secret per instance
# first. See charts/backup/README.md (MAIR-119).
backup:
  enabled: false
# Daily CronJob applying the Devops/Database retention policies (MAIR-236).
# On by default: no external provisioning needed, see charts/retention/values.yaml.
retention:
  enabled: true
# Keycloak + its own Postgres (MAIR-139). Realm, clients and sizing in
# charts/keycloak/values.yaml; <release>-keycloak-secret must be sealed
# (scripts/seal-secrets.sh) like the other per-instance Secrets.
keycloak:
  enabled: true
  ingress:
    # Added to `ingress.annotations` on the Keycloak Ingress only. Keycloak's
    # responses carry large headers (admin console, session cookies): nginx's
    # default 4k proxy buffer answers 502 "upstream sent too big header".
    annotations:
      nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    # Paths routed to Keycloak on auth.<domain> (MAIR-414, MAIR-610): only
    # what a browser needs in the instance realm. Everything else answers 404
    # from the ingress: the master realm (super-admin sign-in), any other
    # realm, the admin console (/admin), and the realm's OIDC endpoints that
    # only servers call (userinfo, discovery, certs, introspection...). Core
    # (sign-in code exchange, JWKS) and compliance-api use the in-cluster
    # Service instead (KEYCLOAK_REALM_URL / KEYCLOAK_TOKEN_URL).
    # An entry is a string (Prefix) or {path, pathType: Exact|Prefix}; `path`
    # goes through `tpl`. The render refuses a Prefix path without a trailing
    # "/" (Traefik matches Prefix as a plain string prefix) and any path
    # reaching another realm, /admin, /metrics, /health or `userinfo`
    # ("mairie360.keycloakIngressPaths" in templates/_helpers.tpl).
    paths:
      # Sign-in page of Login (MAIR-153) and of the account console.
      - path: '/realms/{{ include "mairie360.keycloakRealm" . }}/protocol/openid-connect/auth'
        pathType: Exact
      # Code exchange of the account console, a public client running in the
      # browser (PKCE). Login's own exchange is done by core-api in-cluster.
      # Closes with the account console (MAIR-611).
      - path: '/realms/{{ include "mairie360.keycloakRealm" . }}/protocol/openid-connect/token'
        pathType: Exact
      # Single sign-out (BFF_user, MAIR-143) and its confirmation page.
      - path: '/realms/{{ include "mairie360.keycloakRealm" . }}/protocol/openid-connect/logout'
        pathType: Exact
      - path: '/realms/{{ include "mairie360.keycloakRealm" . }}/protocol/openid-connect/logout/'
      # Session and third-party-cookie checks of keycloak-js (account console).
      - path: '/realms/{{ include "mairie360.keycloakRealm" . }}/protocol/openid-connect/login-status-iframe.html'
        pathType: Exact
      - path: '/realms/{{ include "mairie360.keycloakRealm" . }}/protocol/openid-connect/login-status-iframe.html/'
      - path: '/realms/{{ include "mairie360.keycloakRealm" . }}/protocol/openid-connect/3p-cookies/'
      # Login form posts, required actions (OTP / WebAuthn enrolment), e-mail
      # action links (password reset).
      - path: '/realms/{{ include "mairie360.keycloakRealm" . }}/login-actions/'
      # Account console (2FA enrolment MAIR-572, settings-front link MAIR-357)
      # and its REST API. Public until MAIR-611 closes it.
      - path: '/realms/{{ include "mairie360.keycloakRealm" . }}/account'
        pathType: Exact
      - path: '/realms/{{ include "mairie360.keycloakRealm" . }}/account/'
      # Themes, scripts and translations of the pages above.
      - /resources/

# Collector settings; switched on by global.observability.enabled above.
# See charts/observability/values.yaml.
observability:
  cockpit:
    metricsEndpoint: ""
    tracesEndpoint: ""

APIs:
  enabled: true
  resources:
    requests: { memory: "64Mi", cpu: "50m" }
    limits:   { memory: "256Mi", cpu: "500m" }
  instances: {}

BFFs:
  enabled: true
  resources:
    requests: { memory: "128Mi", cpu: "20m" }
    limits:   { memory: "512Mi", cpu: "500m" }
  instances: {}

Fronts:
  enabled: true
  resources:
    requests: { memory: "64Mi", cpu: "50m" }
    limits:   { memory: "256Mi", cpu: "500m" }
  instances: {}
